name: Tests
on:
  pull_request:
    branches: [main, gh-pages]
  push:
    branches: [gh-pages]
    paths:
      - 'data/**'
      - 'ocr_results_debug/**'
      - 'rebuild_index.py'
      - 'schema.py'
      - 'normalize_ocr.py'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pytest
      - name: OCR正規化チェック
        run: python normalize_ocr.py --check
      - name: テスト実行
        run: pytest tests/ -v --tb=short
