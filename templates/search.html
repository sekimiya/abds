<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>カード検索 - Gundam Arsenal Base Deck Simulator</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; }
        .header { background: #66f2c5; color: #222; text-align: center; padding: 1rem; font-size: 2rem; font-weight: bold; }
        a { color: #66f2c5; }

        .search-controls {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1.5rem 2rem;
            background: #2a2a2a;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-size: 1.1em;
            margin-bottom: 0.8rem;
            color: #66f2c5;
        }
        
        .control-group label span {
            font-weight: bold;
            color: #fff;
            background: #66f2c5;
            color: #222;
            padding: 0.2em 0.5em;
            border-radius: 4px;
            font-size: 0.9em;
            min-width: 40px;
            text-align: center;
            display: inline-block;
        }

        .control-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        
        #card-count {
            text-align: center;
            font-size: 1.5em;
            margin: -1rem 0 2rem 0;
            color: #ffe082;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 2rem auto;
            justify-items: center;
        }
        
        /* index.htmlからカード表示用のスタイルをコピー */
        .card-item { background: #222; border: 1.5px solid #444; border-radius: 12px; padding: 0.6rem 1rem 0.6rem 1rem; text-align: center; line-height: 1.2; padding-bottom: 1rem; width: 220px; box-sizing: border-box; margin: 0 auto; display: flex; flex-direction: column; min-height: 480px; }
        .card-item img { max-width: 220px; max-height: 330px; width: 220px; height: auto; background: #111; border-radius: 8px; margin-top: 0.3rem; margin-bottom: 0.3rem; display: block; flex-shrink: 0; }
        .card-name { margin-top: 0.15rem; margin-bottom: 0.15rem; font-size: 1.25rem; line-height: 1.2; flex-shrink: 0; height: 2.4em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
        .card-params { font-size: 0.9em; color: #b2ffb2; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-top: 0.5rem; }
        .param { background-color: #333; padding: 3px 6px; border-radius: 4px; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="header">カード検索</div>
    <div style="text-align: center; margin: 1rem;"><a href="/">← デッキシミュレーターに戻る</a></div>

    <div class="search-controls">
        <div class="control-group">
            <label for="cost">コスト: <span id="cost-value">0</span></label>
            <input type="range" id="cost" name="cost" min="0" max="10">
        </div>
        <div class="control-group">
            <label for="hp">HP: <span id="hp-value">0</span></label>
            <input type="range" id="hp" name="hp" min="0" max="1000">
        </div>
        <div class="control-group">
            <label for="mobility">機動力: <span id="mobility-value">0</span></label>
            <input type="range" id="mobility" name="mobility" min="0" max="1000">
        </div>
        <div class="control-group">
            <label for="long_range_atk">遠距離攻撃: <span id="long_range_atk-value">0</span></label>
            <input type="range" id="long_range_atk" name="long_range_atk" min="0" max="1000">
        </div>
        <div class="control-group">
            <label for="short_range_atk">近距離攻撃: <span id="short_range_atk-value">0</span></label>
            <input type="range" id="short_range_atk" name="short_range_atk" min="0" max="1000">
        </div>
    </div>
    
    <div id="card-count"></div>

    <div id="card-grid" class="card-grid">
        <!-- 検索結果のカードがここに表示されます -->
    </div>

    <script>
        let allCards = [];
        let filteredCards = [];
        let targetSlot = null; // 対象スロット番号

        // URLパラメータからスロット番号を取得
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', function() {
            // スロット番号を取得
            targetSlot = getUrlParameter('slot');
            
            // スロット番号がある場合はヘッダーを更新
            if (targetSlot !== null) {
                const header = document.querySelector('.header');
                header.textContent = `カード検索 - スロット${parseInt(targetSlot) + 1}にセット`;
                
                // 戻るリンクも更新
                const backLink = document.querySelector('a[href="/"]');
                backLink.textContent = '← デッキシミュレーターに戻る（選択したカードをセット）';
            }
            
            console.log('Search page loaded, fetching cards...');
            fetch('/fetch_cards')
                .then(res => res.json())
                .then(data => {
                    console.log('Fetched data:', data);
                    if (!data.success) {
                        document.getElementById('card-grid').innerText = 'カードデータの取得に失敗しました';
                        return;
                    }
                    allCards = data.images;
                    
                    // 重複を除去（カード番号で一意にする）
                    const uniqueCards = [];
                    const seenNumbers = new Set();
                    for (const card of allCards) {
                        if (!seenNumbers.has(card.number)) {
                            uniqueCards.push(card);
                            seenNumbers.add(card.number);
                        }
                    }
                    allCards = uniqueCards;
                    
                    console.log('All cards loaded:', allCards.length, 'cards (duplicates removed)');
                    
                    // スライダーの最大値を設定
                    setupSliders();
                    
                    // 初期表示（全カード）
                    filteredCards = [...allCards];
                    displayCards();
                })
                .catch(error => {
                    console.error('Error fetching cards:', error);
                    document.getElementById('card-grid').innerText = 'カードデータの取得中にエラーが発生しました';
                });
        });

        // スライダーの最大値を設定
        function setupSliders() {
            let maxCost = 0;
            let maxHp = 0;
            let maxMobility = 0;
            let maxLongRangeAtk = 0;
            let maxShortRangeAtk = 0;

            allCards.forEach(card => {
                if (card.ocr_data) {
                    const ocr = card.ocr_data;
                    
                    // コスト
                    if (ocr.cost) {
                        const cost = parseInt(ocr.cost, 10);
                        if (!isNaN(cost)) maxCost = Math.max(maxCost, cost);
                    }
                    
                    // HP
                    if (ocr.stats && ocr.stats.hp) {
                        const hp = parseInt(ocr.stats.hp, 10);
                        if (!isNaN(hp)) maxHp = Math.max(maxHp, hp);
                    }
                    
                    // 機動力
                    if (ocr.stats && ocr.stats.mobility) {
                        const mobility = parseInt(ocr.stats.mobility, 10);
                        if (!isNaN(mobility)) maxMobility = Math.max(maxMobility, mobility);
                    }
                    
                    // 遠距離攻撃
                    if (ocr.stats && ocr.stats.ranged_attack) {
                        const ranged = parseInt(ocr.stats.ranged_attack, 10);
                        if (!isNaN(ranged)) maxLongRangeAtk = Math.max(maxLongRangeAtk, ranged);
                    }
                    
                    // 近距離攻撃
                    if (ocr.stats && ocr.stats.melee_attack) {
                        const melee = parseInt(ocr.stats.melee_attack, 10);
                        if (!isNaN(melee)) maxShortRangeAtk = Math.max(maxShortRangeAtk, melee);
                    }
                }
            });

            // スライダーの最大値を設定
            document.getElementById('cost').max = maxCost;
            document.getElementById('hp').max = maxHp;
            document.getElementById('mobility').max = maxMobility;
            document.getElementById('long_range_atk').max = maxLongRangeAtk;
            document.getElementById('short_range_atk').max = maxShortRangeAtk;

            // 初期値を最大値に設定
            document.getElementById('cost').value = maxCost;
            document.getElementById('hp').value = maxHp;
            document.getElementById('mobility').value = maxMobility;
            document.getElementById('long_range_atk').value = maxLongRangeAtk;
            document.getElementById('short_range_atk').value = maxShortRangeAtk;

            // 表示値を更新
            updateSliderValues();

            // スライダーのイベントリスナーを設定
            setupSliderListeners();
        }

        // スライダーの表示値を更新
        function updateSliderValues() {
            document.getElementById('cost-value').textContent = document.getElementById('cost').value;
            document.getElementById('hp-value').textContent = document.getElementById('hp').value;
            document.getElementById('mobility-value').textContent = document.getElementById('mobility').value;
            document.getElementById('long_range_atk-value').textContent = document.getElementById('long_range_atk').value;
            document.getElementById('short_range_atk-value').textContent = document.getElementById('short_range_atk').value;
        }

        // スライダーのイベントリスナーを設定
        function setupSliderListeners() {
            const sliders = ['cost', 'hp', 'mobility', 'long_range_atk', 'short_range_atk'];
            sliders.forEach(sliderId => {
                const slider = document.getElementById(sliderId);
                slider.addEventListener('input', function() {
                    updateSliderValues();
                    filterCards();
                });
            });
        }

        // カードのフィルタリング
        function filterCards() {
            const costLimit = parseInt(document.getElementById('cost').value, 10);
            const hpLimit = parseInt(document.getElementById('hp').value, 10);
            const mobilityLimit = parseInt(document.getElementById('mobility').value, 10);
            const longRangeLimit = parseInt(document.getElementById('long_range_atk').value, 10);
            const shortRangeLimit = parseInt(document.getElementById('short_range_atk').value, 10);

            filteredCards = allCards.filter(card => {
                if (!card.ocr_data) return false;

                const ocr = card.ocr_data;
                
                // コストチェック
                if (ocr.cost) {
                    const cost = parseInt(ocr.cost, 10);
                    if (!isNaN(cost) && cost > costLimit) return false;
                }
                
                // パラメータチェック
                if (ocr.stats) {
                    const stats = ocr.stats;
                    
                    // HP
                    if (stats.hp) {
                        const hp = parseInt(stats.hp, 10);
                        if (!isNaN(hp) && hp > hpLimit) return false;
                    }
                    
                    // 機動力
                    if (stats.mobility) {
                        const mobility = parseInt(stats.mobility, 10);
                        if (!isNaN(mobility) && mobility > mobilityLimit) return false;
                    }
                    
                    // 遠距離攻撃
                    if (stats.ranged_attack) {
                        const ranged = parseInt(stats.ranged_attack, 10);
                        if (!isNaN(ranged) && ranged > longRangeLimit) return false;
                    }
                    
                    // 近距離攻撃
                    if (stats.melee_attack) {
                        const melee = parseInt(stats.melee_attack, 10);
                        if (!isNaN(melee) && melee > shortRangeLimit) return false;
                    }
                }
                
                return true;
            });

            displayCards();
        }

        // カードの表示
        function displayCards() {
            const cardGrid = document.getElementById('card-grid');
            const cardCount = document.getElementById('card-count');
            
            // カード数を表示
            cardCount.textContent = `検索結果: ${filteredCards.length}件`;
            
            // カードグリッドをクリア
            cardGrid.innerHTML = '';
            
            if (filteredCards.length === 0) {
                cardGrid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #888; font-size: 1.2em; padding: 2rem;">条件に合うカードが見つかりませんでした</div>';
                return;
            }
            
            // カードを表示
            filteredCards.forEach(card => {
                const cardElement = createCardElement(card);
                cardGrid.appendChild(cardElement);
            });
        }

        // カード要素の作成
        function createCardElement(card) {
            const div = document.createElement('div');
            div.className = 'card-item';
            
            // スロット番号がある場合はクリック可能にする
            if (targetSlot !== null) {
                div.style.cursor = 'pointer';
                div.style.transition = 'transform 0.2s ease, box-shadow 0.2s ease';
                div.addEventListener('mouseenter', function() {
                    this.style.transform = 'scale(1.02)';
                    this.style.boxShadow = '0 4px 12px rgba(255, 152, 0, 0.3)';
                });
                div.addEventListener('mouseleave', function() {
                    this.style.transform = 'scale(1)';
                    this.style.boxShadow = 'none';
                });
                div.addEventListener('click', function() {
                    selectCardForDeck(card);
                });
            }
            
            // カード画像
            const img = document.createElement('img');
            img.src = card.front ? card.front.url : card.url;
            img.alt = card.name;
            img.style.cursor = 'pointer';
            
            // 画像クリックで裏面表示（スロット選択モードでない場合のみ）
            let isFront = true;
            const backUrl = card.back && card.back.url ? card.back.url : null;
            img.addEventListener('click', function(e) {
                if (targetSlot !== null) {
                    // スロット選択モードの場合は、カード全体のクリックイベントを発火
                    e.stopPropagation();
                    selectCardForDeck(card);
                } else if (backUrl) {
                    // 通常モードの場合は裏面表示
                    isFront = !isFront;
                    img.src = isFront ? (card.front ? card.front.url : card.url) : backUrl;
                }
            });
            
            // カード番号
            const number = document.createElement('div');
            number.style.color = '#66f2c5';
            number.style.fontWeight = 'bold';
            number.style.fontSize = '1.1em';
            number.style.marginBottom = '0.3rem';
            number.textContent = card.number;
            
            // カード名
            const name = document.createElement('div');
            name.className = 'card-name';
            name.textContent = card.name;
            name.title = card.name;
            
            // パラメータ表示
            const params = document.createElement('div');
            params.className = 'card-params';
            
            if (card.ocr_data) {
                const ocr = card.ocr_data;
                const paramElements = [];
                
                // コスト
                if (ocr.cost) {
                    paramElements.push(`<span class="param">コスト: ${ocr.cost}</span>`);
                }
                
                // パラメータ
                if (ocr.stats) {
                    const stats = ocr.stats;
                    if (stats.hp) paramElements.push(`<span class="param">HP: ${stats.hp}</span>`);
                    if (stats.mobility) paramElements.push(`<span class="param">機動力: ${stats.mobility}</span>`);
                    if (stats.ranged_attack) paramElements.push(`<span class="param">遠距離: ${stats.ranged_attack}</span>`);
                    if (stats.melee_attack) paramElements.push(`<span class="param">近距離: ${stats.melee_attack}</span>`);
                }
                
                // カテゴリ
                if (ocr.type) {
                    const typeColor = ocr.type === 'MS' ? '#4caf50' : '#ff9800';
                    paramElements.push(`<span class="param" style="background-color: ${typeColor};">${ocr.type}</span>`);
                }
                
                params.innerHTML = paramElements.join('');
            }
            
            // スロット選択モードの場合は選択ボタンを追加
            if (targetSlot !== null) {
                const selectBtn = document.createElement('button');
                selectBtn.textContent = 'このカードを選択';
                selectBtn.style.padding = '0.5em 1em';
                selectBtn.style.borderRadius = '4px';
                selectBtn.style.border = '1px solid #ff9800';
                selectBtn.style.background = '#ff9800';
                selectBtn.style.color = '#222';
                selectBtn.style.cursor = 'pointer';
                selectBtn.style.width = '100%';
                selectBtn.style.fontSize = '0.9em';
                selectBtn.style.marginTop = '0.5em';
                selectBtn.style.fontWeight = 'bold';
                selectBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    selectCardForDeck(card);
                });
                
                div.appendChild(img);
                div.appendChild(number);
                div.appendChild(name);
                div.appendChild(params);
                div.appendChild(selectBtn);
            } else {
                div.appendChild(img);
                div.appendChild(number);
                div.appendChild(name);
                div.appendChild(params);
            }
            
            return div;
        }

        // カードをデッキにセットする関数
        function selectCardForDeck(card) {
            if (targetSlot === null) return;
            
            // ローカルストレージに選択したカード情報を保存
            const selectedCardData = {
                slot: parseInt(targetSlot),
                cardNumber: card.number,
                cardName: card.name,
                timestamp: new Date().toISOString()
            };
            
            localStorage.setItem('selectedCardForDeck', JSON.stringify(selectedCardData));
            
            // デッキシミュレーターに戻る
            window.location.href = '/';
        }
    </script>
</body>
</html>
