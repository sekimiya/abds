<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deck Summary 2</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #0f141b;
      --card: #121922;
      --muted: #95a3b8;
      --text: #e8eef7;
      --accent: #68e1fd;
      --accent-2: #7cf7c6;
      --danger: #ff6b6b;
      --warning: #ffd166;
      --success: #2dd4bf;
      --border: #1f2a37;
      --shadow: 0 10px 40px rgba(0,0,0,0.45);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 800px at 80% -10%, rgba(104,225,253,0.06), transparent 50%),
        radial-gradient(900px 700px at -10% 20%, rgba(124,247,198,0.05), transparent 50%),
        linear-gradient(transparent 97%, rgba(255,255,255,0.04) 98%),
        linear-gradient(90deg, transparent 97%, rgba(255,255,255,0.04) 98%),
        var(--bg);
      background-size: 24px 24px, 24px 24px, 32px 32px, 32px 32px, auto;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 24px;
    }

    .shell {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 18px;
    }

    .toolbar {
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }
    .title {
      display: flex; align-items: center; gap: 12px;
    }
    .title .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px rgba(104,225,253,0.8);
    }
    .title h1 { margin: 0; font-size: 18px; letter-spacing: .4px; }
    .actions { display: flex; gap: 8px; }
    .btn {
      background: linear-gradient(180deg, #1b2632, #121a22);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      transition: transform .08s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .btn:hover { border-color: #284154; box-shadow: 0 6px 20px rgba(40,65,84,.35); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: linear-gradient(180deg, #1a2f3b, #12252f); border-color: #2b5368; color: #cff3ff; }

    /* Top bar like simulator */
    .topbar { display: grid; grid-template-columns: 140px 1fr; gap: 24px; align-items: center; }
    .big-total { font-size: 56px; font-weight: 900; color: #7cf7c6; letter-spacing: 1px; }
    .topmenu { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
    .topmenu .mi { color: var(--muted); font-size: 14px; }
    .topmenu .toggle { padding: 4px 10px; border: 1px solid var(--border); border-radius: 20px; background: var(--card); }

    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
    .metric-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px;
      display: grid; gap: 8px; align-content: start;
    }
    .metric-title { color: var(--muted); font-size: 12px; }
    .metric-value { font-weight: 800; font-size: 22px; letter-spacing: .3px; }
    .metric-sub { color: var(--muted); font-size: 12px; }
    .tag { padding: 2px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--border); }
    .tag.red { color: #ff8a8a; background: rgba(255,77,77,.1); border-color: #3b2222; }
    .tag.blue { color: #8ad7ff; background: rgba(61,141,255,.1); border-color: #233047; }
    .tag.green{ color: #7cf7c6; background: rgba(61,255,141,.1); border-color: #1f3a2c; }

    .units {
      display: grid; gap: 14px; grid-template-columns: repeat(5, minmax(0,1fr));
    }
    .unit {
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
      border: 1px solid var(--border);
      border-radius: 14px; padding: 10px; display: grid; gap: 8px;
    }
    .unit-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .unit-title { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
    .type-pill { background: #0c1218; border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; font-size: 11px; color: #aee9fb; }
    .unit-cost { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; color: var(--accent); }

    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .card-tile { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; aspect-ratio: 3/4; display: grid; place-items: center; }
    .card-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge { position: absolute; top: 8px; left: 8px; padding: 2px 8px; border-radius: 999px; font-size: 11px; background: rgba(0,0,0,.4); border: 1px solid var(--border); }
    .label { font-size: 11px; color: var(--muted); }
    .name { font-weight: 700; font-size: 12px; min-height: 30px; }

    .progress { background: #0c1218; border: 1px solid var(--border); height: 10px; border-radius: 999px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: linear-gradient(90deg, #2196f3, #64b5f6); }

    /* detailed sections */
    .section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .section h4 { margin: 0 0 8px 0; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .2px; }
    .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px; font-size: 12px; }
    .kv div { padding: 2px 0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 4px; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; text-align: left; font-size: 12px; }
    .stat b { float: right; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .stat .lab { color: var(--muted); }

    /* Parameters */
    .param-grid { display: grid; gap: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 3px 8px; font-size: 11px; color: var(--text); }
    .chip.hl { border-color: #2b5368; color: #cff3ff; }

    .terrain { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 11px; }
    .apt { font-weight: 800; padding: 0 6px; border-radius: 6px; border: 1px solid var(--border); }
    .apt-s { color: #ffd166; background: rgba(255,209,102,.08); border-color: #3b3626; }
    .apt-a { color: #8ad7ff; background: rgba(61,141,255,.08); border-color: #263549; }
    .apt-b { color: #7cf7c6; background: rgba(61,255,141,.06); border-color: #1f3a2c; }
    .apt-c { color: #95a3b8; background: rgba(149,163,184,.08); border-color: #2b3442; }

    .links { display: flex; gap: 6px; flex-wrap: wrap; }
    .link { background: rgba(104,225,253,.08); color: #aee9fb; border: 1px solid #284154; border-radius: 999px; padding: 2px 8px; font-size: 10.5px; }

    /* Raw JSON viewer */
    .json-viewer { background: #0c1218; border: 1px solid var(--border); border-radius: 12px; padding: 12px; overflow: auto; max-height: 360px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    details.json-block { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    details.json-block > summary { cursor: pointer; outline: none; user-select: none; color: var(--muted); }

    .legend { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    .pill { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); }

    @media (max-width: 1200px) { .units { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 800px)  { .units { grid-template-columns: repeat(2, 1fr); } .metrics{ grid-template-columns: repeat(2,1fr);} }
    @media (max-width: 560px)  { .units { grid-template-columns: 1fr; } .toolbar{flex-direction:column; align-items:flex-start; gap:10px;} }
  </style>
</head>
<body>
  <div class="shell">
    <div class="toolbar">
      <div class="topbar">
        <div class="big-total" id="sumTotal">0</div>
        <div class="topmenu">
          <span class="mi">Deck Cost</span>
          <span class="mi">Level On/Off</span>
          <span class="mi">Ground</span>
          <span class="mi">Space</span>
          <span class="mi">Marine</span>
          <span class="mi">Desert</span>
          <span class="mi">Main Command</span>
          <span class="mi">Sub Command</span>
          <span class="toggle">殲滅:<b id="sumA">0</b></span>
          <span class="toggle">制圧:<b id="sumS">0</b></span>
          <span class="toggle">防衛:<b id="sumD">0</b></span>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="reload">再読込</button>
        <button class="btn" id="randomize">ランダム</button>
        <button class="btn primary" id="export">画像として保存</button>
      </div>
    </div>

    <div class="panel">
      <div class="units" id="units">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>

  <script>
    let allCards = [];
    let selected = new Array(10).fill(null);

    function isValid(v){ if(v===null||v===undefined) return false; if(typeof v==='string') return v.trim()!=='' && v!=='null' && v!=='undefined'; return true; }
    function get(obj, path){ return path.split('.').reduce((p,c)=> (p && p[c]!==undefined)?p[c]:null, obj); }

    function readCookie(name){
      const nameEQ = name + "=";
      const ca = document.cookie.split(';');
      for (let i=0; i<ca.length; i++){
        let c = ca[i];
        while (c.charAt(0) === ' ') c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) === 0) {
          try { return JSON.parse(decodeURIComponent(c.substring(nameEQ.length, c.length))); } catch(e){ return null; }
        }
      }
      return null;
    }

    function buildSampleDeck(){
      // 先頭5+5（後方互換）
      const ms = allCards.filter(c=> c && c.ocr_data && (c.ocr_data.type || c.category)==='MS').slice(0,5);
      const pl = allCards.filter(c=> c && c.ocr_data && (c.ocr_data.type || c.category)==='PL').slice(0,5);
      return [...ms, ...pl];
    }

    function pickRandom(arr, n){
      const a = arr.slice().filter(Boolean);
      for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
      return a.slice(0, n);
    }

    function pickRandomUnits(){
      const ms = allCards.filter(c=> c && c.ocr_data && (c.ocr_data.type || c.category)==='MS');
      const pl = allCards.filter(c=> c && c.ocr_data && (c.ocr_data.type || c.category)==='PL');
      const msPick = pickRandom(ms, 5);
      const plPick = pickRandom(pl, 5);
      return [...msPick, ...plPick];
    }

    async function load(){
      // debug=1 で ocr_results_debug を利用
      const res = await fetch('/fetch_cards?debug=1');
      const data = await res.json();
      allCards = data.images || [];

      const deck = readCookie('gundamAutoSave');
      if(deck && deck.cards){
        selected = deck.cards.map(c=> allCards.find(x=> x && x.number === c.number) || null);
        // デバッグJSONが無いカードばかりだと数値が出ないため、自動でサンプルにフォールバック
        const okCount = selected.filter(c => c && c.ocr_data).length;
        if (okCount < 6) {
          selected = pickRandomUnits();
        }
      } else {
        selected = pickRandomUnits();
      }
      render();
    }

    function stat(card, key){
      const v = get(card, `ocr_data.${key}`);
      const n = parseInt(v, 10);
      return isFinite(n) ? n : 0;
    }

    function escapeHtml(str){
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' };
      return String(str).replace(/[&<>"]/g, m => map[m]);
    }

    function render(){
      const unitsEl = document.getElementById('units');
      unitsEl.innerHTML = '';

      let sumHp=0, sumM=0, sumR=0, sumA=0, sumS=0, sumD=0;

      for(let i=0;i<5;i++){
        const ms = selected[i];
        const pl = selected[i+5];

        const msCost = stat(ms, 'cost');
        const plCost = stat(pl, 'cost');
        const unitCost = msCost + plCost;
        const msType = get(ms,'ocr_data.type') || get(ms,'category');
        const plType = get(pl,'ocr_data.type') || get(pl,'category');
        const type = msType || plType || '';
        if(type==='殲滅') sumA += unitCost; else if(type==='制圧') sumS += unitCost; else if(type==='防衛') sumD += unitCost;

        sumHp += stat(ms,'stats.hp') + stat(pl,'stats.hp');
        sumM  += stat(ms,'stats.melee_attack') + stat(pl,'stats.melee_attack');
        sumR  += stat(ms,'stats.ranged_attack') + stat(pl,'stats.ranged_attack');

        const msImg = get(ms,'front.image_url') || '';
        const plImg = get(pl,'front.image_url') || '';
        const msName = ms ? `${ms.number||''} ${ms.name||''}` : '-';
        const plName = pl ? `${pl.number||''} ${pl.name||''}` : '-';

        // per-unit parameters
        const hpUnit = stat(ms,'stats.hp') + stat(pl,'stats.hp');
        const mobUnit = stat(ms,'stats.mobility') + stat(pl,'stats.mobility');
        const meleeUnit = stat(ms,'stats.melee_attack') + stat(pl,'stats.melee_attack');
        const rangedUnit = stat(ms,'stats.ranged_attack') + stat(pl,'stats.ranged_attack');

        // terrain for MS side
        function terrainHTML(card){
          if(!card) return '';
          const t = get(card,'ocr_data.terrain_compatibility');
          if(!t) return '';
          const lbl = (k)=>({ground:'地',space:'宇',desert:'砂',water:'水'})[k]||k;
          const grade = (v)=> v ? ('apt apt-' + v.toString().toLowerCase()) : '';
          return `<div class="terrain">
                    <span>地形</span>
                    <span>${lbl('ground')}:<span class="${grade(t.ground)}">${t.ground||'-'}</span></span>
                    <span>${lbl('space')}:<span class="${grade(t.space)}">${t.space||'-'}</span></span>
                    <span>${lbl('desert')}:<span class="${grade(t.desert)}">${t.desert||'-'}</span></span>
                    <span>${lbl('water')}:<span class="${grade(t.water)}">${t.water||'-'}</span></span>
                  </div>`;
        }

        function linksHTML(card){
          const list = [];
          const arr = get(card,'ocr_data.link_abilities');
          if(Array.isArray(arr)){
            arr.forEach(l=>{ if(l && l.name) list.push(l.name); });
          }
          return list.length? list.slice(0,6).map(n=>`<span class="link">${n}</span>`).join('') : '';
        }

        function weaponHTML(card){
          if(!card) return '';
          const w = get(card,'ocr_data.weapon');
          if(!w) return '';
          const m = w.main || {}; const s = w.sub || {};
          return `<div class="grid-2">
                   <div class="section"><h4>メイン武器</h4><div class="kv"><div>名称</div><div>${escapeHtml(m.name||'-')}</div><div>射程</div><div>${isValid(m.range)?m.range:'-'}</div><div>種別</div><div>${escapeHtml(m.type||'-')}</div></div></div>
                   <div class="section"><h4>サブ武器</h4><div class="kv"><div>名称</div><div>${escapeHtml(s.name||'-')}</div><div>射程</div><div>${isValid(s.range)?s.range:'-'}</div><div>種別</div><div>${escapeHtml(s.type||'-')}</div></div></div>
                 </div>`;
        }

        function abilityHTML(title, obj){
          if(!obj) return '';
          const name = obj.name || obj.title;
          const cost = obj.cost; const typeTxt = obj.type; const range = obj.range; const desc = obj.description || obj.effect;
          return `<div class="section"><h4>${title}</h4><div class="kv">
                    <div>名称</div><div>${escapeHtml(name||'-')}</div>
                    <div>タイプ</div><div>${escapeHtml(typeTxt||'-')}</div>
                    <div>射程/コスト</div><div>${isValid(range)?range:'-'} / ${isValid(cost)?cost:'-'}</div>
                    <div>説明</div><div>${escapeHtml(desc||'-')}</div>
                  </div></div>`;
        }

        function specialHTML(card){
          const sp = get(card,'ocr_data.special_attack');
          if(!sp) return '';
          return `<div class="section"><h4>SP</h4><div class="kv">
                    <div>名称</div><div>${escapeHtml(sp.name||'-')}</div>
                    <div>対象/種別</div><div>${escapeHtml(sp.target||'-')} / ${escapeHtml(sp.type||'-')}</div>
                    <div>射程/威力</div><div>${isValid(sp.range)?sp.range:'-'} / ${isValid(sp.power)?sp.power:'-'}</div>
                    <div>説明</div><div>${escapeHtml(sp.description||'-')}</div>
                  </div></div>`;
        }

        function uspHTML(card){
          const usp = get(card,'ocr_data.usp');
          if(!usp) return '';
          return `<div class="section"><h4>USP</h4><div class="kv">
                    <div>名称</div><div>${escapeHtml(usp.name||'-')}</div>
                    <div>条件</div><div>${escapeHtml(usp.condition||'-')}</div>
                    <div>効果</div><div>${escapeHtml(usp.effect||'-')}</div>
                    <div>制限/コスト</div><div>${escapeHtml(usp.limitation||'-')} / ${isValid(usp.activation_cost)?usp.activation_cost:'-'}</div>
                  </div></div>`;
        }

        const unit = document.createElement('div');
        unit.className = 'unit';
        const sources = (get(ms,'debug_sources')||get(pl,'debug_sources')||[]).map(s=>`<span class="chip">${s}</span>`).join('');
        const rawJson = escapeHtml(JSON.stringify({ ms: ms?ms.ocr_data:null, pl: pl?pl.ocr_data:null }, null, 2));

        unit.innerHTML = `
          <div class="unit-head">
            <div class="unit-title">${i+1}番機</div>
            <div class="unit-cost">${unitCost}</div>
          </div>
          <div class="pair">
            <div class="card-tile" title="MS">
              <span class="badge">MS</span>
              ${msImg ? `<img src="${msImg}" alt="MS">` : ''}
            </div>
            <div class="card-tile" title="PL">
              <span class="badge">PL</span>
              ${plImg ? `<img src="${plImg}" alt="PL">` : ''}
            </div>
          </div>
          <div class="label">カード名</div>
          <div class="name">${msName}<br>${plName}</div>
          <div class="stats-row">
            <div class="stat"><span class="lab">機動</span> <b>${mobUnit}</b></div>
            <div class="stat"><span class="lab">近距離</span> <b>${meleeUnit}</b></div>
            <div class="stat"><span class="lab">遠距離</span> <b>${rangedUnit}</b></div>
            <div class="stat"><span class="lab">HP</span> <b>${hpUnit}</b></div>
          </div>
          <div class="param-grid">
            <div class="chips">
              <span class="chip">MSコスト ${msCost}</span>
              <span class="chip">PLコスト ${plCost}</span>
              <span class="chip hl">HP ${hpUnit}</span>
              <span class="chip">機動 ${mobUnit}</span>
              <span class="chip">近 ${meleeUnit}</span>
              <span class="chip">遠 ${rangedUnit}</span>
            </div>
            ${terrainHTML(ms)}
            <div class="links">${linksHTML(ms)}${linksHTML(pl)}</div>
            ${sources ? `<div class="chips">${sources}</div>` : ''}
            <details class="json-block">
              <summary>このユニットのJSONを表示</summary>
              <pre class="json-viewer">${rawJson}</pre>
            </details>
          </div>
        `;
        unitsEl.appendChild(unit);
      }

      const total = sumA + sumS + sumD;
      document.getElementById('sumTotal').textContent = total;
      document.getElementById('sumA').textContent = sumA;
      document.getElementById('sumS').textContent = sumS;
      document.getElementById('sumD').textContent = sumD;
      document.getElementById('sumHp').textContent = sumHp;
      document.getElementById('sumMelee').textContent = sumM;
      document.getElementById('sumRanged').textContent = sumR;
      const norm = v => Math.max(5, Math.min(100, Math.round((v/4000)*100)));
      document.getElementById('barMelee').style.width = norm(sumM) + '%';
      document.getElementById('barRanged').style.width = norm(sumR) + '%';
    }

    document.getElementById('reload').addEventListener('click', load);
    document.getElementById('export').addEventListener('click', async ()=>{
      // 簡易: ブラウザの印刷ダイアログ
      window.print();
    });
    document.getElementById('randomize').addEventListener('click', ()=>{ selected = pickRandomUnits(); render(); });

    load();
  </script>
</body>
</html>
