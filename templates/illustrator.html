<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ガンダムアーセナルベース イラストレータ別カード一覧</title>
    <style>
        body { 
            background: #1a1a1a; 
            color: #fff; 
            font-family: sans-serif; 
            margin: 0;
            padding: 20px;
        }
        .header {
            background: #1a472a;
            color: #fff;
            text-align: center;
            padding: 1rem;
            font-size: 2rem;
            margin-bottom: 2rem;
        }
        .controls {
            max-width: 1200px;
            margin: 0 auto 2rem auto;
            text-align: center;
        }
        .illustrator-select {
            padding: 0.5rem 1rem;
            font-size: 1.1rem;
            border-radius: 6px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            min-width: 300px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card-item {
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }
        .card-item img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }
        .card-number {
            color: #4caf50;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }
        .card-name {
            font-size: 0.9rem;
            line-height: 1.2;
            margin-bottom: 0.3rem;
        }
        .illustrator-name {
            color: #ffe082;
            font-size: 0.8rem;
            font-style: italic;
        }
        .back-link {
            text-align: center;
            margin: 2rem 0;
        }
        .back-link a {
            color: #4caf50;
            text-decoration: none;
            font-size: 1.1em;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .no-cards {
            text-align: center;
            color: #888;
            font-size: 1.2rem;
            margin: 2rem 0;
        }
    </style>
</head>
<body>
    <div class="header">イラストレータ別カード一覧</div>
    
    <div class="controls">
        <select id="illustratorSelect" class="illustrator-select">
            <option value="">イラストレータを選択してください</option>
        </select>
    </div>
    
    <div id="cardGrid" class="card-grid"></div>
    
    <div class="back-link">
        <a href="/">← デッキビルダーに戻る</a>
    </div>

    <script>
        let allCards = [];
        let illustratorCards = {};

        document.addEventListener('DOMContentLoaded', function() {
            // カードデータを取得
            fetch('/fetch_cards')
                .then(res => res.json())
                .then(data => {
                    if (!data.success) {
                        document.getElementById('cardGrid').innerHTML = '<div class="no-cards">カードデータの取得に失敗しました</div>';
                        return;
                    }
                    allCards = data.images;
                    
                    // イラストレータ情報を取得してカードを分類
                    categorizeCardsByIllustrator();
                });
        });

        function categorizeCardsByIllustrator() {
            const illustrators = new Set();
            
            // 各カードのOCRデータを取得してイラストレータ情報を抽出
            const promises = allCards.map(card => {
                const ocrFile = `ocr_results/${card.number}_b_ocr.json`;
                return fetch(ocrFile)
                    .then(res => res.ok ? res.json() : null)
                    .then(data => {
                        if (data) {
                            try {
                                const match = data.ocr_result.match(/```json\n([\s\S]*)```/);
                                if (match) {
                                    const ocrJson = JSON.parse(match[1]);
                                    const illustrator = ocrJson.著者情報?.イラストレータ || '不明';
                                    illustrators.add(illustrator);
                                    
                                    if (!illustratorCards[illustrator]) {
                                        illustratorCards[illustrator] = [];
                                    }
                                    illustratorCards[illustrator].push(card);
                                }
                            } catch (e) {
                                // OCRデータの解析に失敗した場合はスキップ
                            }
                        }
                    })
                    .catch(() => {
                        // ファイルが見つからない場合はスキップ
                    });
            });

            Promise.all(promises).then(() => {
                // ドロップダウンリストを更新
                updateIllustratorSelect(Array.from(illustrators).sort());
            });
        }

        function updateIllustratorSelect(illustrators) {
            const select = document.getElementById('illustratorSelect');
            select.innerHTML = '<option value="">イラストレータを選択してください</option>';
            
            illustrators.forEach(illustrator => {
                const option = document.createElement('option');
                option.value = illustrator;
                option.textContent = `${illustrator} (${illustratorCards[illustrator]?.length || 0}枚)`;
                select.appendChild(option);
            });

            // 選択時のイベントリスナーを追加
            select.addEventListener('change', function() {
                displayCardsByIllustrator(this.value);
            });
        }

        function displayCardsByIllustrator(illustrator) {
            const cardGrid = document.getElementById('cardGrid');
            
            if (!illustrator) {
                cardGrid.innerHTML = '<div class="no-cards">イラストレータを選択してください</div>';
                return;
            }

            const cards = illustratorCards[illustrator] || [];
            
            if (cards.length === 0) {
                cardGrid.innerHTML = '<div class="no-cards">該当するカードが見つかりません</div>';
                return;
            }

            cardGrid.innerHTML = '';
            
            cards.forEach(card => {
                const div = document.createElement('div');
                div.className = 'card-item';
                
                const img = document.createElement('img');
                img.src = card.url;
                img.alt = card.name;
                
                const number = document.createElement('div');
                number.className = 'card-number';
                number.textContent = card.number;
                
                const name = document.createElement('div');
                name.className = 'card-name';
                name.textContent = card.name;
                
                const illustratorName = document.createElement('div');
                illustratorName.className = 'illustrator-name';
                illustratorName.textContent = illustrator;
                
                div.appendChild(img);
                div.appendChild(number);
                div.appendChild(name);
                div.appendChild(illustratorName);
                cardGrid.appendChild(div);
            });
        }
    </script>
</body>
</html>
