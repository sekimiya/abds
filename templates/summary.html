<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Deck Summary</title>
    <style>
        body { background: #1a1a1a; color: #e0e0e0; font-family: 'Meiryo UI', 'Hiragino Kaku Gothic ProN', sans-serif; }
        .container { max-width: 95vw; margin: 15px auto; padding: 15px; background: #222; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td {
            border: 1px solid #444;
            padding: 6px;
            text-align: center;
            font-size: 13px;
            vertical-align: middle;
            white-space: normal;
            word-break: break-word;
            box-sizing: border-box;
        }
        th { background: #333; color: #66f2c5; font-weight: bold; }
        .row-header { width: 7%; font-weight: bold; background-color: #2c2c2c; }
        .unit-header { background-color: #282828; }

        .ms-col { width: 7.5%; }
        .pl-col { width: 7.5%; }
        .total-col { width: 3.6%; }

        .card-image-container { height: 170px; padding: 2px; }
        .card-image { max-width: 100%; max-height: 100%; object-fit: contain; cursor: pointer; }
        .card-name { height: 40px; font-size: 12px; }
        .stat-bar-container { background: #444; border-radius: 3px; height: 16px; position: relative; width: 100%; }
        .stat-bar { background: linear-gradient(to right, #2196f3, #64b5f6); height: 100%; border-radius: 3px; position: absolute; top: 0; left: 0; }
        .stat-value { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); font-size: 11px; color: #fff; text-shadow: 1px 1px 2px #000; font-weight: bold; }
        .total-value { font-weight: bold; font-size: 14px; }

        .cost-annihilation { background: #e91e63; color: white; border-radius: 5px; padding: 3px 6px; display: inline-block; }
        .cost-suppression { background: #2196f3; color: white; border-radius: 5px; padding: 3px 6px; display: inline-block; }
        .cost-defense { background: #4caf50; color: white; border-radius: 5px; padding: 3px 6px; display: inline-block; }
        
        .aptitude-s { color: #ff5252; font-weight: bold; font-size: 15px; }
        .aptitude-a { color: #ffeb3b; font-size: 14px; }
        .aptitude-b { color: #e0e0e0; }
        .aptitude-c { color: #9e9e9e; }
        .link-active { background: #1a334a; color: #bbdefb; font-weight: bold; }
        .link-item { padding: 2px; margin: 1px 0; border-radius: 3px; }
        .sq-link-active { background: #4a1a4a; color: #f8bbd9; font-weight: bold; }
        .skill-cell { height: 90px; overflow-y: auto; text-align: left; padding: 8px; font-size: 12px; line-height: 1.3; }
        #loading { text-align: center; font-size: 20px; padding: 50px; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #2c2c2c;
            border-radius: 10px;
            width: 90%;
            max-width: 1400px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #444;
        }
        .modal-header h2 {
            margin: 0;
            color: #66f2c5;
        }
        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            line-height: 1;
        }
        .modal-body {
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .modal-card {
            background: #333;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            border: 1px solid #444;
        }
        .modal-card:hover {
            background: #4a4a4a;
            transform: translateY(-5px);
            border-color: #66f2c5;
        }
        .modal-card img {
            width: 100%;
            border-radius: 5px;
        }
        .modal-card-name {
            font-size: 13px;
            margin-top: 8px;
            color: #e0e0e0;
        }
        .modal-filters {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            border-bottom: 1px solid #444;
            background: #333;
        }
        .filter-select {
            background: #444;
            color: #e0e0e0;
            border: 1px solid #666;
            border-radius: 5px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
        }
        .filter-select:focus {
            outline: none;
            border-color: #66f2c5;
        }
        .modal-card-series {
            font-size: 11px;
            margin-top: 4px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">デッキデータを読み込み中...</div>
        <table id="summaryTable" style="display:none;">
            <thead>
                <tr>
                    <th class="row-header" rowspan="2"></th>
                    <th class="unit-header" colspan="3">1番機</th>
                    <th class="unit-header" colspan="3">2番機</th>
                    <th class="unit-header" colspan="3">3番機</th>
                    <th class="unit-header" colspan="3">4番機</th>
                    <th class="unit-header" colspan="3">5番機</th>
                </tr>
                <tr>
                    <th class="ms-col">MS</th><th class="pl-col">PL</th><th class="total-col">合計</th>
                    <th class="ms-col">MS</th><th class="pl-col">PL</th><th class="total-col">合計</th>
                    <th class="ms-col">MS</th><th class="pl-col">PL</th><th class="total-col">合計</th>
                    <th class="ms-col">MS</th><th class="pl-col">PL</th><th class="total-col">合計</th>
                    <th class="ms-col">MS</th><th class="pl-col">PL</th><th class="total-col">合計</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th class="row-header">総コスト</th>
                    <td id="totalCost" colspan="15" style="font-size: 24px; font-weight: bold; color: #ffeb3b;"></td>
                </tr>
                <tr>
                    <th class="row-header">地形補正</th>
                    <td id="terrain" colspan="15"></td>
                </tr>
                <!-- Card Images -->
                <tr>
                    <th class="row-header"></th>
                    <td class="card-image-container ms-col"><img id="ms-img-0" class="card-image"></td>
                    <td class="card-image-container pl-col"><img id="pl-img-0" class="card-image"></td>
                    <td class="total-col"></td>
                    <td class="card-image-container ms-col"><img id="ms-img-1" class="card-image"></td>
                    <td class="card-image-container pl-col"><img id="pl-img-1" class="card-image"></td>
                    <td class="total-col"></td>
                    <td class="card-image-container ms-col"><img id="ms-img-2" class="card-image"></td>
                    <td class="card-image-container pl-col"><img id="pl-img-2" class="card-image"></td>
                    <td class="total-col"></td>
                    <td class="card-image-container ms-col"><img id="ms-img-3" class="card-image"></td>
                    <td class="card-image-container pl-col"><img id="pl-img-3" class="card-image"></td>
                    <td class="total-col"></td>
                    <td class="card-image-container ms-col"><img id="ms-img-4" class="card-image"></td>
                    <td class="card-image-container pl-col"><img id="pl-img-4" class="card-image"></td>
                    <td class="total-col"></td>
                </tr>
                <!-- Card Names -->
                <tr>
                    <th class="row-header"></th>
                    <td class="card-name ms-col" id="ms-name-0"></td>
                    <td class="card-name pl-col" id="pl-name-0"></td>
                    <td class="total-col"></td>
                    <td class="card-name ms-col" id="ms-name-1"></td>
                    <td class="card-name pl-col" id="pl-name-1"></td>
                    <td class="total-col"></td>
                    <td class="card-name ms-col" id="ms-name-2"></td>
                    <td class="card-name pl-col" id="pl-name-2"></td>
                    <td class="total-col"></td>
                    <td class="card-name ms-col" id="ms-name-3"></td>
                    <td class="card-name pl-col" id="pl-name-3"></td>
                    <td class="total-col"></td>
                    <td class="card-name ms-col" id="ms-name-4"></td>
                    <td class="card-name pl-col" id="pl-name-4"></td>
                    <td class="total-col"></td>
                </tr>
                <!-- Rows for stats will be generated by JS -->
            </tbody>
        </table>
    </div>
    
    <!-- Card Selection Modal -->
    <div id="selection-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">カードを選択</h2>
                <button class="modal-close" onclick="closeSelectionModal()">&times;</button>
            </div>
            <div class="modal-filters">
                <select class="filter-select" id="series-filter">
                    <option value="">すべての収録弾</option>
                </select>
            </div>
            <div class="modal-body" id="modal-card-list">
                <!-- Card list will be populated here -->
            </div>
        </div>
    </div>

    <script>
        let allCards = [];
        let selectedCards = [];
        let seriesLabels = {}; // 収録弾数の表示名マッピング

        // シリーズコードとIDのマッピング
        const seriesCodeToId = {
            'FQ01': '529015', 'FQ02': '529016', 'FQ03': '529017',
            'UT01': '529113', 'UT02': '529114', 'UT03': '529115', 'UT04': '529116', 'UT05': '529117', 'UT06': '529118',
            'AB01': '529001', 'AB02': '529002', 'AB03': '529003', 'AB04': '529004', 'AB05': '529005', 'AB06': '529006',
            'AB07': '529007', 'AB08': '529008', 'AB09': '529009', 'AB10': '529010', 'AB11': '529011', 'AB12': '529012',
            'AB13': '529013', 'AB14': '529014'
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const loadingEl = document.getElementById('loading');
            const tableEl = document.getElementById('summaryTable');

            try {
                // シリーズ情報を読み込み
                const seriesRes = await fetch('/series_list');
                if (seriesRes.ok) {
                    const seriesData = await seriesRes.json();
                    seriesData.forEach(series => {
                        seriesLabels[series.id] = series.label;
                    });
                }

                // Fetch all cards data
                const cardsRes = await fetch('/fetch_cards');
                const cardsData = await cardsRes.json();
                if (!cardsData.success) throw new Error('カードデータの取得に失敗しました');
                allCards = cardsData.images;

                // Load deck data from cookie/localStorage
                const deckData = getDeckData();
                if (!deckData || !deckData.cards) {
                    loadingEl.textContent = '表示するデッキデータがありません。メインページでデッキを構築してください。';
                    return;
                }
                
                selectedCards = deckData.cards.map(c => {
                    if (!c.number) return null;
                    return allCards.find(card => card.number === c.number);
                });

                populateTable(selectedCards);
                
                loadingEl.style.display = 'none';
                tableEl.style.display = '';

            } catch (error) {
                loadingEl.textContent = `エラー: ${error.message}`;
                console.error(error);
            }
        });

        function getDeckData() {
            // Try to get data from cookie first, then localStorage
            const cookieDeck = getCookie('gundamAutoSave');
            if (cookieDeck) return cookieDeck;
            
            // Fallback for decks saved in older versions
            const localDeck = localStorage.getItem('gundamAutoSave');
            if(localDeck) return JSON.parse(localDeck);

            return null;
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) {
                    try {
                        return JSON.parse(decodeURIComponent(c.substring(nameEQ.length, c.length)));
                    } catch (e) { return null; }
                }
            }
            return null;
        }
        
        function setCookie(name, value, days = 30) {
            const expires = new Date();
            expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${encodeURIComponent(JSON.stringify(value))};expires=${expires.toUTCString()};path=/`;
        }

        function saveDeckData() {
            const deckData = {
                timestamp: new Date().toISOString(),
                cards: selectedCards.map((card, index) => ({
                    index: index,
                    number: card ? card.number : null,
                    name: card ? card.name : ''
                }))
            };
            setCookie('gundamAutoSave', deckData, 30);
        }


        function populateTable(cards) {
            const tbody = document.querySelector('#summaryTable tbody');
            // Clear existing data rows except for header, cost, terrain, images, names
            while (tbody.children.length > 4) {
                tbody.removeChild(tbody.lastChild);
            }

            let totalCost = 0;

            // リンクアビリティのバフを計算
            updateAllLinkAbilities();

            // Populate images and names
            for (let i = 0; i < 5; i++) {
                const ms = cards[i];
                const pl = cards[i + 5];
                
                const msImgEl = document.getElementById(`ms-img-${i}`);
                msImgEl.src = ms ? ms.front.url : '';
                msImgEl.onclick = () => openSelectionModal(i, 'MS');

                const plImgEl = document.getElementById(`pl-img-${i}`);
                plImgEl.src = pl ? pl.front.url : '';
                plImgEl.onclick = () => openSelectionModal(i, 'PL');

                document.getElementById(`ms-name-${i}`).textContent = ms ? `${ms.number} ${ms.name}` : '-';
                document.getElementById(`pl-name-${i}`).textContent = pl ? `${pl.number} ${pl.name}` : '-';
            
                if(ms && ms.ocr_data && ms.ocr_data.cost) totalCost += parseInt(ms.ocr_data.cost, 10);
                if(pl && pl.ocr_data && pl.ocr_data.cost) totalCost += parseInt(pl.ocr_data.cost, 10);
            }
            document.getElementById('totalCost').textContent = totalCost;
            document.getElementById('terrain').textContent = '（未実装）';

            // Data rows definition
            const rows = [
                { header: 'レベル', ms_key: 'level', pl_key: 'level' },
                { header: 'タイプ', ms_key: 'type', pl_key: 'type', formatter: formatType },
                { header: 'コスト', ms_key: 'cost', pl_key: 'cost', total: true, formatter: formatCost },
                { header: '機動力', ms_key: 'stats.mobility', pl_key: 'stats.mobility', total: true, bar: true, max: 800 },
                { header: '遠距離攻撃力', ms_key: 'stats.ranged_attack', pl_key: 'stats.ranged_attack', total: true, bar: true, max: 800 },
                { header: '近距離攻撃力', ms_key: 'stats.melee_attack', pl_key: 'stats.melee_attack', total: true, bar: true, max: 800 },
                { header: 'HP', ms_key: 'stats.hp', pl_key: 'stats.hp', total: true, bar: true, max: 2000 },
                { header: '射程/適正', ms_key: 'special_attack.range', pl_key: 'terrain', formatter: formatRangeAptitude },
                { header: 'リンクアビリティ(MS)', ms_key: 'link_abilities', formatter: formatLinkAbility, colspan: 2 },
                { header: 'リンクアビリティ(PL)', pl_key: 'link_abilities', formatter: formatLinkAbility, colspan: 2 },
                { header: 'MSアビリティ', ms_key: 'ms_ability', formatter: formatSkill, colspan: 3, isSkill: true },
                { header: 'PLスキル', pl_key: 'pl_skill', formatter: formatSkill, colspan: 3, isSkill: true },
                { header: '戦術技', ms_key: 'special_attack', pl_key: 'special_attack', formatter: formatSP },
                { header: 'UNITED SP/SQUAD SP', ms_key: 'squad_sp', pl_key: 'squad_sp', formatter: formatSquadSP, colspan: 3 }
            ];

            rows.forEach(def => {
                const tr = document.createElement('tr');
                const th = document.createElement('th');
                th.className = 'row-header';
                th.textContent = def.header;
                tr.appendChild(th);

                for (let i = 0; i < 5; i++) {
                    const msCard = cards[i];
                    const plCard = cards[i + 5];

                    if (def.colspan) {
                        const td = document.createElement('td');
                        td.colSpan = def.colspan;
                        if (def.isSkill) td.classList.add('skill-cell');
                        
                        let value = null;
                        if (def.ms_key) value = getDeepValue(msCard, `ocr_data.${def.ms_key}`);
                        if (def.pl_key && !value) value = getDeepValue(plCard, `ocr_data.${def.pl_key}`);
                        
                        td.innerHTML = def.formatter ? def.formatter(value, cards) : (value || '-');
                        tr.appendChild(td);
                        if (def.colspan === 2) {
                            tr.appendChild(document.createElement('td')); // Empty cell for total
                        }
                    } else {
                        const tdMs = document.createElement('td');
                        const tdPl = document.createElement('td');

                        const msValue = getDeepValue(msCard, `ocr_data.${def.ms_key}`);
                        const plValue = getDeepValue(plCard, `ocr_data.${def.pl_key}`);

                        // リンクアビリティのバフを適用
                        const msBuffs = msCard && msCard.ocr_data ? getLinkBuffs(msCard.ocr_data) : { mobility: { small: 0, medium: 0 }, ranged: { small: 0, medium: 0 }, melee: { small: 0, medium: 0 }, hp: { small: 0, medium: 0 } };
                        const plBuffs = plCard && plCard.ocr_data ? getLinkBuffs(plCard.ocr_data) : { mobility: { small: 0, medium: 0 }, ranged: { small: 0, medium: 0 }, melee: { small: 0, medium: 0 }, hp: { small: 0, medium: 0 } };

                        tdMs.innerHTML = def.formatter ? def.formatter(msValue, cards, msCard) : (msValue || '-');
                        tdPl.innerHTML = def.formatter ? def.formatter(plValue, cards, plCard) : (plValue || '-');
                        
                        tr.appendChild(tdMs);
                        tr.appendChild(tdPl);
                        
                        if (def.total) {
                            const tdTotal = document.createElement('td');
                            tdTotal.classList.add('total-col');
                            let msVal = parseInt(msValue, 10) || 0;
                            let plVal = parseInt(plValue, 10) || 0;
                            
                            // リンクアビリティのバフを適用
                            let msBuff = 0, plBuff = 0;
                            if (def.header === '機動力') {
                                msBuff = msBuffs.mobility.small * 10 + msBuffs.mobility.medium * 20;
                                plBuff = plBuffs.mobility.small * 10 + plBuffs.mobility.medium * 20;
                                msVal += msBuff;
                                plVal += plBuff;
                            } else if (def.header === '遠距離攻撃力') {
                                msBuff = msBuffs.ranged.small * 10 + msBuffs.ranged.medium * 20;
                                plBuff = plBuffs.ranged.small * 10 + plBuffs.ranged.medium * 20;
                                msVal += msBuff;
                                plVal += plBuff;
                            } else if (def.header === '近距離攻撃力') {
                                msBuff = msBuffs.melee.small * 10 + msBuffs.melee.medium * 20;
                                plBuff = plBuffs.melee.small * 10 + plBuffs.melee.medium * 20;
                                msVal += msBuff;
                                plVal += plBuff;
                            } else if (def.header === 'HP') {
                                msBuff = msBuffs.hp.small * 10 + msBuffs.hp.medium * 20;
                                plBuff = plBuffs.hp.small * 10 + plBuffs.hp.medium * 20;
                                msVal += msBuff;
                                plVal += plBuff;
                            }
                            
                            const total = msVal + plVal;
                            const totalBuff = msBuff + plBuff;
                            
                            if (def.bar) {
                                const percent = (total / def.max) * 100;
                                let displayText = total.toString();
                                if (totalBuff > 0) {
                                    displayText += ` (+${totalBuff})`;
                                }
                                
                                // 基本値とバフ値を分離して計算
                                const baseTotal = total - totalBuff;
                                const basePercent = (baseTotal / def.max) * 100;
                                const buffPercent = (totalBuff / def.max) * 100;
                                
                                let barHtml = '';
                                if (totalBuff > 0) {
                                    // バフがある場合：基本値（青）+ バフ値（ピンク）
                                    barHtml = `
                                        <div class="stat-bar-container">
                                            <div class="stat-bar" style="width:${basePercent}%; background: linear-gradient(to right, #2196f3, #64b5f6);"></div>
                                            <div class="stat-bar" style="width:${buffPercent}%; background: linear-gradient(to right, #e91e63, #f06292); left: ${basePercent}%;"></div>
                                        </div>
                                    `;
                                } else {
                                    // バフがない場合：通常の青いバー
                                    barHtml = `
                                        <div class="stat-bar-container">
                                            <div class="stat-bar" style="width:${percent}%"></div>
                                        </div>
                                    `;
                                }
                                
                                tdTotal.innerHTML = `
                                    <div style="display:flex; align-items:center; gap:5px;">
                                        <div class="total-value" style="width:60px;">${displayText}</div>
                                        ${barHtml}
                                    </div>
                                `;
                            } else if (def.header === 'コスト') {
                                 tdTotal.innerHTML = formatCost(total, null, msCard, plCard);
                            }
                            else {
                                let displayText = total.toString();
                                if (totalBuff > 0) {
                                    displayText += ` (+${totalBuff})`;
                                }
                                tdTotal.textContent = displayText;
                            }
                            tr.appendChild(tdTotal);
                        } else {
                            tr.appendChild(document.createElement('td'));
                        }
                    }
                }
                tbody.appendChild(tr);
            });
        }

        function getDeepValue(obj, path) {
            if (!obj || !path) return null;
            return path.split('.').reduce((p, c) => (p && p[c]) ? p[c] : null, obj);
        }

        function formatType(value) {
            if (!value) return '-';
            const style = {
                '殲滅': 'cost-annihilation', '制圧': 'cost-suppression', '防衛': 'cost-defense'
            }[value] || '';
            return `<span class="${style}">${value}</span>`;
        }

        function formatCost(value, cards, card) {
            if(card) { // Single card
                 return value || '-';
            }
            // Total cost for a unit
            const ms = arguments[2], pl = arguments[3];
            const msType = getDeepValue(ms, 'ocr_data.type');
            const plType = getDeepValue(pl, 'ocr_data.type');
            const type = msType || plType || 'N/A';
            const style = {
                '殲滅': 'cost-annihilation', '制圧': 'cost-suppression', '防衛': 'cost-defense'
            }[type] || '';
            return `<span class="${style}" style="font-size:16px; font-weight:bold;">${value}</span>`;
        }

        function formatRangeAptitude(value, cards, card) {
            if (!card || !card.ocr_data) return '-';

            // MS Card: show range
            if (card.ocr_data.type === 'MS') {
                const range = getDeepValue(card, 'ocr_data.special_attack.range');
                return range ? `遠:${range}` : '-';
            }
            // PL Card: show terrain aptitude
            if (card.ocr_data.type === 'PL') {
                const terrain = getDeepValue(card, 'ocr_data.terrain');
                if (!terrain) return '-';
                let html = '';
                const aptitudes = ['ground', 'space', 'desert', 'water'];
                const ja = {'ground': '地', 'space': '宇', 'desert': '砂', 'water': '水'};
                aptitudes.forEach(t => {
                    if (terrain[t]) {
                        html += `<div>${ja[t]}: <span class="aptitude-${terrain[t].toLowerCase()}">${terrain[t]}</span></div>`;
                    }
                });
                return html;
            }
            return '-';
        }
        
        function formatLinkAbility(value, cards) {
            if (!value || value.length === 0) return '-';
            let html = '';
            value.forEach(link => {
                const isActive = checkLinkIsActive(link, cards);
                const isSQLinkActive = checkSQLinkActive(link, cards);
                const activeText = isActive ? ' 【発動中】' : '';
                
                // SQリンクの場合はピンク色、通常のリンクアビリティは青色
                let linkClass = 'link-item';
                if (isSQLinkActive) {
                    linkClass = 'link-item sq-link-active';
                } else if (isActive) {
                    linkClass = 'link-item link-active';
                }
                
                // 効果を解析して表示（数値は記載しない）
                let effectText = '';
                if (link.effect && isActive) {
                    const effects = [];
                    const eff = link.effect;
                    
                    if (eff.match(/機動力.*アップ/)) effects.push('機動力');
                    if (eff.match(/遠距離攻撃力.*アップ/)) effects.push('遠距離攻撃力');
                    if (eff.match(/近距離攻撃力.*アップ/)) effects.push('近距離攻撃力');
                    if (eff.match(/HP.*アップ/)) effects.push('HP');
                    
                    if (effects.length > 0) {
                        effectText = ` (${effects.join(', ')}上昇)`;
                    }
                }
                
                html += `<div class="${linkClass}">・${link.name}${activeText}${effectText}</div>`;
            });
            return html;
        }

        function checkLinkIsActive(link, allSelectedCards) {
            if (!link.condition || !link.condition.includes('デッキに')) return false;
            const match = link.condition.match(/デッキに(\d+)枚以上/);
            if (!match) return false;
            const requiredCount = parseInt(match[1], 10);
            
            const count = allSelectedCards.filter(c => {
                if (!c || !c.ocr_data || !c.ocr_data.link_abilities) return false;
                return c.ocr_data.link_abilities.some(l => l.name === link.name);
            }).length;
            
            return count >= requiredCount;
        }

        function checkSQLinkActive(link, allSelectedCards) {
            // SQリンクの判定（SQゲージ関連の効果を持つリンクアビリティ）
            if (!link.effect || !link.effect.includes('SQゲージ')) return false;
            
            // SQリンクの発動条件をチェック（通常のリンクアビリティと同じ条件）
            if (!link.condition || !link.condition.includes('デッキに')) return false;
            const match = link.condition.match(/デッキに(\d+)枚以上/);
            if (!match) return false;
            const requiredCount = parseInt(match[1], 10);
            
            const count = allSelectedCards.filter(c => {
                if (!c || !c.ocr_data || !c.ocr_data.link_abilities) return false;
                return c.ocr_data.link_abilities.some(l => l.name === link.name);
            }).length;
            
            return count >= requiredCount;
        }

        function formatSkill(value) {
            if (!value) return '-';
            return `<b>${value.name || ''}</b><br>${value.description || value.effect || ''}`;
        }
        
        function formatSP(value, cards, card) {
             if (!value) return '-';
             let html = `<b>${value.name || ''}</b>`;
             if(value.power) html += ` (威力: ${value.power})`;
             if(getDeepValue(card, 'ocr_data.type') === 'MS') {
                if(value.description) html += `<br>${value.description}`;
             }
             return html;
        }
        function formatSquadSP(value){
            return '-'; // Placeholder
        }

        // リンクアビリティのパラメータバフ計算ロジック
        function getLinkBuffs(ocr) {
            const buffs = {
                mobility: { small: 0, medium: 0 },
                ranged: { small: 0, medium: 0 },
                melee: { small: 0, medium: 0 },
                hp: { small: 0, medium: 0 }
            };
            if (!ocr || !Array.isArray(ocr.link_abilities)) return buffs;
            ocr.link_abilities.forEach(link => {
                const eff = link.effect || '';
                // 小アップ
                if (eff.match(/機動力.*小アップ|\[機動力\].*小アップ|"機動力".*小アップ/)) buffs.mobility.small++;
                if (eff.match(/遠距離攻撃力.*小アップ|\[遠距離攻撃力\].*小アップ|"遠距離攻撃力".*小アップ/)) buffs.ranged.small++;
                if (eff.match(/近距離攻撃力.*小アップ|\[近距離攻撃力\].*小アップ|"近距離攻撃力".*小アップ/)) buffs.melee.small++;
                if (eff.match(/HP.*小アップ|\[HP\].*小アップ|"HP".*小アップ/)) buffs.hp.small++;
                // 中アップ
                if (eff.match(/機動力.*中アップ|\[機動力\].*中アップ|"機動力".*中アップ/)) buffs.mobility.medium++;
                if (eff.match(/遠距離攻撃力.*中アップ|\[遠距離攻撃力\].*中アップ|"遠距離攻撃力".*中アップ/)) buffs.ranged.medium++;
                if (eff.match(/近距離攻撃力.*中アップ|\[近距離攻撃力\].*中アップ|"近距離攻撃力".*中アップ/)) buffs.melee.medium++;
                if (eff.match(/HP.*中アップ|\[HP\].*中アップ|"HP".*中アップ/)) buffs.hp.medium++;
            });
            return buffs;
        }

        // 全カードのリンクアビリティを一括更新する関数
        function updateAllLinkAbilities() {
            // 各カードのリンクアビリティ発動状態を再計算
            for (let i = 0; i < 10; i++) {
                if (selectedCards[i] && selectedCards[i].ocr_data) {
                    updateLinkAbilitiesForCard(i, selectedCards[i].ocr_data);
                }
            }
        }

        // 特定のカードのリンクアビリティ表示を更新
        function updateLinkAbilitiesForCard(index, ocrJson) {
            if (!Array.isArray(ocrJson.link_abilities) || ocrJson.link_abilities.length === 0) {
                return;
            }

            // リンクアビリティの発動状態を再計算
            ocrJson.link_abilities.forEach(link => {
                if (link.condition && link.condition.match(/デッキに(\d+)枚以上/)) {
                    const match = link.condition.match(/デッキに(\d+)枚以上/);
                    const count = parseInt(match[1], 10);
                    let found = selectedCards.filter(card => {
                        if (!card || !card.ocr_data || !Array.isArray(card.ocr_data.link_abilities)) return false;
                        return card.ocr_data.link_abilities.some(l => l.name === link.name);
                    }).length;
                    link.isActive = found >= count;
                }
            });
        }

        // --- Modal Logic ---
        function openSelectionModal(unitIndex, cardType) {
            const modal = document.getElementById('selection-modal');
            const cardListEl = document.getElementById('modal-card-list');
            const modalTitle = document.getElementById('modal-title');
            const seriesFilter = document.getElementById('series-filter');
            cardListEl.innerHTML = '';

            modalTitle.textContent = `${unitIndex + 1}番機 ${cardType === 'MS' ? 'MS' : 'パイロット'} を選択`;

            const isPilot = cardType === 'PL';
            const availableCards = allCards.filter(c => {
                const type = (c.ocr_data && c.ocr_data.type) || c.category;
                return isPilot ? type === 'PL' : type === 'MS';
            });

            // 収録弾数のオプションを設定
            const seriesOptions = new Set();
            availableCards.forEach(card => {
                if (card.series) {
                    seriesOptions.add(card.series);
                }
            });
            
            seriesFilter.innerHTML = '<option value="">すべての収録弾</option>';
            Array.from(seriesOptions).sort().forEach(series => {
                const option = document.createElement('option');
                option.value = series;
                const seriesId = seriesCodeToId[series];
                const seriesLabel = seriesId ? seriesLabels[seriesId] : series;
                option.textContent = seriesLabel;
                seriesFilter.appendChild(option);
            });

            // フィルター機能を実装
            function filterAndDisplayCards() {
                const selectedSeries = seriesFilter.value;
                
                const filteredCards = availableCards.filter(card => {
                    const seriesMatch = !selectedSeries || card.series === selectedSeries;
                    return seriesMatch;
                });

                cardListEl.innerHTML = '';
                filteredCards.forEach(card => {
                    const cardEl = document.createElement('div');
                    cardEl.className = 'modal-card';
                    cardEl.onclick = () => selectCard(card.number, unitIndex, cardType);
                    const seriesId = seriesCodeToId[card.series];
                    const seriesLabel = seriesId ? seriesLabels[seriesId] : card.series;
                    cardEl.innerHTML = `
                        <img src="${card.front.url}" alt="${card.name}">
                        <div class="modal-card-name">${card.number}<br>${card.name}</div>
                        <div class="modal-card-series">${seriesLabel}</div>
                    `;
                    cardListEl.appendChild(cardEl);
                });
            }

            // 初期表示
            filterAndDisplayCards();

            // フィルター変更時のイベントリスナー
            seriesFilter.onchange = filterAndDisplayCards;

            modal.style.display = 'flex';
        }

        function closeSelectionModal() {
            document.getElementById('selection-modal').style.display = 'none';
        }

        function selectCard(cardNumber, unitIndex, cardType) {
            const cardIndex = (cardType === 'MS') ? unitIndex : unitIndex + 5;
            const newCard = allCards.find(c => c.number === cardNumber);

            selectedCards[cardIndex] = newCard;

            saveDeckData();
            populateTable(selectedCards);

            closeSelectionModal();
        }
    </script>
