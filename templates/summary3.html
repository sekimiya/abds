<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summary 3</title>
    <style>
    :root{--bg:#0b0f14;--panel:#0f141b;--card:#121922;--text:#e8eef7;--muted:#8ea0b8;--border:#1e2a39;--accent:#7cf7c6;--line:#1f2a37}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif;padding:12px}
    .top{display:flex;align-items:center;justify-content:flex-end;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:12px;padding:10px 14px;gap:12px}
    .btn{background:#16202b;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;cursor:pointer}
    .btn.primary{background:#14282a;color:#cafff2;border-color:#2b5348}
    .sheet{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
    .grid{display:grid;grid-template-columns:160px repeat(5, 1fr)}
    .row{display:contents}
    .cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px}
    .head{background:#0c1218;color:#9fb3c8;font-size:12px;text-align:center}
    .label{background:#0c1218;color:#9fb3c8;font-size:12px}
    .mini{font-size:11px;color:#9fb3c8}
    .type-pill{display:inline-block;padding:2px 8px;border:1px solid var(--border);border-radius:999px;background:#0e151c;margin-right:6px;font-size:11px}
    .imgbox{display:flex;gap:8px}
    .tile{position:relative;background:#0c1218;border:1px solid var(--border);border-radius:6px;overflow:hidden;width:100%;aspect-ratio:3/4}
    .tile img{width:100%;height:100%;object-fit:cover}
    .pill{position:absolute;top:6px;left:6px;padding:1px 6px;border:1px solid var(--border);background:#0e151c;border-radius:999px;font-size:11px}
    .stat{display:flex;justify-content:space-between;gap:6px}
    .stat .v{font-weight:700}
    .kvs{display:grid;grid-template-columns:42px 1fr 42px 1fr 42px 1fr 42px 1fr;gap:6px}
    .links{display:flex;flex-direction:column;gap:4px}
    .link{font-size:12px;color:#bcd7ff}
    .desc{font-size:12px;color:#cdd6e3;white-space:pre-line}
    </style>
</head>
<body>
  <div class="top">
    <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="debugToggle"> debug</label>
    <button class="btn" id="reload">再読込</button>
    <button class="btn" id="random">ランダム</button>
    <button class="btn primary" id="export">画像として保存</button>
    </div>
    
  <div class="sheet">
    <div class="grid" id="sheetGrid"></div>
    </div>

    <script>
    let allCards=[]; let current=new Array(10).fill(null);
    const get=(o,p)=>p.split('.').reduce((a,c)=>a&&a[c]!=null?a[c]:null,o);
    function getRole(card){
      // 1) 明示的な type / 日本語ラベル
      const t = (get(card,'type') || get(card,'ocr_data.type') || '').toString();
      if(/MS|モビルスーツ/i.test(t)) return 'MS';
      if(/PL|パイロット/i.test(t)) return 'PL';
      // 2) front.card_type に日本語区分がある場合
      const ct = (get(card,'front.card_type') || get(card,'ocr_data.card_type') || '').toString();
      if(/モビルスーツ/.test(ct)) return 'MS';
      if(/パイロット/.test(ct)) return 'PL';
      // 3) 能力の有無で推定
      if(get(card,'pl_skill') || get(card,'ocr_data.pl_skill') || get(card,'ocr_data.pilot_skill')) return 'PL';
      if(get(card,'ms_ability') || get(card,'ocr_data.ms_ability')) return 'MS';
      // 4) 既知のフィールドから推定不可ならMS扱い
      return 'MS';
    }
    const isType=(c,t)=>{ if(!c) return false; return getRole(c)===t; };
    const rndPick=(arr,n)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n)};

    async function fetchCards(){
      const debug=document.getElementById('debugToggle').checked;
      if(debug){
        const r=await fetch('/debug_summary'); const d=await r.json(); allCards=d.cards||[];
      }else{
        const r=await fetch('/fetch_cards'); const d=await r.json(); allCards=d.images||d.all_cards||[];
      }
    }

    function randomize(){
      const ms=allCards.filter(c=>isType(c,'MS'));
      const pl=allCards.filter(c=>isType(c,'PL'));
      current=[...rndPick(ms,5),...rndPick(pl,5)];
      render();
    }

    function render(){
      const sheet=document.getElementById('sheetGrid'); sheet.innerHTML='';
      const header=document.createElement('div'); header.className='row'; sheet.appendChild(header);
      const h0=document.createElement('div'); h0.className='cell head'; h0.textContent=''; sheet.appendChild(h0);
      for(let i=0;i<5;i++){ const c=document.createElement('div'); c.className='cell head'; c.textContent=String(i+1); sheet.appendChild(c); }

      const labels=['Unit Cost','Stage','Type','Images','Card Name','ATK Range','Score','Link','MS Ability','PL Ability','SP Power','SP Description','USP/SGSP'];
      const appendRow=(label,builder)=>{ const row=document.createElement('div'); row.className='row'; sheet.appendChild(row); const l=document.createElement('div'); l.className='cell label'; l.textContent=label; sheet.appendChild(l); for(let i=0;i<5;i++){ const cell=document.createElement('div'); cell.className='cell'; cell.innerHTML=builder(i); sheet.appendChild(cell);} };

      const data=i=>{ const ms=current[i],pl=current[i+5];
        const msImg=get(ms,'front.image_url')||get(ms,'front_image_url')||get(ms,'front.imageUrl')||get(ms,'ocr_data.front.image_url')||get(ms,'url')||'';
        const plImg=get(pl,'front.image_url')||get(pl,'front_image_url')||get(pl,'front.imageUrl')||get(pl,'ocr_data.front.image_url')||get(pl,'url')||'';
        const msName=ms?`${ms.number||get(ms,'front.card_id')||''} ${ms.name||get(ms,'front.card_name')||''}`:'-';
        const plName=pl?`${pl.number||get(pl,'front.card_id')||''} ${pl.name||get(pl,'front.card_name')||''}`:'-';
        const msCost=parseInt(get(ms,'cost')||get(ms,'ocr_data.cost')||get(ms,'front.cost')||0,10)||0;
        const plCost=parseInt(get(pl,'cost')||get(pl,'ocr_data.cost')||get(pl,'front.cost')||0,10)||0;
        const mob=(parseInt(get(ms,'stats.mobility')||get(ms,'ocr_data.stats.mobility')||get(ms,'front.mobility')||0,10)||0)+(parseInt(get(pl,'stats.mobility')||get(pl,'ocr_data.stats.mobility')||get(pl,'front.mobility')||0,10)||0);
        const mel=(parseInt(get(ms,'stats.melee_attack')||get(ms,'ocr_data.stats.melee_attack')||get(ms,'front.melee_attack')||0,10)||0)+(parseInt(get(pl,'stats.melee_attack')||get(pl,'ocr_data.stats.melee_attack')||get(pl,'front.melee_attack')||0,10)||0);
        const rng=(parseInt(get(ms,'stats.ranged_attack')||get(ms,'ocr_data.stats.ranged_attack')||get(ms,'front.ranged_attack')||0,10)||0)+(parseInt(get(pl,'stats.ranged_attack')||get(pl,'ocr_data.stats.ranged_attack')||get(pl,'front.ranged_attack')||0,10)||0);
        const hp=(parseInt(get(ms,'stats.hp')||get(ms,'ocr_data.stats.hp')||get(ms,'front.hp')||0,10)||0)+(parseInt(get(pl,'stats.hp')||get(pl,'ocr_data.stats.hp')||get(pl,'front.hp')||0,10)||0);
        const links=(get(ms,'link_abilities')||get(ms,'ocr_data.link_abilities')||get(ms,'front.link_abilities')||[]).concat(get(pl,'link_abilities')||get(pl,'ocr_data.link_abilities')||get(pl,'front.link_abilities')||[]).filter(Boolean);
        const msAbility=get(ms,'ms_ability')||get(ms,'ocr_data.ms_ability')||get(ms,'front.ms_ability');
        const plSkill=get(pl,'pl_skill')||get(pl,'ocr_data.pl_skill')||get(pl,'ocr_data.pilot_skill')||get(pl,'front.pl_skill');
        // SP（sp.json 形式にも対応）
        let sp=get(ms,'special_attack')||get(ms,'ocr_data.special_attack')||get(pl,'special_attack')||get(pl,'ocr_data.special_attack')||get(ms,'front.special_attack')||get(pl,'front.special_attack');
        if(!sp){
          const spInfo=get(ms,'sp_info')||get(ms,'ocr_data.sp_info');
          const spPower=get(ms,'power')||get(ms,'ocr_data.power');
          const spDesc=get(ms,'descriptions')||get(ms,'ocr_data.descriptions');
          if(spInfo||spPower||spDesc){
            sp={
              name: get(spInfo,'name')||'',
              power: { normal: get(spPower,'normal')||null, squad: (Array.isArray(get(spPower,'squad'))?get(spPower,'squad[0]'):get(spPower,'squad'))||null },
              description: get(spDesc,'normal_description')||get(spDesc,'all_description')||''
            };
          }
        }
        return {msImg,plImg,msName,plName,msCost,plCost,mob,mel,rng,hp,links,msAbility,plSkill,sp}; };

      appendRow('Unit Cost', i=>{const d=data(i); return `<div class="stat"><span class="mini">MS</span><span class="v">${d.msCost}</span><span class="mini">PL</span><span class="v">${d.plCost}</span><span class="mini">Total</span><span class="v">${d.msCost+d.plCost}</span></div>`});
      appendRow('Stage', ()=>`<div class="mini">A / S / B / C</div>`);
      appendRow('Type', i=>{
        const ms=current[i], pl=current[i+5];
        const okMS=['近距離','遠距離','機動'];
        const okPL=['殲滅','制圧','防衛'];
        const msCat=(get(ms,'ocr_data.category')||get(ms,'category')||'').toString().trim();
        const t1= okMS.includes(msCat) ? msCat : 'データ欠損';
        const plCls=(get(pl,'ocr_data.card_label.class')||get(pl,'card_label.class')||'').toString().trim();
        const t2= okPL.includes(plCls) ? plCls : 'データ欠損';
        return `<span class="type-pill">${t1}</span><span class="type-pill">${t2}</span>`
      });
      appendRow('Images', i=>{const d=data(i); return `<div class="imgbox"><div class="tile"><span class="pill">MS</span>${d.msImg?`<img src="${d.msImg}" referrerpolicy="no-referrer">`:''}</div><div class="tile"><span class="pill">PL</span>${d.plImg?`<img src="${d.plImg}" referrerpolicy="no-referrer">`:''}</div></div>`});
      appendRow('Card Name', i=>{const d=data(i); return `${d.msName}<br>${d.plName}`});
      appendRow('ATK Range', i=>{const d=data(i); return `<div class="kvs"><span class="mini">Mob</span><span class="v">${d.mob}</span><span class="mini">Rng</span><span class="v">${d.rng}</span><span class="mini">Melee</span><span class="v">${d.mel}</span><span class="mini">HP</span><span class="v">${d.hp}</span></div>`});
      appendRow('Score', ()=>`<div class="mini">—</div>`);
      appendRow('Link', i=>{const d=data(i); if(!d.links.length) return '<span class="mini">-</span>'; return `<div class="links">${d.links.slice(0,6).map(l=>`<div class="link">・${(l.name||'')}${l.condition?` <span class=mini>${l.condition}</span>`:''}</div>`).join('')}</div>`});
      appendRow('MS Ability', i=>{const d=data(i); if(!d.msAbility) return '<span class="mini">-</span>'; return `<div class="desc"><b>${d.msAbility.name||''}</b>\n${d.msAbility.description||d.msAbility.effect||''}</div>`});
      appendRow('PL Ability', i=>{const d=data(i); if(!d.plSkill) return '<span class="mini">-</span>'; return `<div class="desc"><b>${d.plSkill.name||''}</b>\n${d.plSkill.effect||''}</div>`});
      appendRow('SP Power', i=>{const d=data(i); if(!d.sp) return '<span class="mini">-</span>'; const n=d.sp?.power?.normal??d.sp?.power??null; const s=d.sp?.power?.squad??null; if(!n&&!s) return '<span class="mini">-</span>'; return `<div class=\"desc\">${s?`通常${n} / SQ${s}`:`${n}`}</div>`});
      appendRow('SP Description', i=>{const d=data(i); if(!d.sp) return '<span class=\"mini\">-</span>'; const desc=d.sp.description||''; return desc?`<div class=\"desc\">${desc}</div>`:'<span class=\"mini\">-</span>';});
      appendRow('USP/SGSP', ()=>`<span class="mini">-</span>`);
    }

    document.getElementById('reload').addEventListener('click', async()=>{await fetchCards(); render();});
    document.getElementById('random').addEventListener('click', randomize);
    document.getElementById('export').addEventListener('click', ()=>window.print());
    document.getElementById('debugToggle').addEventListener('change', async()=>{await fetchCards(); randomize();});
    (async function init(){
      const dbg=document.getElementById('debugToggle');
      if (dbg) dbg.checked = true; // デフォルトでデバッグJSON（sp.json含む）を使用
      await fetchCards();
      randomize();
    })();
    </script>
</body>
</html>
