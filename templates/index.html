<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ガンダムアーセナルベース Deck Simulator</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; line-height: 1.1; padding-bottom: 0; }
        .header { background: #1a472a; color: #fff; text-align: center; padding: 1rem; font-size: 2rem; }
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr); gap: 16px; max-width: 900px; margin: 2rem auto; margin-bottom: 0; }
        .card-item { background: #222; border: 1px solid #444; border-radius: 8px; padding: 0.3rem 0.5rem 0.3rem 0.5rem; text-align: center; line-height: 1.1; padding-bottom: 0.5rem; min-height: unset; }
        .card-item img { max-width: 160px; max-height: 240px; height: auto; background: #111; border-radius: 4px; margin-top: 0.2rem; margin-bottom: 0.2rem; display: block; }
        .card-number { color: #4caf50; font-weight: bold; margin-top: 0.2rem; margin-bottom: 0.1rem; line-height: 1.1; }
        .card-name { margin-top: 0.1rem; margin-bottom: 0.1rem; font-size: 1.1rem; line-height: 1.1; }
        .card-select { width: 100%; margin-top: 0.2rem; margin-bottom: 0.2rem; padding: 0.3rem; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff; line-height: 1.1; }
        .ocr-params { background: #181818; border-radius: 6px; margin-top: 0.4rem; padding: 0.3rem; min-height: 1.5em; font-size: 0.95em; color: #b2ffb2; display: flex; flex-wrap: wrap; align-items: center; gap: 0.7em; line-height: 1.05; }
        .ocr-params .label { color: #4caf50; margin-right: 0.3em; }
        .ocr-params span { margin-right: 0.7em; }
        .card-item.row-top { padding-top: 0.1rem; padding-bottom: 0.1rem; min-height: unset; }
    </style>
</head>
<body>
    <div class="header">ガンダムアーセナルベース Deck Simulator</div>
    <div id="totalCost" style="max-width:900px;margin:1rem auto;padding:0.5rem;background:#333;border-radius:6px;color:#4caf50;font-size:1.2em;text-align:center;font-weight:bold;">総コスト: 0</div>
    <div id="cardGrid" class="card-grid"></div>
    <div id="activeLinkAbilities" style="max-width:900px;margin:2rem auto 0 auto;padding:1rem;background:#222;border-radius:8px;color:#ffe082;font-size:1.1em;"></div>
    <script>
        let allCards = [];
        let selectedCardNumbers = Array(10).fill(null); // 現在選択中のカード番号
        let selectedOcrData = Array(10).fill(null); // 各枠のOCRデータ
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/fetch_cards')
                .then(res => res.json())
                .then(data => {
                    if (!data.success) {
                        document.getElementById('cardGrid').innerText = 'カードデータの取得に失敗しました';
                        return;
                    }
                    allCards = data.images;
                    const cardGrid = document.getElementById('cardGrid');
                    cardGrid.innerHTML = '';
                    for (let i = 0; i < Math.min(10, allCards.length); i++) {
                        createCardItem(i, allCards[i]);
                    }
                });
        });

        function createCardItem(index, card) {
            const cardGrid = document.getElementById('cardGrid');
            const div = document.createElement('div');
            div.className = 'card-item row-top';
            const img = document.createElement('img');
            img.src = card.url;
            img.alt = card.name;
            img.id = `card-img-${index}`;
            const number = document.createElement('div');
            number.className = 'card-number';
            number.id = `card-number-${index}`;
            number.textContent = card.number;
            const name = document.createElement('div');
            name.className = 'card-name';
            name.id = `card-name-${index}`;
            name.textContent = card.name;
            const select = document.createElement('select');
            select.className = 'card-select';
            select.id = `card-select-${index}`;
            allCards.forEach((c, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `${c.number} - ${c.name}`;
                if (c.number === card.number) opt.selected = true;
                select.appendChild(opt);
            });
            // OCRパラメータ表示欄
            const ocrDiv = document.createElement('div');
            ocrDiv.className = 'ocr-params';
            ocrDiv.id = `ocr-params-${index}`;
            // 初期表示
            updateOcrParams(card.number, ocrDiv, index);
            select.onchange = function() {
                const selectedCard = allCards[this.value];
                document.getElementById(`card-img-${index}`).src = selectedCard.url;
                document.getElementById(`card-img-${index}`).alt = selectedCard.name;
                document.getElementById(`card-number-${index}`).textContent = selectedCard.number;
                document.getElementById(`card-name-${index}`).textContent = selectedCard.name;
                updateOcrParams(selectedCard.number, ocrDiv, index);
            };
            div.appendChild(img);
            div.appendChild(number);
            div.appendChild(name);
            div.appendChild(select);
            div.appendChild(ocrDiv);
            cardGrid.appendChild(div);
            // 合計ステータス表示欄（6〜10番目のみ）
            if (index >= 5) {
                const sumDiv = document.createElement('div');
                sumDiv.className = 'ocr-params';
                sumDiv.id = `sum-params-${index}`;
                sumDiv.style.background = '#222';
                sumDiv.style.color = '#ffe082';
                sumDiv.style.fontSize = '0.92em';
                sumDiv.style.marginTop = '0.4em';
                sumDiv.textContent = '';
                div.appendChild(sumDiv);
            }
            if (index < 5) div.classList.add('row-top');
        }

        // OCRパラメータ表示更新
        function updateOcrParams(cardNumber, ocrDiv, index) {
            selectedCardNumbers[index] = cardNumber;
            // ファイル名生成（_bを付与）
            const ocrFile = `ocr_results/${cardNumber}_b_ocr.json`;
            fetch(ocrFile)
                .then(res => {
                    if (!res.ok) throw new Error('not found');
                    return res.json();
                })
                .then(data => {
                    // ocr_resultは文字列なのでパース
                    let params = '';
                    let linkAbility = '';
                    let ocrJson = null;
                    try {
                        const match = data.ocr_result.match(/```json\n([\s\S]*)```/);
                        if (match) {
                            ocrJson = JSON.parse(match[1]);
                            // 横並びで1行表示
                            params += `<span class='label'>機動力:</span><span>${ocrJson.ステータス?.機動力 ?? ''}</span>`;
                            params += `<span class='label'>遠距離:</span><span>${ocrJson.ステータス?.遠距離攻撃 ?? ''}</span>`;
                            params += `<span class='label'>近距離:</span><span>${ocrJson.ステータス?.近距離攻撃 ?? ''}</span>`;
                            params += `<span class='label'>HP:</span><span>${ocrJson.ステータス?.HP ?? ''}</span>`;
                            // リンクアビリティ
                            if (Array.isArray(ocrJson.リンクアビリティ) && ocrJson.リンクアビリティ.length > 0) {
                                linkAbility += '<div style="margin-top:0.5em;color:#ffe082;">リンクアビリティ:</div>';
                                ocrJson.リンクアビリティ.forEach((ab, idx) => {
                                    linkAbility += `<div style='font-size:0.95em;margin-left:1em;'>・<span style='color:#b2ffb2;'>${ab.条件 ?? ''}</span> <span style='color:#fff;'>${ab.効果 ?? ''}</span></div>`;
                                });
                            }
                            // パラメータ表示部分のHTML生成箇所の下にMSスキル・PLスキルを追加
                            if (ocrJson.MSアビリティ) {
                                params += `<div style='color:#b2e5ff;font-size:0.97em;margin-top:0.2em;'>MSスキル: <span style='color:#fff;'>${ocrJson.MSアビリティ}</span>`;
                                if (ocrJson.MSアビリティ効果) {
                                    params += `<div style='color:#b2e5ff;font-size:0.92em;margin-top:0.1em;margin-left:1em;'>${ocrJson.MSアビリティ効果}</div>`;
                                }
                                if (ocrJson.MSスキル説明) {
                                    params += `<div style='color:#b2e5ff;font-size:0.88em;margin-top:0.05em;margin-left:1.5em;'>${ocrJson.MSスキル説明}</div>`;
                                }
                                params += `</div>`;
                            }
                            if (ocrJson.スペシャルアタック && ocrJson.スペシャルアタック.説明) {
                                params += `<div style='color:#ffb2b2;font-size:0.92em;margin-top:0.2em;margin-left:0.5em;'>SPアタック説明: ${ocrJson.スペシャルアタック.説明}</div>`;
                            }
                            if (ocrJson.PLスキル) {
                                params += `<div style='color:#ffe082;font-size:0.97em;margin-top:0.1em;'>PLスキル: <span style='color:#fff;'>${ocrJson.PLスキル}</span>`;
                                if (ocrJson.PLスキル効果) {
                                    params += `<div style='color:#ffe082;font-size:0.92em;margin-top:0.1em;margin-left:1em;'>${ocrJson.PLスキル効果}</div>`;
                                }
                                if (ocrJson.PLスキル説明) {
                                    params += `<div style='color:#ffe082;font-size:0.88em;margin-top:0.05em;margin-left:1.5em;'>${ocrJson.PLスキル説明}</div>`;
                                }
                                params += `</div>`;
                            }
                        } else {
                            params = '';
                        }
                    } catch (e) {
                        params = '';
                    }
                    ocrDiv.innerHTML = params + linkAbility;
                    selectedOcrData[index] = ocrJson;
                    updateActiveLinkAbilities();
                    updateTotalCost();
                    updateSumParams();
                })
                .catch(() => {
                    ocrDiv.innerHTML = '';
                    selectedOcrData[index] = null;
                    updateActiveLinkAbilities();
                    updateTotalCost();
                    updateSumParams();
                });
        }

        // 発動中のリンクアビリティをUI下部に表示
        function updateActiveLinkAbilities() {
            // 10枚のカードの全リンクアビリティを抽出
            let allAbilities = [];
            selectedOcrData.forEach((ocr, idx) => {
                if (!ocr || !Array.isArray(ocr.リンクアビリティ)) return;
                ocr.リンクアビリティ.forEach(ab => {
                    // スペースで分割: [スキル名, 発動条件]
                    let cond = ab.条件 ?? '';
                    let skillName = '';
                    let condRest = '';
                    const firstSpace = cond.indexOf(' ');
                    if (firstSpace !== -1) {
                        skillName = cond.slice(0, firstSpace).trim();
                        condRest = cond.slice(firstSpace + 1).trim();
                    } else {
                        skillName = cond;
                        condRest = '';
                    }
                    allAbilities.push({
                        cardIndex: idx,
                        cardName: ocr.機体情報?.名称 ?? '',
                        series: ocr.シリーズ ?? '',
                        pilot: ocr.機体情報?.パイロット ?? '',
                        skillName: skillName,
                        condRest: condRest,
                        effect: ab.効果 ?? ''
                    });
                });
            });

            // 条件ごとに「該当するカードが何枚あるか」を集計
            let activeList = [];
            allAbilities.forEach((ab, i) => {
                // 例：「デッキにn枚以上」
                let m = ab.condRest.match(/デッキに(\d+)枚以上/);
                if (m) {
                    const count = parseInt(m[1], 10);
                    // デッキ内で「スキル名（リンクアビリティ名）」が一致するカードの枚数をカウント
                    let found = selectedOcrData.filter(d => {
                        if (!d) return false;
                        // 各カードのリンクアビリティ名を抽出し、ab.skillNameと一致するものがあるか
                        if (!Array.isArray(d.リンクアビリティ)) return false;
                        return d.リンクアビリティ.some(link => {
                            let c = link.条件 ?? '';
                            let s = '';
                            const sp = c.indexOf(' ');
                            if (sp !== -1) s = c.slice(0, sp).trim();
                            else s = c.trim();
                            return s === ab.skillName;
                        });
                    }).length;
                    if (found >= count) {
                        activeList.push(`<span style='color:#ffe082;'>${ab.skillName}</span> <span style='color:#fff;'>${ab.condRest}</span> <span style='color:#b2ffb2;'>${ab.effect}</span> <span style='color:#ff5252;'>リンクアビリティ発動中</span>`);
                    }
                    return;
                }
                // その他の条件式は今後拡張
            });
            const area = document.getElementById('activeLinkAbilities');
            if (activeList.length > 0) {
                area.innerHTML = '<b>発動中のリンクアビリティ</b><ul style="margin:0.5em 0 0 1.5em;">' + activeList.map(x => `<li>${x}</li>`).join('') + '</ul>';
            } else {
                area.innerHTML = '';
            }
        }

        // 総コスト更新
        function updateTotalCost() {
            let totalCost = 0;
            selectedOcrData.forEach(ocr => {
                if (ocr && ocr.機体情報 && ocr.機体情報.コスト) {
                    const cost = parseInt(ocr.機体情報.コスト, 10);
                    if (!isNaN(cost)) {
                        totalCost += cost;
                    }
                }
            });
            document.getElementById('totalCost').textContent = `総コスト: ${totalCost}`;
        }

        function updateSumParams() {
            for (let i = 5; i < 10; i++) {
                const idx1 = i - 5;
                const idx2 = i;
                const ocr1 = selectedOcrData[idx1];
                const ocr2 = selectedOcrData[idx2];
                let sumMob = '', sumRan = '', sumMel = '', sumHp = '';
                if (ocr1 && ocr2) {
                    const mob = (parseInt(ocr1.ステータス?.機動力)||0) + (parseInt(ocr2.ステータス?.機動力)||0);
                    const ran = (parseInt(ocr1.ステータス?.遠距離攻撃)||0) + (parseInt(ocr2.ステータス?.遠距離攻撃)||0);
                    const mel = (parseInt(ocr1.ステータス?.近距離攻撃)||0) + (parseInt(ocr2.ステータス?.近距離攻撃)||0);
                    const hp  = (parseInt(ocr1.ステータス?.HP)||0) + (parseInt(ocr2.ステータス?.HP)||0);
                    sumMob = mob; sumRan = ran; sumMel = mel; sumHp = hp;
                }
                const sumDiv = document.getElementById(`sum-params-${idx2}`);
                if (sumDiv) {
                    if (sumMob || sumRan || sumMel || sumHp) {
                        sumDiv.innerHTML = `<span class='label'>合計 機動力:</span><span>${sumMob}</span> <span class='label'>遠距離:</span><span>${sumRan}</span> <span class='label'>近距離:</span><span>${sumMel}</span> <span class='label'>HP:</span><span>${sumHp}</span>`;
                    } else {
                        sumDiv.innerHTML = '';
                    }
                }
            }
        }
    </script>
    <div style="text-align:center;margin:2em 0 1em 0;">
        <a href="/index2.html" style="color:#ffe082;font-size:1.1em;text-decoration:underline;">▶ 詳細デッキ表ページ（新UI）はこちら</a>
        <br><br>
        <a href="/photo" style="color:#4caf50;font-size:1.1em;text-decoration:underline;">📸 デッキ撮影モードへ</a>
        <br><br>
        <a href="/illustrator" style="color:#b2e5ff;font-size:1.1em;text-decoration:underline;">🎨 イラストレータ別カード一覧へ</a>
    </div>
</body>
</html>
