<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Gundam Arsenal Base Deck Simulator</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; line-height: 1.1; padding-bottom: 0; }
        .header { 
            background: #66f2c5; 
            color: #222; 
            text-align: center; 
            padding: 1rem; 
            font-size: 2rem; 
            font-weight: bold; 
            letter-spacing: 0.05em; 
            min-width: 100%;
            box-sizing: border-box;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        @media (max-width: 768px) {
            .header {
                font-size: 1.5rem;
                padding: 0.8rem;
            }
        }
        @media (max-width: 480px) {
            .header {
                font-size: 1.2rem;
                padding: 0.6rem;
            }
        }
        @media (max-width: 1400px) {
            #totalStatsBars {
                position: relative;
                left: auto;
                top: auto;
                transform: none;
                width: 100%;
                max-width: 1200px;
                margin: 2rem auto;
                max-height: none;
                overflow-y: visible;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 1rem;
            }
            
            .container {
                padding-left: 20px;
                padding-right: 20px;
            }
        }
        @media (max-width: 1200px) {
            #totalStatsBars {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            }
        }
        @media (max-width: 768px) {
            #totalStatsBars {
                grid-template-columns: 1fr;
                margin: 1rem auto;
            }
            
            .stats-bar {
                padding: 1rem;
            }
        }
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px; max-width: 1200px; margin: 2.5rem auto 0 auto; }
        .card-item { background: #222; border: 1.5px solid #444; border-radius: 12px; padding: 0.6rem 1rem 0.6rem 1rem; text-align: center; line-height: 1.2; padding-bottom: 1rem; width: 220px; box-sizing: border-box; margin: 0 auto; display: flex; flex-direction: column; min-height: 600px; }
        .card-item img { max-width: 220px; max-height: 330px; width: 220px; height: auto; background: #111; border-radius: 8px; margin-top: 0.3rem; margin-bottom: 0.3rem; display: block; flex-shrink: 0; }
        .card-number { color: #66f2c5; font-weight: bold; margin-top: 0.3rem; margin-bottom: 0.15rem; line-height: 1.2; font-size: 1.25rem; flex-shrink: 0; }
        .card-name { margin-top: 0.15rem; margin-bottom: 0.15rem; font-size: 1.25rem; line-height: 1.2; flex-shrink: 0; height: 2.4em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
        .card-select { width: 100%; margin-top: 0.3rem; margin-bottom: 0.3rem; padding: 0.5rem; border-radius: 6px; border: 1.5px solid #66f2c5; background: #333; color: #fff; line-height: 1.2; font-size: 1.1rem; flex-shrink: 0; }
        .ocr-params { background: #181818; border-radius: 8px; margin-top: 0.15rem; padding: 0.15rem; font-size: 1.08em; color: #b2ffb2; display: flex; flex-direction: column; align-items: flex-start; gap: 0.3em; line-height: 1.1; flex: 1; overflow: hidden; min-height: 0; }
        .ocr-params .label { color: #4caf50; margin-right: 0.2em; }
        .ocr-params span { margin-right: 0.4em; }
        .ocr-params .param-group {
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 0.3em;
            margin-bottom: 0.2em;
            width: 100%;
            box-sizing: border-box;
            min-height: 60px;
        }
        .param-group.skill {
            min-height: 90px;
            overflow: visible;
            white-space: pre-line;
        }
        .param-group.spattack {
            min-height: 90px;
            overflow: visible;
            white-space: pre-line;
        }
        .param-group.link {
            min-height: 90px;
            overflow: visible;
            white-space: pre-line;
        }
        .ocr-params .param-row { display: flex; flex-wrap: wrap; gap: 0.3em; margin-bottom: 0.2em; }
        .ocr-params .param-item { background: #444; border: 1px solid #666; border-radius: 3px; padding: 0.2em 0.4em; font-size: 0.9em; }
        .card-item.row-top { 
            padding-top: 0.05rem; 
            padding-bottom: 0.05rem; 
        }
        .card-grid .card-item:nth-child(-n+5) {
            margin-bottom: 4px;
        }
        .card-item > div {
            margin-bottom: 0.15em;
        }
        .deck-save-section {
            max-width: 900px;
            margin: 1rem auto;
            padding: 1rem;
            background: #333;
            border-radius: 8px;
            text-align: center;
        }
        .deck-save-input {
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            margin-right: 0.5rem;
            width: 200px;
        }
        .deck-save-btn {
            padding: 0.5rem 1rem;
            background: #66f2c5;
            color: #222;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 0.5rem;
            font-weight: bold;
        }
        .deck-load-btn {
            padding: 0.5rem 1rem;
            background: #66f2c5;
            color: #222;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .auto-save-toggle {
            margin: 1rem 0;
            padding: 0.5rem;
            background: #222;
            border-radius: 4px;
            display: inline-block;
        }
        .saved-decks-list {
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
            background: #222;
            padding: 1rem;
            border-radius: 4px;
            display: none;
        }
        #totalStatsBars { 
            max-width: 1200px;
            margin: 2rem auto 0 auto;
            padding: 1.5rem 1rem 2rem 1rem;
            background: #181818;
            border-radius: 16px;
            box-shadow: 0 0 16px #000;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2.5rem;
            justify-items: center;
            align-items: start;
        }
        .stats-bar {
            background: #222;
            border-radius: 12px;
            padding: 1.2em 1.2em 1.5em 1.2em;
            min-width: 220px;
            max-width: 260px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1em;
        }
        .stats-title {
            color: #4caf50;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 0.2em;
        }
        .stats-value {
            color: #4caf50;
            font-size: 0.9em;
            margin-bottom: 0.5em;
        }
        .stats-buff {
            color: #e91e63;
            font-size: 0.8em;
        }
        .stats-bar-container {
            position: relative;
            background: #333;
            height: 24px;
            border-radius: 0;
            overflow: visible;
            margin-bottom: 8px;
            width: 100%;
        }
        .stats-bar-base {
            background: #2196f3;
            height: 100%;
            transition: width 0.3s ease;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 10;
            border-radius: 0;
        }
        .stats-bar-buff {
            background: #e91e63;
            height: 100%;
            transition: width 0.3s ease;
            position: absolute;
            top: 0;
            z-index: 10;
            border-radius: 0;
        }
        .stats-scale {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }
        .stats-scale-line {
            position: absolute;
            top: 0;
            height: 100%;
            width: 2px;
            background: #fff;
            opacity: 0.5;
        }
        .stats-scale-line:last-child {
            opacity: 0.7;
        }
        .stats-percent {
            background: #2196f3;
            color: #fff;
            padding: 4px 16px;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: bold;
        }
        a {
            color: #66f2c5;
        }
        .deck-save-input:focus {
            border: 1.5px solid #66f2c5;
            outline: none;
        }
        #totalCost {
            color: #66f2c5;
        }
        #totalStatsBars .card-number {
            color: #66f2c5;
        }
        .auto-save-toggle label {
            color: #66f2c5;
        }
    </style>
</head>
<body>
    <div class="header">Gundam Arsenal Base Deck Simulator</div>
    
    <div id="totalCost" style="max-width:900px;margin:1rem auto;padding:0.5rem;background:#333;border-radius:6px;color:#66f2c5;font-size:1.2em;text-align:center;font-weight:bold;">総コスト: 0</div>
    
    <!-- デッキ保存・読み込み機能 -->
    <div class="deck-save-section">
        <div style="margin-bottom:1rem;">
            <input type="text" id="deckName" placeholder="デッキ名を入力" class="deck-save-input">
            <button onclick="saveDeck()" class="deck-save-btn">デッキ保存</button>
            <button onclick="loadDeck()" class="deck-load-btn">デッキ読み込み</button>
        </div>
        <div class="auto-save-toggle">
            <label style="color:#ffe082;margin-right:0.5rem;">
                <input type="checkbox" id="autoSaveToggle" checked style="margin-right:0.3rem;" onchange="toggleAutoSave()">
                自動保存（クッキー）
            </label>
            <span style="font-size:0.8em;color:#888;">※ページを離れても自動的にデッキが保存されます</span>
        </div>
        <div id="savedDecks" class="saved-decks-list">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
                <h4 style="margin:0;color:#4caf50;">保存済みデッキ一覧</h4>
                <button onclick="toggleDeckList()" id="toggleDeckListBtn" style="padding:0.2rem 0.5rem;background:#444;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.8em;">▼ 開く</button>
            </div>
            <div id="deckListContent" style="transition:max-height 0.3s ease-in-out;overflow:hidden;max-height:0px;">
                <div id="deckList"></div>
            </div>
        </div>
    </div>
    
    <div style="text-align:center;margin:1.5em 0;">
        <button id="openDeckPostModal" style="padding:0.7em 1.5em;background:#4caf50;color:#fff;border:none;border-radius:6px;font-size:1.1em;font-weight:bold;cursor:pointer;">デッキ投稿</button>
        <a href="/decks.html" style="margin-left:2em;color:#ffe082;font-size:1.1em;text-decoration:underline;">▶ デッキ投稿一覧</a>
        <a href="/search" style="margin-left:2em;color:#66f2c5;font-size:1.1em;text-decoration:underline;">▶ カード検索</a>
        <a href="/mobile" style="margin-left:2em;color:#ff9800;font-size:1.1em;text-decoration:underline;">📱 モバイル版</a>
    </div>

    <!-- デッキ投稿モーダル -->
    <div id="deckPostModal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;">
      <div style="background:#222;padding:2em 2em 1.5em 2em;border-radius:16px;max-width:420px;width:90vw;box-shadow:0 0 24px #000;position:relative;">
        <h2 style="color:#4caf50;margin-bottom:1em;">デッキ投稿</h2>
        <label style="color:#ffe082;">デッキ名</label><br>
        <input type="text" id="postDeckName" style="width:100%;padding:0.5em;margin-bottom:1em;border-radius:6px;border:1px solid #444;background:#181818;color:#fff;">
        <br>
        <label style="color:#ffe082;">コメント（任意）</label><br>
        <textarea id="postDeckComment" style="width:100%;height:4em;padding:0.5em;margin-bottom:1em;border-radius:6px;border:1px solid #444;background:#181818;color:#fff;"></textarea>
        <br>
        <button id="submitDeckPost" style="padding:0.6em 1.5em;background:#4caf50;color:#fff;border:none;border-radius:6px;font-size:1em;font-weight:bold;cursor:pointer;">投稿</button>
        <button id="closeDeckPostModal" style="padding:0.6em 1.2em;background:#888;color:#fff;border:none;border-radius:6px;font-size:1em;margin-left:1em;cursor:pointer;">閉じる</button>
        <div id="deckPostMsg" style="margin-top:1em;color:#ff5252;"></div>
      </div>
    </div>
    
    <div id="cardGrid" class="card-grid"></div>
    <div id="totalStatsBars"></div>
    
    <script>
        let allCards = [];
        let selectedCardNumbers = Array(10).fill(null);
        let selectedOcrData = Array(10).fill(null);
        let usedCardNumbers = [];
        let autoSaveEnabled = true;
        
        // クッキー操作のヘルパー関数
        function setCookie(name, value, days = 30) {
            const expires = new Date();
            expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${encodeURIComponent(JSON.stringify(value))};expires=${expires.toUTCString()};path=/`;
        }
        
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) {
                    try {
                        return JSON.parse(decodeURIComponent(c.substring(nameEQ.length, c.length)));
                    } catch (e) {
                        return null;
                    }
                }
            }
            return null;
        }
        
        // 自動保存機能
        function autoSaveDeck() {
            if (!autoSaveEnabled) return;
            
            const deckData = {
                timestamp: new Date().toISOString(),
                cards: selectedCardNumbers.map((cardNumber, index) => {
                    const card = allCards.find(c => c.number === cardNumber);
                    return {
                        index: index,
                        number: cardNumber,
                        name: card ? card.name : ''
                    };
                }),
                totalCost: document.getElementById('totalCost').textContent
            };
            
            setCookie('gundamAutoSave', deckData, 30);
        }
        
        // 自動復元機能
        function autoLoadDeck() {
            // まず保存済みデッキをチェック
            const savedDeck = getCookie('gundamLastSavedDeck');
            if (savedDeck && savedDeck.cards) {
                console.log('保存済みデッキを復元中...');
                applySavedDeck(savedDeck);
                console.log('デッキの復元が完了しました');
            }
            updateSumStats();
            
            // 次に自動保存デッキをチェック
            const autoSavedData = getCookie('gundamAutoSave');
            if (autoSavedData && autoSavedData.cards) {
                console.log('自動保存されたデッキを復元中...');
                applySavedDeck(autoSavedData);
                console.log('デッキの復元が完了しました');
            }
            updateSumStats();
        }
        
        // 保存されたデッキを適用する共通関数
        function applySavedDeck(deckData) {
            if (allCards.length > 0) {
                deckData.cards.forEach(cardInfo => {
                    if (cardInfo.number) {
                        const card = allCards.find(c => c.number === cardInfo.number);
                        if (card) {
                            const select = document.getElementById(`card-select-${cardInfo.index}`);
                            if (select) {
                                const cardIndex = allCards.indexOf(card);
                                select.value = cardIndex;
                                select.dispatchEvent(new Event('change'));
                            }
                        }
                    }
                });
                
                console.log('デッキの復元が完了しました');
            }
            updateSumStats();
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, fetching cards...');
            fetch('/fetch_cards')
                .then(res => res.json())
                .then(data => {
                    console.log('Fetched data:', data);
                    if (!data.success) {
                        document.getElementById('cardGrid').innerText = 'カードデータの取得に失敗しました';
                        return;
                    }
                    allCards = data.images;
                    
                    // 重複を除去（カード番号で一意にする）
                    const uniqueCards = [];
                    const seenNumbers = new Set();
                    for (const card of allCards) {
                        if (!seenNumbers.has(card.number)) {
                            uniqueCards.push(card);
                            seenNumbers.add(card.number);
                        }
                    }
                    allCards = uniqueCards;
                    
                    console.log('All cards loaded:', allCards.length, 'cards (duplicates removed)');
                    const cardGrid = document.getElementById('cardGrid');
                    cardGrid.innerHTML = '';
                    for (let i = 0; i < Math.min(10, allCards.length); i++) {
                        createCardItem(i, allCards[i]);
                    }
                    // 全カード初期化後に自動復元を実行
                    setTimeout(() => {
                        autoLoadDeck();
                    }, 100);
                })
                .catch(error => {
                    console.error('Error fetching cards:', error);
                });

            // デッキインポート処理
            const imported = localStorage.getItem('gundamDecks_import');
            if (imported) {
                try {
                    const deck = JSON.parse(imported);
                    if (deck && Array.isArray(deck.cards)) {
                        setTimeout(() => {
                            deck.cards.forEach((card, idx) => {
                                if (card && card.number) {
                                    const select = document.getElementById(`card-select-${idx}`);
                                    if (select) {
                                        select.value = Array.from(select.options).find(opt => {
                                            return allCards[opt.value] && allCards[opt.value].number == card.number;
                                        })?.value || select.value;
                                        select.dispatchEvent(new Event('change'));
                                    }
                                }
                            });
                        }, 500); // allCards取得後に実行
                    }
                } catch (e) {}
                localStorage.removeItem('gundamDecks_import');
            }
            
            // 検索ページから戻ってきた際のカードセット処理
            const selectedCardData = localStorage.getItem('selectedCardForDeck');
            if (selectedCardData) {
                try {
                    const data = JSON.parse(selectedCardData);
                    if (data && data.slot !== undefined && data.cardNumber) {
                        setTimeout(() => {
                            const card = allCards.find(c => c.number === data.cardNumber);
                            if (card) {
                                const select = document.getElementById(`card-select-${data.slot}`);
                                if (select) {
                                    const cardIndex = allCards.indexOf(card);
                                    select.value = cardIndex;
                                    select.dispatchEvent(new Event('change'));
                                    
                                    // 成功メッセージを表示
                                    const successMsg = document.createElement('div');
                                    successMsg.style.position = 'fixed';
                                    successMsg.style.top = '20px';
                                    successMsg.style.left = '50%';
                                    successMsg.style.transform = 'translateX(-50%)';
                                    successMsg.style.background = '#4caf50';
                                    successMsg.style.color = '#fff';
                                    successMsg.style.padding = '1rem 2rem';
                                    successMsg.style.borderRadius = '8px';
                                    successMsg.style.zIndex = '10000';
                                    successMsg.style.fontWeight = 'bold';
                                    successMsg.textContent = `スロット${data.slot + 1}に「${data.cardName}」をセットしました！`;
                                    document.body.appendChild(successMsg);
                                    
                                    // 3秒後にメッセージを削除
                                    setTimeout(() => {
                                        if (successMsg.parentNode) {
                                            successMsg.parentNode.removeChild(successMsg);
                                        }
                                    }, 3000);
                                }
                            }
                        }, 600); // 他の初期化処理の後に実行
                    }
                } catch (e) {
                    console.error('Error parsing selected card data:', e);
                }
                // 処理後にローカルストレージから削除
                localStorage.removeItem('selectedCardForDeck');
            }
        });

        // 検索用モーダルのHTMLをbody末尾に追加
        if (!document.getElementById('search-modal')) {
            const modal = document.createElement('div');
            modal.id = 'search-modal';
            modal.style.display = 'none';
            modal.style.position = 'fixed';
            modal.style.top = '0';
            modal.style.left = '0';
            modal.style.width = '100vw';
            modal.style.height = '100vh';
            modal.style.background = 'rgba(0,0,0,0.85)';
            modal.style.zIndex = '9999';
            modal.style.overflowY = 'auto';
            modal.innerHTML = `<div id="search-modal-content" style="max-width:1100px;margin:1em auto;background:#222;padding:1em;border-radius:16px;box-shadow:0 0 24px #000;min-height:200px;position:relative;max-height:90vh;overflow-y:auto;"></div>`;
            document.body.appendChild(modal);
        }

        function createCardItem(index, card) {
            const cardGrid = document.getElementById('cardGrid');
            const div = document.createElement('div');
            div.className = 'card-item row-top';
            
            const isPilotSlot = index >= 5;
            const isMSSlot = index < 5;
            
            const candidateCards = allCards.filter(c => {
                const isPilot = (c.ocr_data && c.ocr_data.type === 'PL') || c.category === 'PL';
                const isMS = (c.ocr_data && c.ocr_data.type === 'MS') || c.category === 'MS';
                if (isPilotSlot) return isPilot;
                if (isMSSlot) return isMS;
                return true;
            });
            
            const availableCards = candidateCards.filter(c => !usedCardNumbers.includes(c.number));
            const defaultCard = availableCards.length > 0 ? availableCards[0] : candidateCards[0];
            usedCardNumbers[index] = defaultCard.number;
            
            const frontUrl = defaultCard.front ? defaultCard.front.url : defaultCard.url;
            const backUrl = defaultCard.back && defaultCard.back.url ? defaultCard.back.url : null;
            let isFront = true;
            
            const img = document.createElement('img');
            img.src = frontUrl;
            img.alt = defaultCard.name;
            img.id = `card-img-${index}`;
            img.style.cursor = 'pointer';
            img.addEventListener('click', function() {
                if (backUrl) {
                    isFront = !isFront;
                    img.src = isFront ? frontUrl : backUrl;
                }
            });
            
            const number = document.createElement('div');
            number.className = 'card-number';
            number.id = `card-number-${index}`;
            number.textContent = defaultCard.number;
            
            const name = document.createElement('div');
            name.className = 'card-name';
            name.id = `card-name-${index}`;
            name.textContent = defaultCard.name;
            name.title = defaultCard.name;
            
            const select = document.createElement('select');
            select.className = 'card-select';
            select.id = `card-select-${index}`;
            candidateCards.forEach((c, idx) => {
                const opt = document.createElement('option');
                opt.value = allCards.indexOf(c);
                opt.textContent = `${c.number} - ${c.name}`;
                if (c.number === defaultCard.number) opt.selected = true;
                select.appendChild(opt);
            });
            
            const ocrDiv = document.createElement('div');
            ocrDiv.className = 'ocr-params';
            ocrDiv.id = `ocr-params-${index}`;
            updateOcrParams(defaultCard.number, ocrDiv, index);
            
            select.onchange = function() {
                const selectedCard = allCards[this.value];
                const newFrontUrl = selectedCard.front ? selectedCard.front.url : selectedCard.url;
                const newBackUrl = selectedCard.back && selectedCard.back.url ? selectedCard.back.url : null;
                isFront = true;
                img.src = newFrontUrl;
                img.alt = selectedCard.name;
                img.onclick = null;
                img.addEventListener('click', function() {
                    if (newBackUrl) {
                        isFront = !isFront;
                        img.src = isFront ? newFrontUrl : newBackUrl;
                    }
                });
                document.getElementById(`card-number-${index}`).textContent = selectedCard.number;
                document.getElementById(`card-name-${index}`).textContent = selectedCard.name;
                document.getElementById(`card-name-${index}`).title = selectedCard.name;
                updateOcrParams(selectedCard.number, ocrDiv, index);
                usedCardNumbers[index] = selectedCard.number;
                
                // 自動保存を実行
                setTimeout(() => {
                    autoSaveDeck();
                }, 100);
            };
            
            div.appendChild(img);
            div.appendChild(number);
            div.appendChild(name);
            div.appendChild(select);
            div.appendChild(ocrDiv);

            // 横断検索テキストボックスとボタン
            const searchDiv = document.createElement('div');
            searchDiv.style.margin = '0.5em 0 0.2em 0';
            searchDiv.style.display = 'flex';
            searchDiv.style.flexDirection = 'column';
            searchDiv.style.alignItems = 'stretch';
            searchDiv.style.gap = '0.3em';
            searchDiv.style.flexShrink = '0';
            const searchInput = document.createElement('input');
            searchInput.type = 'text';
            searchInput.placeholder = 'カード横断検索...';
            searchInput.style.width = '100%';
            searchInput.style.padding = '0.3em';
            searchInput.style.borderRadius = '4px';
            searchInput.style.border = '1px solid #444';
            searchInput.style.background = '#333';
            searchInput.style.color = '#fff';
            searchInput.style.fontSize = '1em';
            searchInput.style.boxSizing = 'border-box';
            const searchBtn = document.createElement('button');
            searchBtn.textContent = '検索';
            searchBtn.style.padding = '0.4em 1em';
            searchBtn.style.borderRadius = '4px';
            searchBtn.style.border = '1px solid #66f2c5';
            searchBtn.style.background = '#66f2c5';
            searchBtn.style.color = '#222';
            searchBtn.style.cursor = 'pointer';
            searchBtn.style.width = '100%';
            searchBtn.style.fontSize = '1em';
            searchBtn.onclick = function() {
                const keyword = searchInput.value.trim();
                if (!keyword) return;
                showSearchModal(keyword, index);
            };
            searchDiv.appendChild(searchInput);
            searchDiv.appendChild(searchBtn);
            div.appendChild(searchDiv);
            
            // 数値検索からカードをセットボタン
            const paramSearchBtn = document.createElement('button');
            paramSearchBtn.textContent = '数値検索からカードをセット';
            paramSearchBtn.style.padding = '0.4em 1em';
            paramSearchBtn.style.borderRadius = '4px';
            paramSearchBtn.style.border = '1px solid #ff9800';
            paramSearchBtn.style.background = '#ff9800';
            paramSearchBtn.style.color = '#222';
            paramSearchBtn.style.cursor = 'pointer';
            paramSearchBtn.style.width = '100%';
            paramSearchBtn.style.fontSize = '0.9em';
            paramSearchBtn.style.marginTop = '0.3em';
            paramSearchBtn.style.fontWeight = 'bold';
            paramSearchBtn.onclick = function() {
                // 検索ページに遷移し、対象スロット番号を渡す
                window.location.href = `/search?slot=${index}`;

            // 合計ステータス表示欄（6〜10番目のみ）

                sumStatsDiv.id = `sum-stats-${index}`;
                sumStatsDiv.style.background = '#222';

                sumStatsDiv.style.justifyContent = 'center';

        // OCRパラメータ表示更新
        function updateOcrParams(cardNumber, ocrDiv, index) {
            selectedCardNumbers[index] = cardNumber;
            
            const card = allCards.find(c => c.number === cardNumber);
            
            if (!card || !card.ocr_data) {
                ocrDiv.innerHTML = '';
                selectedOcrData[index] = null;
                updateTotalCost();
                updateSumStats();
                updateAllLinkAbilities(); // 全リンクアビリティを更新
                return;
            }

            const ocrJson = card.ocr_data;
            selectedOcrData[index] = ocrJson;
            
            let params = '';
            let linkAbility = '';

            if (ocrJson.type === 'MS') {
                if (ocrJson.stats) {
                    params += '<div class="param-group">';
                    params += '<div class="param-row">';
                    params += `<div class="param-item"><span class="label">機動力:</span><span>${ocrJson.stats.mobility || ''}</span></div>`;
                    params += `<div class="param-item"><span class="label">遠距離:</span><span>${ocrJson.stats.ranged_attack || ''}</span></div>`;
                    params += '</div>';
                    params += '<div class="param-row">';
                    params += `<div class="param-item"><span class="label">近距離:</span><span>${ocrJson.stats.melee_attack || ''}</span></div>`;
                    params += `<div class="param-item"><span class="label">HP:</span><span>${ocrJson.stats.hp || ''}</span></div>`;
                    params += '</div>';
                    params += '</div>';
                }
                
                if (ocrJson.ms_ability) {
                    params += '<div class="param-group skill">';
                    params += `<div style='color:#b2e5ff;font-size:0.97em;'>MSスキル: <span style='color:#fff;'>${ocrJson.ms_ability.name || ''}</span></div>`;
                    if (ocrJson.ms_ability.description) {
                        params += `<div style='color:#b2e5ff;font-size:0.92em;margin-top:0.1em;'>${ocrJson.ms_ability.description}</div>`;
                    }
                    params += '</div>';
                }
                
                if (ocrJson.special_attack) {
                    params += '<div class="param-group spattack">';
                    params += `<div style='color:#ffb2b2;font-size:0.92em;'>SPアタック: ${ocrJson.special_attack.name || ''}</div>`;
                    if (ocrJson.special_attack.description) {
                        params += `<div style='color:#ffb2b2;font-size:0.88em;margin-top:0.05em;'>${ocrJson.special_attack.description}</div>`;
                    }
                    params += '</div>';
                }
                
            } else if (ocrJson.type === 'PL') {
                if (ocrJson.stats) {
                    params += '<div class="param-group">';
                    params += '<div class="param-row">';
                    params += `<div class="param-item"><span class="label">機動力:</span><span>${ocrJson.stats.mobility || ''}</span></div>`;
                    params += `<div class="param-item"><span class="label">遠距離:</span><span>${ocrJson.stats.ranged_attack || ''}</span></div>`;
                    params += '</div>';
                    params += '<div class="param-row">';
                    params += `<div class="param-item"><span class="label">近距離:</span><span>${ocrJson.stats.melee_attack || ''}</span></div>`;
                    params += `<div class="param-item"><span class="label">HP:</span><span>${ocrJson.stats.hp || ''}</span></div>`;
                    params += '</div>';
                    params += '</div>';
                }
                
                if (ocrJson.pl_skill) {
                    params += '<div class="param-group skill">';
                    params += `<div style='color:#ffe082;font-size:0.97em;'>PLスキル: <span style='color:#fff;'>${ocrJson.pl_skill.name || ''}</span></div>`;
                    if (ocrJson.pl_skill.effect) {
                        params += `<div style='color:#ffe082;font-size:0.92em;margin-top:0.1em;'>${ocrJson.pl_skill.effect}</div>`;
                    }
                    params += '</div>';
                }
            }
            
            if (Array.isArray(ocrJson.link_abilities) && ocrJson.link_abilities.length > 0) {
                linkAbility += '<div class="param-group link">';
                linkAbility += '<div style="color:#ffe082;">リンクアビリティ:</div>';
                ocrJson.link_abilities.forEach((ab, idx) => {
                    // リンクアビリティが発動中かどうかをチェック
                    let isActive = false;
                    let activeText = '';
                    if (ab.condition && ab.condition.match(/デッキに(\d+)枚以上/)) {
                        const match = ab.condition.match(/デッキに(\d+)枚以上/);
                        const count = parseInt(match[1], 10);
                        let found = selectedOcrData.filter(d => {
                            if (!d) return false;
                            if (!Array.isArray(d.link_abilities)) return false;
                            return d.link_abilities.some(link => {
                                let n = link.name ?? '';
                                return n === ab.name;
                            });
                        }).length;
                        if (found >= count) {
                            isActive = true;
                            activeText = ' <span style="color:#ff5252;font-weight:bold;">【発動中】</span>';
                        }
                    }
                    
                    // 発動中の場合は色を変更
                    const nameColor = isActive ? '#42a5f5' : '#888';
                    const conditionColor = isActive ? '#42a5f5' : '#aaa';
                    const effectColor = isActive ? '#42a5f5' : '#bbb';
                    const fontWeight = isActive ? 'bold' : 'normal';
                    const fontStyle = isActive ? 'normal' : 'italic';
                    const opacity = isActive ? 1 : 0.7;
                    
                    linkAbility += `<div style='font-size:0.95em;margin-top:0.1em;'>・<span style='color:${nameColor};font-weight:${fontWeight};font-style:${fontStyle};opacity:${opacity};'>${ab.name || ''}</span> <span style='color:${conditionColor};font-weight:${fontWeight};font-style:${fontStyle};opacity:${opacity};'>${ab.condition || ''}</span> <span style='color:${effectColor};font-weight:${fontWeight};font-style:${fontStyle};opacity:${opacity};'>${ab.effect || ''}</span>${activeText}</div>`;
                });
                linkAbility += '</div>';
            }
            
            ocrDiv.innerHTML = params + linkAbility;
            updateTotalCost();
            updateSumStats();
            updateAllLinkAbilities(); // 全リンクアビリティを更新
        }

        // 全カードのリンクアビリティを一括更新する関数
        function updateAllLinkAbilities() {
            // 各カードのリンクアビリティ発動状態を再計算
            for (let i = 0; i < 10; i++) {
                const ocrDiv = document.getElementById(`ocr-params-${i}`);
                if (ocrDiv && selectedOcrData[i]) {
                    updateLinkAbilitiesForCard(i, selectedOcrData[i], ocrDiv);
                }
            }
        }

        // 特定のカードのリンクアビリティ表示を更新
        function updateLinkAbilitiesForCard(index, ocrJson, ocrDiv) {
            if (!Array.isArray(ocrJson.link_abilities) || ocrJson.link_abilities.length === 0) {
                return;
            }

            // 既存のリンクアビリティ部分を探して更新
            const linkGroup = ocrDiv.querySelector('.param-group.link');
            if (!linkGroup) {
                return;
            }

            let linkAbility = '<div style="color:#ffe082;">リンクアビリティ:</div>';
            ocrJson.link_abilities.forEach((ab, idx) => {
                // リンクアビリティが発動中かどうかをチェック
                let isActive = false;
                let activeText = '';
                if (ab.condition && ab.condition.match(/デッキに(\d+)枚以上/)) {
                    const match = ab.condition.match(/デッキに(\d+)枚以上/);
                    const count = parseInt(match[1], 10);
                    let found = selectedOcrData.filter(d => {
                        if (!d) return false;
                        if (!Array.isArray(d.link_abilities)) return false;
                        return d.link_abilities.some(link => {
                            let n = link.name ?? '';
                            return n === ab.name;
                        });
                    }).length;
                    if (found >= count) {
                        isActive = true;
                        activeText = ' <span style="color:#ff5252;font-weight:bold;">【発動中】</span>';
                    }
                }
                
                // 発動中の場合は色を変更
                const nameColor = isActive ? '#42a5f5' : '#888';
                const conditionColor = isActive ? '#42a5f5' : '#aaa';
                const effectColor = isActive ? '#42a5f5' : '#bbb';
                const fontWeight = isActive ? 'bold' : 'normal';
                const fontStyle = isActive ? 'normal' : 'italic';
                const opacity = isActive ? 1 : 0.7;
                
                linkAbility += `<div style='font-size:0.95em;margin-top:0.1em;'>・<span style='color:${nameColor};font-weight:${fontWeight};font-style:${fontStyle};opacity:${opacity};'>${ab.name || ''}</span> <span style='color:${conditionColor};font-weight:${fontWeight};font-style:${fontStyle};opacity:${opacity};'>${ab.condition || ''}</span> <span style='color:${effectColor};font-weight:${fontWeight};font-style:${fontStyle};opacity:${opacity};'>${ab.effect || ''}</span>${activeText}</div>`;
            });

            linkGroup.innerHTML = linkAbility;
        }

        // 総コスト更新
        function updateTotalCost() {
            let totalCost = 0;
            selectedOcrData.forEach(ocr => {
                if (ocr && ocr.cost) {
                    const cost = parseInt(ocr.cost, 10);
                    if (!isNaN(cost)) {
                        totalCost += cost;
                    }
                }
            });
            document.getElementById('totalCost').textContent = `総コスト: ${totalCost}`;
        }

        // 合計ステータス更新
        function updateSumStats() {
            // 各パラメータの最大値を計算
            let maxMobility = 0;
            let maxRanged = 0;
            let maxMelee = 0;
            let maxHp = 0;

            // 全カードから最大値を取得
            allCards.forEach(card => {
                if (card.ocr_data && card.ocr_data.stats) {
                    const stats = card.ocr_data.stats;
                    if (stats.mobility) {
                        const mobility = parseInt(stats.mobility, 10);
                        if (!isNaN(mobility)) maxMobility = Math.max(maxMobility, mobility);
                    }
                    if (stats.ranged_attack) {
                        const ranged = parseInt(stats.ranged_attack, 10);
                        if (!isNaN(ranged)) maxRanged = Math.max(maxRanged, ranged);
                    }
                    if (stats.melee_attack) {
                        const melee = parseInt(stats.melee_attack, 10);
                        if (!isNaN(melee)) maxMelee = Math.max(maxMelee, melee);
                    }
                    if (stats.hp) {
                        const hp = parseInt(stats.hp, 10);
                        if (!isNaN(hp)) maxHp = Math.max(maxHp, hp);
                    }
                }
            });

            // 最大値の2倍（MS+PLの最大組み合わせ）を基準とする
            const maxMobilityTotal = 1000;
            const maxRangedTotal = 1000;
            const maxMeleeTotal = 1000;
            const maxHpTotal = 1000;

            // 6〜10番目のカードに合計値を表示
            const totalStatsBars = document.getElementById('totalStatsBars');
            if (totalStatsBars) {
                totalStatsBars.innerHTML = '';
                for (let i = 5; i < 10; i++) {
                    const msIndex = i - 5; // 対応するMSカードのインデックス (0,1,2,3,4)
                    const plIndex = i; // パイロットカードのインデックス (5,6,7,8,9)
                    
                    // MSカードの統計を取得
                    const msOcr = selectedOcrData[msIndex];
                    let msMobility = 0, msRanged = 0, msMelee = 0, msHp = 0;
                    if (msOcr && msOcr.stats) {
                        msMobility = parseInt(msOcr.stats.mobility, 10) || 0;
                        msRanged = parseInt(msOcr.stats.ranged_attack, 10) || 0;
                        msMelee = parseInt(msOcr.stats.melee_attack, 10) || 0;
                        msHp = parseInt(msOcr.stats.hp, 10) || 0;
                    }
                    // パイロットカードの統計を取得
                    const plOcr = selectedOcrData[plIndex];
                    let plMobility = 0, plRanged = 0, plMelee = 0, plHp = 0;
                    if (plOcr && plOcr.stats) {
                        plMobility = parseInt(plOcr.stats.mobility, 10) || 0;
                        plRanged = parseInt(plOcr.stats.ranged_attack, 10) || 0;
                        plMelee = parseInt(plOcr.stats.melee_attack, 10) || 0;
                        plHp = parseInt(plOcr.stats.hp, 10) || 0;
                    }
                    // --- リンクアビリティ補正 ---
                    function getLinkBuffs(ocr) {
                        const buffs = {
                            mobility: { small: 0, medium: 0 },
                            ranged: { small: 0, medium: 0 },
                            melee: { small: 0, medium: 0 },
                            hp: { small: 0, medium: 0 }
                        };
                        if (!ocr || !Array.isArray(ocr.link_abilities)) return buffs;
                        ocr.link_abilities.forEach(link => {
                            const eff = link.effect || '';
                            // 小アップ
                            if (eff.match(/機動力.*小アップ|\[機動力\].*小アップ|"機動力".*小アップ/)) buffs.mobility.small++;
                            if (eff.match(/遠距離攻撃力.*小アップ|\[遠距離攻撃力\].*小アップ|"遠距離攻撃力".*小アップ/)) buffs.ranged.small++;
                            if (eff.match(/近距離攻撃力.*小アップ|\[近距離攻撃力\].*小アップ|"近距離攻撃力".*小アップ/)) buffs.melee.small++;
                            if (eff.match(/HP.*小アップ|\[HP\].*小アップ|"HP".*小アップ/)) buffs.hp.small++;
                            // 中アップ
                            if (eff.match(/機動力.*中アップ|\[機動力\].*中アップ|"機動力".*中アップ/)) buffs.mobility.medium++;
                            if (eff.match(/遠距離攻撃力.*中アップ|\[遠距離攻撃力\].*中アップ|"遠距離攻撃力".*中アップ/)) buffs.ranged.medium++;
                            if (eff.match(/近距離攻撃力.*中アップ|\[近距離攻撃力\].*中アップ|"近距離攻撃力".*中アップ/)) buffs.melee.medium++;
                            if (eff.match(/HP.*中アップ|\[HP\].*中アップ|"HP".*中アップ/)) buffs.hp.medium++;
                        });
                        return buffs;
                    }
                    // MS/PLごとに補正値を計算
                    const msBuffs = getLinkBuffs(msOcr);
                    const plBuffs = getLinkBuffs(plOcr);
                    function applyBuff(val, small, medium) {
                        return Math.round(val * Math.pow(1.1, small) * Math.pow(1.2, medium));
                    }
                    // 補正後の値
                    const msMobilityBuffed = applyBuff(msMobility, msBuffs.mobility.small, msBuffs.mobility.medium);
                    const msRangedBuffed = applyBuff(msRanged, msBuffs.ranged.small, msBuffs.ranged.medium);
                    const msMeleeBuffed = applyBuff(msMelee, msBuffs.melee.small, msBuffs.melee.medium);
                    const msHpBuffed = applyBuff(msHp, msBuffs.hp.small, msBuffs.hp.medium);
                    const plMobilityBuffed = applyBuff(plMobility, plBuffs.mobility.small, plBuffs.mobility.medium);
                    const plRangedBuffed = applyBuff(plRanged, plBuffs.ranged.small, plBuffs.ranged.medium);
                    const plMeleeBuffed = applyBuff(plMelee, plBuffs.melee.small, plBuffs.melee.medium);
                    const plHpBuffed = applyBuff(plHp, plBuffs.hp.small, plBuffs.hp.medium);
                    
                    // 元の値（補正なし）
                    const baseMobility = msMobility + plMobility;
                    const baseRanged = msRanged + plRanged;
                    const baseMelee = msMelee + plMelee;
                    const baseHp = msHp + plHp;
                    
                    // 補正後の合計値
                    const totalMobility = msMobilityBuffed + plMobilityBuffed;
                    const totalRanged = msRangedBuffed + plRangedBuffed;
                    const totalMelee = msMeleeBuffed + plMeleeBuffed;
                    const totalHp = msHpBuffed + plHpBuffed;
                    
                    // 上昇分を計算
                    const mobilityBuff = totalMobility - baseMobility;
                    const rangedBuff = totalRanged - baseRanged;
                    const meleeBuff = totalMelee - baseMelee;
                    const hpBuff = totalHp - baseHp;

                    // パーセンテージを計算
                    const mobilityPercent = maxMobilityTotal > 0 ? (totalMobility / maxMobilityTotal) * 100 : 0;
                    const rangedPercent = maxRangedTotal > 0 ? (totalRanged / maxRangedTotal) * 100 : 0;
                    const meleePercent = maxMeleeTotal > 0 ? (totalMelee / maxMeleeTotal) * 100 : 0;
                    const hpPercent = maxHpTotal > 0 ? (totalHp / maxHpTotal) * 100 : 0;
                    
                    // 元の値と上昇分のパーセンテージ
                    const baseMobilityPercent = maxMobilityTotal > 0 ? (baseMobility / maxMobilityTotal) * 100 : 0;
                    const baseRangedPercent = maxRangedTotal > 0 ? (baseRanged / maxRangedTotal) * 100 : 0;
                    const baseMeleePercent = maxMeleeTotal > 0 ? (baseMelee / maxMeleeTotal) * 100 : 0;
                    const baseHpPercent = maxHpTotal > 0 ? (baseHp / maxHpTotal) * 100 : 0;
                    
                    const mobilityBuffPercent = maxMobilityTotal > 0 ? (mobilityBuff / maxMobilityTotal) * 100 : 0;
                    const rangedBuffPercent = maxRangedTotal > 0 ? (rangedBuff / maxRangedTotal) * 100 : 0;
                    const meleeBuffPercent = maxMeleeTotal > 0 ? (meleeBuff / maxMeleeTotal) * 100 : 0;
                    const hpBuffPercent = maxHpTotal > 0 ? (hpBuff / maxHpTotal) * 100 : 0;

                    const barHtml = `
                    <div class="stats-bar">
                        <div class="stats-title">${i-4}番機</div>
                        <div class="stats-value">機動力合計: ${totalMobility} <span class="stats-buff">(+${mobilityBuff})</span></div>
                        <div class="stats-bar-container">
                            <div class="stats-bar-base" style="width:${baseMobilityPercent}%"></div>
                            <div class="stats-bar-buff" style="width:${mobilityBuffPercent}%;left:${baseMobilityPercent}%"></div>
                            <div class="stats-scale">
                                <div class="stats-scale-line" style="left:0%"></div>
                                <div class="stats-scale-line" style="left:20%"></div>
                                <div class="stats-scale-line" style="left:40%"></div>
                                <div class="stats-scale-line" style="left:60%"></div>
                                <div class="stats-scale-line" style="left:80%"></div>
                                <div class="stats-scale-line" style="left:100%"></div>
                            </div>
                        </div>
                        <div class="stats-percent">${mobilityPercent.toFixed(1)}%</div>
                        
                        <div class="stats-value">遠距離合計: ${totalRanged} <span class="stats-buff">(+${rangedBuff})</span></div>
                        <div class="stats-bar-container">
                            <div class="stats-bar-base" style="width:${baseRangedPercent}%"></div>
                            <div class="stats-bar-buff" style="width:${rangedBuffPercent}%;left:${baseRangedPercent}%"></div>
                            <div class="stats-scale">
                                <div class="stats-scale-line" style="left:0%"></div>
                                <div class="stats-scale-line" style="left:20%"></div>
                                <div class="stats-scale-line" style="left:40%"></div>
                                <div class="stats-scale-line" style="left:60%"></div>
                                <div class="stats-scale-line" style="left:80%"></div>
                                <div class="stats-scale-line" style="left:100%"></div>
                            </div>
                        </div>
                        <div class="stats-percent">${rangedPercent.toFixed(1)}%</div>
                        
                        <div class="stats-value">近距離合計: ${totalMelee} <span class="stats-buff">(+${meleeBuff})</span></div>
                        <div class="stats-bar-container">
                            <div class="stats-bar-base" style="width:${baseMeleePercent}%"></div>
                            <div class="stats-bar-buff" style="width:${meleeBuffPercent}%;left:${baseMeleePercent}%"></div>
                            <div class="stats-scale">
                                <div class="stats-scale-line" style="left:0%"></div>
                                <div class="stats-scale-line" style="left:20%"></div>
                                <div class="stats-scale-line" style="left:40%"></div>
                                <div class="stats-scale-line" style="left:60%"></div>
                                <div class="stats-scale-line" style="left:80%"></div>
                                <div class="stats-scale-line" style="left:100%"></div>
                            </div>
                        </div>
                        <div class="stats-percent">${meleePercent.toFixed(1)}%</div>
                        
                        <div class="stats-value">HP合計: ${totalHp} <span class="stats-buff">(+${hpBuff})</span></div>
                        <div class="stats-bar-container">
                            <div class="stats-bar-base" style="width:${baseHpPercent}%"></div>
                            <div class="stats-bar-buff" style="width:${hpBuffPercent}%;left:${baseHpPercent}%"></div>
                            <div class="stats-scale">
                                <div class="stats-scale-line" style="left:0%"></div>
                                <div class="stats-scale-line" style="left:20%"></div>
                                <div class="stats-scale-line" style="left:40%"></div>
                                <div class="stats-scale-line" style="left:60%"></div>
                                <div class="stats-scale-line" style="left:80%"></div>
                                <div class="stats-scale-line" style="left:100%"></div>
                            </div>
                        </div>
                        <div class="stats-percent">${hpPercent.toFixed(1)}%</div>
                    </div>`;
                    totalStatsBars.innerHTML += barHtml;
                }
            }
        }

        // 検索モーダル表示
        function showSearchModal(keyword, targetIndex) {
            const modal = document.getElementById('search-modal');
            const modalContent = document.getElementById('search-modal-content');
            
            const searchResults = allCards.filter(card => {
                const keywordLower = keyword.toLowerCase();
                
                const nameMatch = card.name && card.name.toLowerCase().includes(keywordLower);
                const numberMatch = card.number && card.number.toLowerCase().includes(keywordLower);
                const seriesMatch = card.front && card.front.series && card.front.series.toLowerCase().includes(keywordLower);
                
                let ocrMatch = false;
                if (card.ocr_data) {
                    const ocr = card.ocr_data;
                    
                    if (ocr.category && ocr.category.toLowerCase().includes(keywordLower)) ocrMatch = true;
                    if (ocr.type && ocr.type.toLowerCase().includes(keywordLower)) ocrMatch = true;
                    if (ocr.pilot && ocr.pilot.toLowerCase().includes(keywordLower)) ocrMatch = true;
                    
                    if (ocr.stats) {
                        const stats = ocr.stats;
                        if (stats.mobility && stats.mobility.toString().includes(keyword)) ocrMatch = true;
                        if (stats.ranged_attack && stats.ranged_attack.toString().includes(keyword)) ocrMatch = true;
                        if (stats.melee_attack && stats.melee_attack.toString().includes(keyword)) ocrMatch = true;
                        if (stats.hp && stats.hp.toString().includes(keyword)) ocrMatch = true;
                    }
                    
                    if (ocr.cost && ocr.cost.toString().includes(keyword)) ocrMatch = true;
                    if (ocr.terrain && ocr.terrain.toLowerCase().includes(keywordLower)) ocrMatch = true;
                    
                    if (ocr.ms_ability) {
                        if (ocr.ms_ability.name && ocr.ms_ability.name.toLowerCase().includes(keywordLower)) ocrMatch = true;
                        if (ocr.ms_ability.description && ocr.ms_ability.description.toLowerCase().includes(keywordLower)) ocrMatch = true;
                    }
                    
                    if (ocr.pl_skill) {
                        if (ocr.pl_skill.name && ocr.pl_skill.name.toLowerCase().includes(keywordLower)) ocrMatch = true;
                        if (ocr.pl_skill.effect && ocr.pl_skill.effect.toLowerCase().includes(keywordLower)) ocrMatch = true;
                    }
                    
                    if (ocr.special_attack) {
                        if (ocr.special_attack.name && ocr.special_attack.name.toLowerCase().includes(keywordLower)) ocrMatch = true;
                        if (ocr.special_attack.description && ocr.special_attack.description.toLowerCase().includes(keywordLower)) ocrMatch = true;
                    }
                    
                    if (Array.isArray(ocr.link_abilities)) {
                        ocr.link_abilities.forEach(ab => {
                            if (ab.name && ab.name.toLowerCase().includes(keywordLower)) ocrMatch = true;
                            if (ab.condition && ab.condition.toLowerCase().includes(keywordLower)) ocrMatch = true;
                            if (ab.effect && ab.effect.toLowerCase().includes(keywordLower)) ocrMatch = true;
                        });
                    }
                    
                    if (ocr.tactics && ocr.tactics.toLowerCase().includes(keywordLower)) ocrMatch = true;
                }
                
                return nameMatch || numberMatch || seriesMatch || ocrMatch;
            });
            
            // 重複を排除（カード番号で一意にする）
            const uniqueResults = [];
            const seenNumbers = new Set();
            for (const card of searchResults) {
                if (card.number && !seenNumbers.has(card.number)) {
                    uniqueResults.push(card);
                    seenNumbers.add(card.number);
                }
            }
            
            let html = `<h2 style="color:#4caf50;margin-bottom:1em;">検索結果: "${keyword}" (${uniqueResults.length}件)</h2>`;
            
            if (uniqueResults.length === 0) {
                html += '<p style="color:#ff5252;">該当するカードが見つかりませんでした。</p>';
            } else {
                html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1em;">';
                uniqueResults.forEach(card => {
                    let matchReason = '';
                    const keywordLower = keyword.toLowerCase();
                    
                    if (card.name && card.name.toLowerCase().includes(keywordLower)) {
                        matchReason += '名前 ';
                    }
                    if (card.number && card.number.toLowerCase().includes(keywordLower)) {
                        matchReason += '番号 ';
                    }
                    if (card.front && card.front.series && card.front.series.toLowerCase().includes(keywordLower)) {
                        matchReason += 'シリーズ ';
                    }
                    if (card.ocr_data) {
                        const ocr = card.ocr_data;
                        if (ocr.category && ocr.category.toLowerCase().includes(keywordLower)) matchReason += 'カテゴリ ';
                        if (ocr.pilot && ocr.pilot.toLowerCase().includes(keywordLower)) matchReason += 'パイロット ';
                        if (ocr.ms_ability && ocr.ms_ability.name && ocr.ms_ability.name.toLowerCase().includes(keywordLower)) matchReason += 'MSスキル ';
                        if (ocr.pl_skill && ocr.pl_skill.name && ocr.pl_skill.name.toLowerCase().includes(keywordLower)) matchReason += 'PLスキル ';
                    }
                    
                    html += `
                        <div style="background:#333;padding:0.5em;border-radius:8px;cursor:pointer;border:1px solid #444;" 
                             onclick="selectCardFromSearch('${card.number}', ${targetIndex})">
                            <img src="${card.front ? card.front.url : card.url}" 
                                 style="width:100%;height:auto;border-radius:4px;margin-bottom:0.5em;" 
                                 alt="${card.name}">
                            <div style="font-size:0.9em;color:#4caf50;">${card.number}</div>
                            <div style="font-size:0.9em;">${card.name}</div>
                            <div style="font-size:0.8em;color:#888;margin-top:0.2em;">${card.front ? card.front.series : ''}</div>
                            ${matchReason ? `<div style="font-size:0.75em;color:#ffb74d;margin-top:0.1em;">マッチ: ${matchReason}</div>` : ''}
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            html += '<div style="text-align:center;margin-top:1em;"><button onclick="closeSearchModal()" style="padding:0.5em 1em;background:#4caf50;color:#fff;border:none;border-radius:4px;cursor:pointer;">閉じる</button></div>';
            
            modalContent.innerHTML = html;
            modal.style.display = 'block';
        }

        // 検索結果からカードを選択
        function selectCardFromSearch(cardNumber, targetIndex) {
            const card = allCards.find(c => c.number === cardNumber);
            if (card) {
                const select = document.getElementById(`card-select-${targetIndex}`);
                const cardIndex = allCards.indexOf(card);
                select.value = cardIndex;
                select.dispatchEvent(new Event('change'));
                
                closeSearchModal();
            }
        }

        // 検索モーダルを閉じる
        function closeSearchModal() {
            document.getElementById('search-modal').style.display = 'none';
        }

        // デッキ保存機能
        function saveDeck() {
            const deckName = document.getElementById('deckName').value.trim();
            if (!deckName) {
                alert('デッキ名を入力してください');
                return;
            }

            const deckData = {
                name: deckName,
                timestamp: new Date().toISOString(),
                cards: selectedCardNumbers.map((cardNumber, index) => {
                    const card = allCards.find(c => c.number === cardNumber);
                    return {
                        index: index,
                        number: cardNumber,
                        name: card ? card.name : '',
                        isFront: true
                    };
                }),
                totalCost: document.getElementById('totalCost').textContent
            };

            // ローカルストレージに保存
            const savedDecks = JSON.parse(localStorage.getItem('gundamDecks') || '{}');
            savedDecks[deckName] = deckData;
            localStorage.setItem('gundamDecks', JSON.stringify(savedDecks));

            // クッキーにも保存（最新のデッキとして）
            setCookie('gundamLastSavedDeck', deckData, 30);

            alert(`デッキ「${deckName}」を保存しました（ローカルストレージとクッキーの両方に保存）`);
            document.getElementById('deckName').value = '';
            showSavedDecks();
        }

        // デッキ読み込み機能
        function loadDeck() {
            showSavedDecks();
        }

        // 保存済みデッキ一覧を表示
        function showSavedDecks() {
            const savedDecks = JSON.parse(localStorage.getItem('gundamDecks') || '{}');
            const deckList = document.getElementById('deckList');
            const savedDecksDiv = document.getElementById('savedDecks');

            let html = '';
            
            // クッキーから最新のデッキを取得
            const cookieDeck = getCookie('gundamLastSavedDeck');
            const autoSavedDeck = getCookie('gundamAutoSave');
            
            // クッキーから読み取れるデッキを表示
            if (cookieDeck && cookieDeck.cards) {
                const date = new Date(cookieDeck.timestamp).toLocaleString('ja-JP');
                html += `
                    <div style="background:#2a4a2a;padding:0.8rem;margin-bottom:0.5rem;border-radius:4px;border:2px solid #4caf50;">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <div>
                                <strong style="color:#4caf50;">📋 最新のデッキ（クッキー）</strong>
                                <div style="font-size:0.8em;color:#888;margin-top:0.2rem;">保存日時: ${date}</div>
                                <div style="font-size:0.8em;color:#888;">${cookieDeck.totalCost}</div>
                            </div>
                            <div>
                                <button onclick="applyCookieDeck()" style="padding:0.3rem 0.8rem;background:#4caf50;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.8em;">適用</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            // 自動保存デッキを表示（最新のデッキと異なる場合のみ）
            if (autoSavedDeck && autoSavedDeck.cards && 
                (!cookieDeck || JSON.stringify(autoSavedDeck) !== JSON.stringify(cookieDeck))) {
                const date = new Date(autoSavedDeck.timestamp).toLocaleString('ja-JP');
                html += `
                    <div style="background:#2a2a4a;padding:0.8rem;margin-bottom:0.5rem;border-radius:4px;border:2px solid #2196f3;">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <div>
                                <strong style="color:#2196f3;">🔄 自動保存デッキ（クッキー）</strong>
                                <div style="font-size:0.8em;color:#888;margin-top:0.2rem;">保存日時: ${date}</div>
                                <div style="font-size:0.8em;color:#888;">${autoSavedDeck.totalCost}</div>
                            </div>
                            <div>
                                <button onclick="applyAutoSavedDeck()" style="padding:0.3rem 0.8rem;background:#2196f3;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.8em;">適用</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // ローカルストレージの保存済みデッキを表示
            if (Object.keys(savedDecks).length === 0) {
                if ((!cookieDeck || !cookieDeck.cards) && (!autoSavedDeck || !autoSavedDeck.cards)) {
                    deckList.innerHTML = '<p style="color:#888;">保存済みデッキがありません</p>';
                    savedDecksDiv.style.display = 'block';
                    // デッキリストを開いた状態にする
                    setTimeout(() => {
                        openDeckList();
                    }, 100);
                    return;
                }
            } else {
                html += '<h5 style="color:#ffe082;margin:1rem 0 0.5rem 0;">ローカルストレージの保存済みデッキ</h5>';
                Object.values(savedDecks).forEach(deck => {
                    const date = new Date(deck.timestamp).toLocaleString('ja-JP');
                    html += `
                        <div style="background:#333;padding:0.8rem;margin-bottom:0.5rem;border-radius:4px;border:1px solid #444;">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <div>
                                    <strong style="color:#4caf50;">${deck.name}</strong>
                                    <div style="font-size:0.8em;color:#888;margin-top:0.2rem;">保存日時: ${date}</div>
                                    <div style="font-size:0.8em;color:#888;">${deck.totalCost}</div>
                                </div>
                                <div>
                                    <button onclick="applyDeck('${deck.name}')" style="padding:0.3rem 0.8rem;background:#2196f3;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-right:0.3rem;font-size:0.8em;">適用</button>
                                    <button onclick="deleteDeck('${deck.name}')" style="padding:0.3rem 0.8rem;background:#f44336;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.8em;">削除</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            deckList.innerHTML = html;
            savedDecksDiv.style.display = 'block';
            
            // デッキリストを開いた状態にする
            setTimeout(() => {
                openDeckList();
            }, 100);
        }

        // 保存済みデッキを適用
        function applyDeck(deckName) {
            const savedDecks = JSON.parse(localStorage.getItem('gundamDecks') || '{}');
            const deck = savedDecks[deckName];

            if (!deck) {
                alert('デッキが見つかりません');
                return;
            }

            deck.cards.forEach(cardInfo => {
                const card = allCards.find(c => c.number === cardInfo.number);
                if (card) {
                    const select = document.getElementById(`card-select-${cardInfo.index}`);
                    const cardIndex = allCards.indexOf(card);
                    select.value = cardIndex;
                    select.dispatchEvent(new Event('change'));
                }
            });

            // 適用したデッキをクッキーにも保存（最新のデッキとして）
            setCookie('gundamLastSavedDeck', deck, 30);

            closeDeckList();
            alert(`デッキ「${deckName}」を適用しました（クッキーにも保存されました）`);
        }

        // 保存済みデッキを削除
        function deleteDeck(deckName) {
            if (!confirm(`デッキ「${deckName}」を削除しますか？`)) {
                return;
            }

            const savedDecks = JSON.parse(localStorage.getItem('gundamDecks') || '{}');
            delete savedDecks[deckName];
            localStorage.setItem('gundamDecks', JSON.stringify(savedDecks));

            showSavedDecks();
            alert(`デッキ「${deckName}」を削除しました`);
        }

        // クッキーからデッキを適用
        function applyCookieDeck() {
            const cookieDeck = getCookie('gundamLastSavedDeck');
            if (!cookieDeck || !cookieDeck.cards) {
                alert('クッキーに保存されたデッキが見つかりません');
                return;
            }

            applySavedDeck(cookieDeck);
            closeDeckList();
            alert('クッキーからデッキを適用しました');
        }

        // 自動保存デッキを適用
        function applyAutoSavedDeck() {
            const autoSavedDeck = getCookie('gundamAutoSave');
            if (!autoSavedDeck || !autoSavedDeck.cards) {
                alert('自動保存されたデッキが見つかりません');
                return;
            }

            applySavedDeck(autoSavedDeck);
            closeDeckList();
            alert('自動保存デッキを適用しました');
        }

        // 自動保存の有効/無効を切り替える関数
        function toggleAutoSave() {
            autoSaveEnabled = document.getElementById('autoSaveToggle').checked;
            if (autoSaveEnabled) {
                autoSaveDeck();
            }
        }

        // デッキリストを折り畳む
        function toggleDeckList() {
            const deckListContent = document.getElementById('deckListContent');
            const toggleBtn = document.getElementById('toggleDeckListBtn');
            
            if (deckListContent.style.maxHeight === '500px') {
                deckListContent.style.maxHeight = '0px';
                toggleBtn.textContent = '▼ 開く';
            } else {
                deckListContent.style.maxHeight = '500px';
                toggleBtn.textContent = '▼ 折り畳む';
            }
        }

        // デッキリストを閉じる
        function closeDeckList() {
            const deckListContent = document.getElementById('deckListContent');
            const toggleBtn = document.getElementById('toggleDeckListBtn');
            deckListContent.style.maxHeight = '0px';
            toggleBtn.textContent = '▼ 開く';
        }

        // デッキリストを開いた状態にする
        function openDeckList() {
            const deckListContent = document.getElementById('deckListContent');
            const toggleBtn = document.getElementById('toggleDeckListBtn');
            deckListContent.style.maxHeight = '500px';
            toggleBtn.textContent = '▼ 折り畳む';
        }

        function adjustParamGroupHeightsByContent() {
            // 各param-groupごとに最大高さを計算
            const groupTypes = ['skill', 'spattack', 'link'];
            groupTypes.forEach(type => {
                let maxHeight = 0;
                document.querySelectorAll(`.param-group.${type}`).forEach(el => {
                    const dummy = el.cloneNode(true);
                    dummy.style.visibility = 'hidden';
                    dummy.style.position = 'absolute';
                    dummy.style.height = 'auto';
                    dummy.style.width = el.offsetWidth + 'px';
                    document.body.appendChild(dummy);
                    maxHeight = Math.max(maxHeight, dummy.offsetHeight);
                    document.body.removeChild(dummy);
                });
                document.querySelectorAll(`.param-group.${type}`).forEach(el => {
                    el.style.height = maxHeight + 'px';
                });
            });
        }
        // 既存のadjustParamGroupHeightsの呼び出し箇所をadjustParamGroupHeightsByContentに置き換え
        // 例: setTimeout(adjustParamGroupHeights, 500); → setTimeout(adjustParamGroupHeightsByContent, 500);
        // カード切り替え時も同様に置き換え
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(adjustParamGroupHeightsByContent, 500); // レンダリング後に実行
        });
        window.adjustParamGroupHeightsByContent = adjustParamGroupHeightsByContent;

        // デッキ投稿モーダルの開閉
        const openDeckPostModalBtn = document.getElementById('openDeckPostModal');
        const deckPostModal = document.getElementById('deckPostModal');
        const closeDeckPostModalBtn = document.getElementById('closeDeckPostModal');
        if (openDeckPostModalBtn && deckPostModal && closeDeckPostModalBtn) {
            openDeckPostModalBtn.onclick = () => { deckPostModal.style.display = 'flex'; };
            closeDeckPostModalBtn.onclick = () => { deckPostModal.style.display = 'none'; document.getElementById('deckPostMsg').textContent = ''; };
        }
        // 投稿処理
        const submitDeckPostBtn = document.getElementById('submitDeckPost');
        if (submitDeckPostBtn) {
            submitDeckPostBtn.onclick = async function() {
                const deckName = document.getElementById('postDeckName').value.trim();
                const comment = document.getElementById('postDeckComment').value.trim();
                if (!deckName) {
                    document.getElementById('deckPostMsg').textContent = 'デッキ名を入力してください';
                    return;
                }
                // 現在のデッキ構成を取得
                const cards = selectedCardNumbers.map((num, idx) => ({ number: num, ocr: selectedOcrData[idx] }));
                const payload = {
                    deck_name: deckName,
                    comment: comment,
                    cards: cards,
                    timestamp: new Date().toISOString()
                };
                try {
                    const res = await fetch('/post_deck', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.success) {
                        document.getElementById('deckPostMsg').style.color = '#4caf50';
                        document.getElementById('deckPostMsg').textContent = 'デッキを投稿しました！';
                        setTimeout(() => { deckPostModal.style.display = 'none'; document.getElementById('deckPostMsg').textContent = ''; }, 1200);
                    } else {
                        document.getElementById('deckPostMsg').style.color = '#ff5252';
                        document.getElementById('deckPostMsg').textContent = data.error || '投稿に失敗しました';
                    }
                } catch (e) {
                    document.getElementById('deckPostMsg').style.color = '#ff5252';
                    document.getElementById('deckPostMsg').textContent = 'サーバーエラー';
                }
            };
        }
    </script>
