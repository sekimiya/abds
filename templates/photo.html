<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ガンダムアーセナルベース デッキ撮影</title>
    <style>
        body { 
            background: #fff;
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
        }
        .header {
            color: #333;
            text-align: center;
            padding: 1rem;
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 16px;
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
        }
        .card-item {
            text-align: center;
        }
        .card-item img {
            max-width: 160px;
            max-height: 240px;
            height: auto;
            border-radius: 4px;
        }
        .back-link {
            text-align: center;
            margin: 2rem 0;
        }
        .back-link a {
            color: #1a472a;
            text-decoration: none;
            font-size: 1.1em;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">デッキ撮影モード</div>
    <div id="cardGrid" class="card-grid"></div>
    <div class="back-link">
        <a href="/">← デッキビルダーに戻る</a>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/fetch_cards')
                .then(res => res.json())
                .then(data => {
                    if (!data.success) {
                        document.getElementById('cardGrid').innerText = 'カードデータの取得に失敗しました';
                        return;
                    }
                    const cardGrid = document.getElementById('cardGrid');
                    cardGrid.innerHTML = '';
                    for (let i = 0; i < Math.min(10, data.images.length); i++) {
                        const card = data.images[i];
                        const div = document.createElement('div');
                        div.className = 'card-item';
                        const img = document.createElement('img');
                        img.src = card.url;
                        img.alt = card.name;
                        div.appendChild(img);
                        cardGrid.appendChild(div);
                    }
                });
        });
    </script>
</body>
</html>
