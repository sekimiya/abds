<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABD Simulator - パラメータ補正設定</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f0f0f">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-text-size-adjust:100%}
body{background:#0f0f0f;color:#e0e0e0;font-family:'Segoe UI','Hiragino Sans',sans-serif;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.light{background:#f5f5f5;color:#1a1a1a}
body.light .page-header{background:linear-gradient(135deg,#d0e8dc,#d0e8dc)}
body.light .section-card{background:#fff;border-color:#ddd}
body.light .corr-row{border-bottom-color:#eee}
body.light .corr-row:hover{background:#f0f0f0}
body.light .corr-input{background:#f5f5f5;border-color:#ccc;color:#333}
body.light .tab-btn{background:#e8e8e8;color:#333;border-color:#ccc}
body.light .tab-btn.active{background:#68efbd;color:#000}
body.light .search-input{background:#fff;border-color:#ccc;color:#333}
body.light .back-btn{color:#333;border-color:#aaa}
a{color:#68efbd;text-decoration:none}
button{cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}

.page-header{
  background:linear-gradient(135deg,#1a2a20,#0f1f18);
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid #333;position:sticky;top:0;z-index:10;
}
.back-btn{
  background:none;border:1px solid #555;color:#e0e0e0;border-radius:6px;
  padding:6px 12px;font-size:0.9rem;white-space:nowrap;
}
.page-title{font-size:1.1rem;font-weight:700;color:#68efbd;flex:1}

.tab-bar{
  display:flex;gap:0;padding:8px 12px;position:sticky;top:47px;z-index:9;
  background:#0f0f0f;border-bottom:1px solid #222;
}
body.light .tab-bar{background:#f5f5f5;border-bottom-color:#ddd}
.tab-btn{
  flex:1;padding:8px 0;text-align:center;font-size:0.85rem;font-weight:600;
  border:1px solid #444;background:#1a1a1a;color:#aaa;cursor:pointer;
  transition:all 0.2s;
}
.tab-btn:first-child{border-radius:6px 0 0 6px}
.tab-btn:last-child{border-radius:0 6px 6px 0}
.tab-btn.active{background:#68efbd;color:#000;border-color:#68efbd}

.tab-content{display:none;padding:8px 12px 80px}
.tab-content.active{display:block}

.section-card{
  background:#1a1a1a;border:1px solid #333;border-radius:8px;
  margin-bottom:12px;overflow:hidden;
}
.section-header{
  padding:10px 12px;font-size:0.9rem;font-weight:700;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;
}
.section-header .toggle-icon{transition:transform 0.2s;font-size:0.7rem;color:#888}
.section-header .toggle-icon.open{transform:rotate(90deg)}
.section-body{padding:0 8px 8px;display:none}
.section-body.open{display:block}

.search-bar{padding:8px 12px;position:sticky;top:87px;z-index:8;background:#0f0f0f}
body.light .search-bar{background:#f5f5f5}
.search-input{
  width:100%;padding:8px 12px;border-radius:6px;border:1px solid #444;
  background:#1a1a1a;color:#e0e0e0;font-size:0.9rem;outline:none;
}
.search-input:focus{border-color:#68efbd}
.search-input::placeholder{color:#666}

.corr-row{
  display:flex;align-items:center;padding:6px 8px;gap:6px;
  border-bottom:1px solid #2a2a2a;font-size:0.82rem;
}
.corr-row:last-child{border-bottom:none}
.corr-row:hover{background:#222}
.corr-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.corr-name .card-num{color:#888;font-size:0.75rem;margin-right:4px}
.corr-count{color:#888;font-size:0.75rem;min-width:30px;text-align:right}

.corr-params{display:flex;gap:3px;align-items:center}
.corr-input{
  width:42px;padding:3px 2px;text-align:center;border-radius:4px;
  border:1px solid #444;background:#222;color:#e0e0e0;font-size:0.8rem;
}
.corr-input:focus{border-color:#68efbd;outline:none}
.corr-input.positive{color:#a5d6a7;border-color:#4caf50}
.corr-input.negative{color:#ff8a80;border-color:#f44336}
.param-label{font-size:0.65rem;color:#888;text-align:center;min-width:42px}

.param-headers{
  display:flex;gap:3px;padding:4px 8px;justify-content:flex-end;
}
.param-headers span{
  width:42px;text-align:center;font-size:0.65rem;color:#68efbd;font-weight:600;
}

.action-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:#1a1a1a;border-top:1px solid #333;
  padding:8px 12px env(safe-area-inset-bottom);
  display:flex;gap:8px;z-index:20;
}
body.light .action-bar{background:#fff;border-top-color:#ddd}
.action-btn{
  flex:1;padding:10px;border-radius:6px;font-size:0.9rem;font-weight:600;
  border:none;cursor:pointer;
}
.action-btn.primary{background:#68efbd;color:#000}
.action-btn.secondary{background:none;border:1px solid #555;color:#e0e0e0}
body.light .action-btn.secondary{border-color:#aaa;color:#333}
.action-btn.danger{background:none;border:1px solid #f44336;color:#f44336}

.info-banner{
  margin:8px 12px;padding:10px 12px;border-radius:6px;
  background:#1a2a20;border:1px solid #2a4a35;font-size:0.8rem;line-height:1.5;color:#a5d6a7;
}
body.light .info-banner{background:#e8f5e9;border-color:#c8e6c9;color:#2e7d32}

.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.preset-btn{
  padding:4px 10px;border-radius:4px;font-size:0.75rem;
  border:1px solid #444;background:#222;color:#ccc;cursor:pointer;
}
.preset-btn:hover{border-color:#68efbd;color:#68efbd}
body.light .preset-btn{background:#f0f0f0;border-color:#ccc;color:#333}

.corr-summary{
  font-size:0.75rem;color:#888;padding:4px 12px;text-align:right;
}
</style>
</head>
<body>

<div class="page-header">
  <button class="back-btn" onclick="goBack()">&#8592; 戻る</button>
  <div class="page-title">パラメータ補正設定</div>
</div>

<div class="tab-bar">
  <div class="tab-btn active" data-tab="work" onclick="switchTab(this)">作品レベル補正</div>
  <div class="tab-btn" data-tab="card" onclick="switchTab(this)">カード個別補正</div>
</div>

<!-- ===== WORK LEVEL TAB ===== -->
<div class="tab-content active" id="tab-work">
  <div class="info-banner">
    作品（リンクアビリティの作品名）ごとのレベル補正を設定します。<br>
    設定値はその作品のユニットのパラメータに加算されます。
  </div>
  <div class="preset-row" style="padding:8px 0 0">
    <button class="preset-btn" onclick="applyWorkPreset('reset')">全リセット</button>
    <button class="preset-btn" onclick="applyWorkPreset('sample')">サンプル値を適用</button>
  </div>
  <div class="param-headers" id="workParamHeaders">
    <span>機動</span><span>近距離</span><span>遠距離</span><span>HP</span>
  </div>
  <div class="corr-summary" id="workSummary">補正あり: 0作品</div>
  <div id="workList"></div>
</div>

<!-- ===== CARD INDIVIDUAL TAB ===== -->
<div class="tab-content" id="tab-card">
  <div class="info-banner">
    個別カードのパラメータ補正を設定します。<br>
    開発者のバランス調整（ナーフ/バフ）を反映できます。
  </div>
  <div class="search-bar" style="padding:8px 0">
    <input class="search-input" id="cardSearch" placeholder="カード名 or 番号で検索..." oninput="filterCards()">
  </div>
  <div class="preset-row">
    <button class="preset-btn" onclick="applyCardPreset('reset')">全リセット</button>
  </div>
  <div class="param-headers" id="cardParamHeaders">
    <span>機動</span><span>近距離</span><span>遠距離</span><span>HP</span>
  </div>
  <div class="corr-summary" id="cardSummary">補正あり: 0枚</div>
  <div id="cardList"></div>
</div>

<!-- ===== ACTION BAR ===== -->
<div class="action-bar">
  <button class="action-btn secondary" onclick="goBack()">キャンセル</button>
  <button class="action-btn primary" onclick="saveCorrections()">保存して戻る</button>
</div>

<script>
// ================================================================
// Data & State
// ================================================================
const STORAGE_KEY_WORK = 'abds_workCorrections';
const STORAGE_KEY_CARD = 'abds_cardCorrections';
const PARAMS = ['mobility', 'melee', 'ranged', 'hp'];
const PARAM_LABELS = { mobility: '機動', melee: '近距離', ranged: '遠距離', hp: 'HP' };

let cardIndex = [];
let workCorrections = {};  // { workName: { mobility:0, melee:0, ranged:0, hp:0 } }
let cardCorrections = {};  // { cardNumber: { mobility:0, melee:0, ranged:0, hp:0 } }
let workList = [];         // [{ name, count }]

// ================================================================
// Init
// ================================================================
async function init() {
  // Light mode
  if (localStorage.getItem('abds_lightMode') === '1') {
    document.body.classList.add('light');
  }

  // Load card index
  try {
    const res = await fetch('./data/card_index.json');
    cardIndex = await res.json();
  } catch (e) {
    console.error('Failed to load card_index:', e);
  }

  // Load card details for work names
  try {
    const res = await fetch('./data/card_details.json');
    const details = await res.json();
    const workMap = {};
    for (const [cid, d] of Object.entries(details)) {
      const las = d.ocr_data?.link_abilities || [];
      for (const la of las) {
        const name = la.name || '';
        if (!name) continue;
        // Only count link abilities that look like work/series names (not card-specific ones)
        if (name.startsWith('[') || name.includes('の系譜') || name.includes('ファイター') ||
            name.includes('マイスター') || name.includes('を奪い') || name.includes('を超えた')) continue;
        if (!workMap[name]) workMap[name] = new Set();
        workMap[name].add(cid);
      }
    }
    // Convert to list, filter to meaningful works (3+ cards)
    workList = Object.entries(workMap)
      .map(([name, cards]) => ({ name, count: cards.size }))
      .filter(w => w.count >= 3)
      .sort((a, b) => b.count - a.count);
  } catch (e) {
    console.error('Failed to load card_details:', e);
    // Fallback: use series from card_index
  }

  // Load saved corrections
  try {
    workCorrections = JSON.parse(localStorage.getItem(STORAGE_KEY_WORK) || '{}');
  } catch (e) { workCorrections = {}; }
  try {
    cardCorrections = JSON.parse(localStorage.getItem(STORAGE_KEY_CARD) || '{}');
  } catch (e) { cardCorrections = {}; }

  renderWorkList();
  renderCardList();
}

// ================================================================
// Tab switching
// ================================================================
function switchTab(btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
}

// ================================================================
// Work Level Corrections
// ================================================================
function renderWorkList() {
  const container = document.getElementById('workList');
  let html = '';
  for (const w of workList) {
    const corr = workCorrections[w.name] || {};
    html += `<div class="corr-row" data-work="${escHtml(w.name)}">
      <div class="corr-name">${escHtml(w.name)}</div>
      <div class="corr-count">${w.count}枚</div>
      <div class="corr-params">
        ${PARAMS.map(p => `<input class="corr-input" type="number" data-work="${escHtml(w.name)}" data-param="${p}" value="${corr[p] || 0}" onchange="onWorkChange(this)" onfocus="this.select()">`).join('')}
      </div>
    </div>`;
  }
  container.innerHTML = html;
  updateWorkSummary();
}

function onWorkChange(input) {
  const work = input.dataset.work;
  const param = input.dataset.param;
  const val = parseInt(input.value) || 0;
  if (!workCorrections[work]) workCorrections[work] = {};
  workCorrections[work][param] = val;

  // Clean up zero entries
  if (Object.values(workCorrections[work]).every(v => !v)) {
    delete workCorrections[work];
  }

  // Visual feedback
  input.classList.remove('positive', 'negative');
  if (val > 0) input.classList.add('positive');
  else if (val < 0) input.classList.add('negative');

  updateWorkSummary();
}

function updateWorkSummary() {
  const count = Object.keys(workCorrections).length;
  document.getElementById('workSummary').textContent = `補正あり: ${count}作品`;

  // Also update input styling on load
  document.querySelectorAll('#workList .corr-input').forEach(inp => {
    const v = parseInt(inp.value) || 0;
    inp.classList.remove('positive', 'negative');
    if (v > 0) inp.classList.add('positive');
    else if (v < 0) inp.classList.add('negative');
  });
}

function applyWorkPreset(type) {
  if (type === 'reset') {
    workCorrections = {};
    renderWorkList();
  } else if (type === 'sample') {
    // Example: popular works get slight nerf, underused get buff
    const popular = ['ガンダムSEED', '鉄血のオルフェンズ', '機動戦士ガンダム'];
    const underused = ['∀ガンダム', 'Gのレコンギスタ', '機動戦士Vガンダム', 'ポケットの中の戦争'];
    for (const w of popular) {
      workCorrections[w] = { mobility: -10, melee: -10, ranged: -10, hp: -20 };
    }
    for (const w of underused) {
      workCorrections[w] = { mobility: 10, melee: 15, ranged: 15, hp: 30 };
    }
    renderWorkList();
  }
}

// ================================================================
// Card Individual Corrections
// ================================================================
let cardFilterText = '';
const CARD_PAGE_SIZE = 50;
let cardPage = 0;

function renderCardList() {
  const container = document.getElementById('cardList');
  const msCards = cardIndex.filter(c => c.type === 'MS');
  const filtered = cardFilterText
    ? msCards.filter(c =>
        c.name.toLowerCase().includes(cardFilterText) ||
        c.number.toLowerCase().includes(cardFilterText))
    : msCards;

  const page = filtered.slice(0, (cardPage + 1) * CARD_PAGE_SIZE);
  let html = '';
  for (const c of page) {
    const corr = cardCorrections[c.number] || {};
    html += `<div class="corr-row" data-card="${escHtml(c.number)}">
      <div class="corr-name"><span class="card-num">${escHtml(c.number)}</span>${escHtml(c.name)}</div>
      <div class="corr-params">
        ${PARAMS.map(p => `<input class="corr-input" type="number" data-card="${escHtml(c.number)}" data-param="${p}" value="${corr[p] || 0}" onchange="onCardChange(this)" onfocus="this.select()">`).join('')}
      </div>
    </div>`;
  }

  if (page.length < filtered.length) {
    html += `<div style="text-align:center;padding:12px">
      <button class="preset-btn" onclick="cardPage++;renderCardList()" style="padding:8px 24px;font-size:0.85rem">
        さらに表示 (${filtered.length - page.length}枚)
      </button>
    </div>`;
  }

  container.innerHTML = html;
  updateCardSummary();

  // Apply input styling
  container.querySelectorAll('.corr-input').forEach(inp => {
    const v = parseInt(inp.value) || 0;
    inp.classList.remove('positive', 'negative');
    if (v > 0) inp.classList.add('positive');
    else if (v < 0) inp.classList.add('negative');
  });
}

function onCardChange(input) {
  const card = input.dataset.card;
  const param = input.dataset.param;
  const val = parseInt(input.value) || 0;
  if (!cardCorrections[card]) cardCorrections[card] = {};
  cardCorrections[card][param] = val;

  if (Object.values(cardCorrections[card]).every(v => !v)) {
    delete cardCorrections[card];
  }

  input.classList.remove('positive', 'negative');
  if (val > 0) input.classList.add('positive');
  else if (val < 0) input.classList.add('negative');

  updateCardSummary();
}

function updateCardSummary() {
  const count = Object.keys(cardCorrections).length;
  document.getElementById('cardSummary').textContent = `補正あり: ${count}枚`;
}

function filterCards() {
  cardFilterText = document.getElementById('cardSearch').value.toLowerCase().trim();
  cardPage = 0;
  renderCardList();
}

function applyCardPreset(type) {
  if (type === 'reset') {
    cardCorrections = {};
    renderCardList();
  }
}

// ================================================================
// Save & Navigation
// ================================================================
function saveCorrections() {
  localStorage.setItem(STORAGE_KEY_WORK, JSON.stringify(workCorrections));
  localStorage.setItem(STORAGE_KEY_CARD, JSON.stringify(cardCorrections));
  goBack();
}

function goBack() {
  // Save before leaving
  localStorage.setItem(STORAGE_KEY_WORK, JSON.stringify(workCorrections));
  localStorage.setItem(STORAGE_KEY_CARD, JSON.stringify(cardCorrections));

  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                   localStorage.getItem('abds_viewMode') === 'mobile';
  window.location.href = isMobile ? './mobile.html' : './index.html';
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ================================================================
// Start
// ================================================================
init();
</script>
</body>
</html>
