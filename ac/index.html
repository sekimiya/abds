<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ACD Simulator</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;height:100%;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:var(--bg);color:#e0e0e0;font-family:'Segoe UI','Hiragino Sans',sans-serif;height:100%;overflow:hidden;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;pointer-events:auto}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
select,input{font-family:inherit}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:var(--bg-card)}
::-webkit-scrollbar-thumb{background:#444;border-radius:2px}

:root{
  --bg:#0a0a0f;--bg2:#101018;--bg-card:#1a1a25;
  --accent:#64b5f6;--gold:#ffe082;
  --red:#ef5350;--blue:#42a5f5;--green:#66bb6a;
  --red-bg:rgba(239,83,80,0.15);--blue-bg:rgba(66,165,245,0.15);--green-bg:rgba(102,187,106,0.15);
  --red-border:rgba(239,83,80,0.5);--blue-border:rgba(66,165,245,0.5);--green-border:rgba(102,187,106,0.5);
  --senmetsu:#ff8a80;--seiatsu:#82b1ff;--bouei:#a5d6a7;
}

/* ===== HEADER (AB style) ===== */
.app-header{
  display:flex;align-items:center;
  background:linear-gradient(135deg,#0f1520,#141828);
  border-bottom:2px solid var(--accent);
  padding:0 6px;min-height:36px;flex-shrink:0;gap:0;
}
.hdr-cost{
  display:flex;flex-direction:column;align-items:center;
  padding:2px 6px;
  background:linear-gradient(135deg,rgba(255,224,130,0.08),rgba(255,183,77,0.04));
  border:1px solid rgba(255,224,130,0.2);border-radius:4px;
}
.hdr-cost-label{font-size:0.45rem;color:#999;letter-spacing:1px;font-weight:600}
.hdr-cost-val{font-family:'Courier New',monospace;font-size:1.1rem;font-weight:900;
  background:linear-gradient(180deg,#ffe082,#ffb74d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1.1;
}
.hdr-sep{width:1px;height:20px;background:#333;margin:0 4px;flex-shrink:0}
.hdr-class{font-size:0.65rem;font-weight:bold;padding:1px 4px;border-radius:3px;margin-right:2px;white-space:nowrap}
.hdr-class.s{background:#8b1a1a;color:var(--senmetsu)}
.hdr-class.c{background:#1a4a8b;color:var(--seiatsu)}
.hdr-class.b{background:#1a6b1a;color:var(--bouei)}
.hdr-spacer{flex:1}
.hamburger-btn{
  background:#1a1a2a;border:1px solid #444;border-radius:4px;
  color:#ccc;padding:2px 6px;font-size:0.9rem;line-height:1;flex-shrink:0;
}

/* ===== COLOR BUFF BAR ===== */
.color-buff-bar{
  display:flex;align-items:center;gap:4px;
  background:#0c0c14;border-bottom:1px solid #222;
  padding:3px 6px;min-height:0;flex-shrink:0;
}
.color-buff-bar:empty{display:none}
.color-buff-chip{
  display:inline-flex;align-items:center;gap:3px;
  padding:1px 6px;border-radius:8px;font-size:0.6rem;font-weight:bold;
  border:1px solid #333;color:#555;transition:all 0.2s;
}
.color-buff-chip.active.c-red{border-color:var(--red-border);color:var(--red);background:var(--red-bg)}
.color-buff-chip.active.c-blue{border-color:var(--blue-border);color:var(--blue);background:var(--blue-bg)}
.color-buff-chip.active.c-green{border-color:var(--green-border);color:var(--green);background:var(--green-bg)}
.color-buff-chip .buff-count{font-size:0.5rem;padding:0 3px;border-radius:4px;background:rgba(255,255,255,0.08)}

/* ===== MAIN CONTENT ===== */
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ===== OVERVIEW STRIP (AB style) ===== */
.overview-strip{
  flex-shrink:0;background:var(--bg2);border-bottom:1px solid #2a2a2a;
  padding:4px 4px 0;
}
.overview-cats{display:flex;gap:3px;margin-bottom:1px}
.ov-cat{flex:1;display:flex;align-items:center;font-size:0.55rem;font-weight:bold;border-radius:2px;padding:1px 2px;gap:2px}
.ov-cat .ov-cat-cost{
  font-size:0.55rem;color:var(--gold);font-weight:900;
  min-width:1.8em;text-align:center;
  background:rgba(0,0,0,0.3);border-radius:3px;padding:0 2px;
  font-variant-numeric:tabular-nums;
}
.ov-cat .ov-cat-label{flex:1;text-align:center}
.ov-cat.cat-s{background:#8b1a1a;color:var(--senmetsu)}
.ov-cat.cat-c{background:#1a4a8b;color:var(--seiatsu)}
.ov-cat.cat-b{background:#1a6b1a;color:var(--bouei)}

.overview-thumbs{display:flex;gap:3px;margin-bottom:2px}
.ov-thumb-col{flex:1;min-width:0;display:flex;flex-direction:column}
.ov-card-name{
  font-size:0.5rem;color:#bbb;text-align:center;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-height:0.5rem;padding:1px 1px;font-weight:600;
}
.overview-thumb{
  width:100%;aspect-ratio:63/88;background:var(--bg-card);border:2px solid #333;
  border-radius:4px;overflow:hidden;cursor:pointer;position:relative;
}
.overview-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.overview-thumb.empty{display:flex;align-items:center;justify-content:center;border-style:dashed}
.overview-thumb.empty::after{content:'+';color:#444;font-size:1.2rem}
.overview-thumb.selected{border-color:var(--accent);border-style:solid;box-shadow:0 0 4px rgba(100,181,246,0.3)}
.overview-thumb .ov-color-bar{
  position:absolute;top:0;left:0;right:0;height:3px;display:flex;z-index:2;
}
.ov-color-seg{flex:1}
.ov-color-seg.red{background:var(--red)}
.ov-color-seg.blue{background:var(--blue)}
.ov-color-seg.green{background:var(--green)}
.overview-thumb .ov-buff-star{
  position:absolute;bottom:2px;right:2px;
  width:12px;height:12px;border-radius:50%;
  background:rgba(255,215,0,0.9);color:#000;
  font-size:7px;font-weight:bold;line-height:12px;text-align:center;
  display:none;box-shadow:0 0 4px rgba(255,215,0,0.5);z-index:3;
}
.overview-thumb .ov-buff-star.active{display:block}
.overview-thumb .ov-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:2px;text-align:center;font-size:0.45rem;color:#777;
  word-break:break-all;line-height:1.2;
}

.overview-stats{display:flex;gap:3px;margin-bottom:2px}
.ov-stats{flex:1;min-width:0;text-align:center;font-size:0.5rem;color:#888}
.ov-stats.empty{opacity:0.25}
.ov-stat-val{font-weight:bold;font-variant-numeric:tabular-nums}
.ov-stat-val.atk{color:#ff8a80}
.ov-stat-val.hp{color:#80cbc4}
.ov-stat-val.buffed{text-shadow:0 0 4px rgba(255,215,0,0.5)}

.unit-tabs{display:flex;gap:2px;padding:0 2px 4px}
.unit-tab{
  flex:1;text-align:center;padding:3px 0;border-radius:3px;
  font-size:0.65rem;font-weight:bold;color:#666;background:#1a1a25;
  border:1px solid #333;cursor:pointer;min-height:22px;
}
.unit-tab.active{background:rgba(100,181,246,0.1);border-color:var(--accent);color:var(--accent)}

/* ===== DETAIL AREA ===== */
.detail-area{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;padding:8px;min-height:0;
}
.detail-header{
  display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;
}
.detail-unit-name{font-weight:bold;font-size:0.95rem;color:#e0e0e0}
.detail-unit-cat{font-size:0.7rem;font-weight:bold;padding:1px 6px;border-radius:3px}
.detail-unit-cat.cat-s{background:#8b1a1a;color:var(--senmetsu)}
.detail-unit-cat.cat-c{background:#1a4a8b;color:var(--seiatsu)}
.detail-unit-cat.cat-b{background:#1a6b1a;color:var(--bouei)}

.detail-cards{display:flex;gap:8px;margin-bottom:8px}
.detail-card-wrap{flex:1;min-width:0}
.detail-card-wrap .dc-label{font-size:0.6rem;color:#888;font-weight:bold;margin-bottom:2px}
.detail-card-wrap .dc-img{
  width:100%;aspect-ratio:63/88;background:var(--bg-card);border:1px solid #333;
  border-radius:4px;overflow:hidden;position:relative;
}
.detail-card-wrap .dc-img img{width:100%;height:100%;object-fit:cover;display:block}
.detail-card-wrap .dc-img .dc-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:0.7rem;color:#777;padding:8px;word-break:break-all;
}

.detail-stat-grid{
  display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:0;
  font-size:0.7rem;border:1px solid #2a2a2a;border-radius:6px;overflow:hidden;
  background:#111;margin-bottom:8px;
}
.detail-stat-grid .dsg-header{background:#1a1a25;color:#888;padding:3px 6px;font-weight:bold;text-align:center;border-bottom:1px solid #2a2a2a}
.detail-stat-grid .dsg-cell{padding:3px 6px;text-align:center;border-bottom:1px solid #1a1a25;font-variant-numeric:tabular-nums}
.detail-stat-grid .dsg-label{color:#888;text-align:left}
.detail-stat-grid .dsg-ms{color:var(--blue)}
.detail-stat-grid .dsg-pl{color:var(--gold)}
.detail-stat-grid .dsg-total{color:#e0e0e0;font-weight:bold}

.detail-color-info{
  display:flex;align-items:center;gap:6px;padding:6px;
  background:var(--bg-card);border:1px solid #333;border-radius:6px;margin-bottom:8px;
}
.detail-color-dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,0.3)}
.detail-color-dot.red{background:var(--red)}
.detail-color-dot.blue{background:var(--blue)}
.detail-color-dot.green{background:var(--green)}
.detail-color-label{font-size:0.75rem;font-weight:bold}
.detail-buff-status{font-size:0.7rem;margin-left:auto;font-weight:bold}
.detail-buff-status.on{color:var(--gold)}
.detail-buff-status.off{color:#555}

.detail-empty{color:#555;text-align:center;padding:2rem;font-size:0.8rem}

/* ===== CMD SECTION ===== */
.cmd-section{
  display:flex;align-items:center;gap:6px;
  padding:4px 6px;background:#0c0c14;border-bottom:1px solid #1a1a25;
  flex-shrink:0;
}
.cmd-label{font-size:0.55rem;color:#888;font-weight:bold;letter-spacing:1px}
.cmd-slot{
  width:40px;height:56px;
  background:var(--bg-card);border:1.5px solid #444;border-radius:4px;
  overflow:hidden;cursor:pointer;position:relative;flex-shrink:0;
}
.cmd-slot.empty{border-style:dashed;display:flex;align-items:center;justify-content:center}
.cmd-slot.empty::after{content:'+';color:#444;font-size:0.9rem}
.cmd-slot img{width:100%;height:100%;object-fit:cover;display:block}
.cmd-slot .cmd-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:0.35rem;color:#999;text-align:center;padding:2px;word-break:break-all;
}
.cmd-colors{display:flex;gap:3px;align-items:center}
.cmd-color-dot{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,0.3)}
.cmd-color-dot.red{background:var(--red)}
.cmd-color-dot.blue{background:var(--blue)}
.cmd-color-dot.green{background:var(--green)}
.cmd-name{font-size:0.65rem;color:#ccc;font-weight:bold;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-clear{background:transparent;border:none;color:#666;font-size:0.8rem;padding:0 4px;flex-shrink:0}
.cmd-clear:hover{color:var(--red)}

/* ===== CARD PICKER (AB style) ===== */
.picker-overlay{
  display:none;position:fixed;inset:0;
  background:var(--bg);z-index:100;
  flex-direction:column;
}
.picker-overlay.open{display:flex}
.picker-topbar{
  display:flex;align-items:center;gap:6px;
  padding:6px 8px;border-bottom:1px solid #333;background:var(--bg2);flex-shrink:0;
}
.picker-title{color:var(--accent);font-weight:bold;font-size:0.8rem}
.picker-tabs{display:flex;gap:4px}
.picker-tab{
  padding:3px 10px;border-radius:10px;font-size:0.7rem;font-weight:bold;
  background:var(--bg-card);border:1px solid #333;color:#888;cursor:pointer;
}
.picker-tab.active{background:rgba(100,181,246,0.15);border-color:var(--accent);color:var(--accent)}
.picker-close{margin-left:auto;background:transparent;border:none;color:#888;font-size:1.2rem;padding:2px 6px}
.picker-close:hover{color:var(--accent)}

.picker-toolbar{
  display:flex;align-items:center;gap:4px;padding:4px 8px;border-bottom:1px solid #222;flex-wrap:wrap;flex-shrink:0;
}
.picker-search-input{
  flex:1;min-width:100px;
  background:var(--bg-card);border:1px solid #333;border-radius:4px;
  color:#e0e0e0;padding:4px 6px;font-size:0.75rem;
}
.picker-search-input:focus{border-color:var(--accent);outline:none}
.picker-filter-btn{
  padding:2px 6px;border-radius:3px;font-size:0.65rem;font-weight:bold;
  background:var(--bg-card);border:1px solid #333;color:#888;cursor:pointer;
}
.picker-filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(100,181,246,0.1)}
.picker-filter-btn.c-red.active{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.picker-filter-btn.c-blue.active{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.picker-filter-btn.c-green.active{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.page-info{color:#888;font-size:0.7rem;margin-left:auto}

.picker-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.picker-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:3px;align-content:start;
  padding:4px;
}
.thumb-card{
  position:relative;cursor:pointer;border-radius:4px;overflow:hidden;
  border:2px solid transparent;transition:border-color 0.15s;
  background:var(--bg-card);
}
.thumb-card:active{border-color:var(--accent)}
.thumb-card.in-deck{opacity:0.35;border-color:#555}
.thumb-card-img-wrap{position:relative;width:100%;padding-top:139.68%;overflow:hidden;background:var(--bg-card)}
.thumb-card-img-wrap img{position:absolute;top:0;left:0;width:100%;height:100%;display:block;object-fit:contain}
.thumb-card-img-wrap .tc-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:0.5rem;color:#777;text-align:center;padding:4px;word-break:break-all;
}
.thumb-card-info{
  display:flex;align-items:center;gap:2px;padding:2px 3px;
  font-size:0.5rem;color:#bbb;background:rgba(0,0,0,0.4);
}
.thumb-card-info .tc-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.thumb-card-info .tc-cost{color:var(--gold);font-weight:bold}
.thumb-card-badges{position:absolute;top:1px;right:1px;display:flex;gap:2px;z-index:2;align-items:center}
.thumb-card-badges .tc-color-dot{width:6px;height:6px;border-radius:50%;border:1px solid rgba(255,255,255,0.4)}
.thumb-card-badges .tc-info-btn{
  width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,0.6);
  color:#ccc;font-size:9px;line-height:14px;text-align:center;cursor:pointer;
  border:1px solid rgba(255,255,255,0.3);
}
.thumb-card-badges .tc-info-btn:hover{background:var(--accent);color:#fff}
.thumb-card .tc-add-btn{
  position:absolute;bottom:1px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.7);border:1px solid #444;border-radius:3px;
  color:#ccc;font-size:0.55rem;padding:1px 6px;cursor:pointer;z-index:3;
  display:none;
}
.thumb-card:hover .tc-add-btn,.thumb-card:active .tc-add-btn{display:block}
.picker-empty{grid-column:1/-1;text-align:center;color:#555;padding:2rem;font-size:0.8rem}

/* ===== MENU ===== */
.menu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200}
.menu-overlay.open{display:block}
.menu-panel{
  position:fixed;right:0;top:0;bottom:0;width:280px;max-width:85vw;
  background:#12121a;border-left:2px solid var(--accent);
  padding:0.8rem;z-index:201;display:flex;flex-direction:column;gap:0.4rem;
  transform:translateX(100%);transition:transform 0.25s ease;overflow-y:auto;
}
.menu-panel.open{transform:translateX(0)}
.menu-close{align-self:flex-end;background:transparent;border:none;color:#888;font-size:1.2rem;cursor:pointer}
.menu-close:hover{color:var(--accent)}
.menu-title{color:var(--accent);font-size:0.8rem;font-weight:bold;margin-bottom:2px}
.menu-btn{
  background:var(--bg-card);border:1px solid #444;border-radius:4px;
  color:#ccc;padding:6px 8px;font-size:0.7rem;width:100%;text-align:left;
}
.menu-btn:hover{border-color:var(--accent);color:var(--accent)}
.menu-btn.danger{color:#ef5350}
.menu-btn.danger:hover{border-color:#ef5350;background:rgba(239,83,80,0.1)}
.menu-divider{height:1px;background:#333;margin:2px 0}
.menu-label{color:#666;font-size:0.6rem;margin-bottom:1px}
.deck-name-input{
  background:var(--bg-card);border:1px solid #333;border-radius:4px;
  color:#e0e0e0;padding:4px 6px;font-size:0.75rem;width:100%;
}
.deck-name-input:focus{border-color:var(--accent);outline:none}

.toast{
  position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
  background:#333;color:#e0e0e0;padding:6px 14px;border-radius:6px;
  font-size:0.75rem;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;
}
.toast.show{opacity:1}

/* ===== CARD DETAIL MODAL (from AB) ===== */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.85);z-index:500;
  align-items:center;justify-content:center;
  padding:16px;
}
.modal-overlay.open{display:flex}
.modal-content{
  background:var(--bg-card);border-radius:12px;
  width:100%;max-width:520px;max-height:90vh;overflow-y:auto;
  box-shadow:0 0 24px rgba(0,0,0,0.8);position:relative;
  padding:1rem;
}
.modal-close{
  position:absolute;top:6px;right:10px;background:none;border:none;
  color:#888;font-size:1.5rem;padding:4px;cursor:pointer;z-index:2;
}
.modal-close:hover{color:var(--accent)}
.modal-card-header{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.modal-card-image{
  width:120px;border-radius:6px;flex-shrink:0;
  background:var(--bg2);object-fit:contain;
}
.modal-card-info{flex:1;min-width:0}
.modal-card-number{color:var(--accent);font-weight:bold;font-size:0.9rem}
.modal-card-name{font-size:1.1rem;font-weight:bold;margin-top:2px;word-break:break-all}
.modal-card-meta{color:#888;font-size:0.75rem;margin-top:4px}
.modal-param-group{background:#111;border-radius:6px;padding:8px;margin-top:8px}
.modal-param-title{color:var(--accent);font-weight:bold;font-size:0.75rem;margin-bottom:4px}
.modal-param-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.modal-param-item{background:#1a1a25;border-radius:3px;padding:2px 6px;font-size:0.75rem}
.modal-param-label{color:var(--accent);margin-right:2px}
.rarity-tag{
  display:inline-flex;align-items:center;justify-content:center;
  padding:1px 5px;border-radius:3px;font-size:0.75rem;font-weight:bold;
  min-width:1.5rem;text-align:center;margin-left:4px;
}
.rarity-tag.rarity-M{background:#5e3a1a;color:#ffcc80}
.rarity-tag.rarity-C{background:#1a3a1a;color:#a5d6a7}
.rarity-tag.rarity-R{background:#1a1a5e;color:#90caf9}
.rarity-tag.rarity-N{background:#3a3a3a;color:#bdbdbd}
.rarity-tag.rarity-P{background:#1a5e5e;color:#80deea}
.rarity-tag.rarity-PR{background:#4a1a4a;color:#f48fb1}
</style>
</head>
<body>

<header class="app-header">
  <span class="hdr-cost"><span class="hdr-cost-label">TOTAL</span><span class="hdr-cost-val" id="totalCost">0</span></span>
  <span class="hdr-sep"></span>
  <span class="hdr-class s" id="badgeSenmetsu">殲0</span>
  <span class="hdr-class c" id="badgeSeiatsu">制0</span>
  <span class="hdr-class b" id="badgeBouei">防0</span>
  <span class="hdr-spacer"></span>
  <button class="hamburger-btn" id="hamburgerBtn">&#9776;</button>
</header>

<div class="cmd-section" id="cmdSection">
  <span class="cmd-label">CMD</span>
  <div class="cmd-slot empty" id="cmdSlot"></div>
  <div class="cmd-colors" id="cmdColors"></div>
  <span class="cmd-name" id="cmdName">未選択</span>
  <button class="cmd-clear" id="cmdClear" style="display:none">&times;</button>
</div>

<div class="color-buff-bar" id="colorBuffBar"></div>

<div class="main-content" id="mainContent">
  <div class="overview-strip" id="overviewStrip">
    <div class="overview-cats" id="catRow"></div>
    <div class="overview-thumbs" id="msRow"></div>
    <div class="overview-thumbs" id="plRow"></div>
    <div class="overview-stats" id="statsRow"></div>
    <div class="unit-tabs" id="unitTabs"></div>
  </div>
  <div class="detail-area" id="detailArea">
    <div class="detail-empty">ユニットを選択してください</div>
  </div>
</div>

<div class="picker-overlay" id="pickerOverlay">
  <div class="picker-topbar">
    <span class="picker-title" id="pickerTitle">カード選択</span>
    <div class="picker-tabs" id="pickerTabs">
      <button class="picker-tab" data-type="MS">MS</button>
      <button class="picker-tab" data-type="PL">PL</button>
    </div>
    <button class="picker-close" id="pickerClose">&times;</button>
  </div>
  <div class="picker-toolbar">
    <input type="text" class="picker-search-input" id="pickerSearch" placeholder="検索...">
    <button class="picker-filter-btn c-red" data-color="赤">赤</button>
    <button class="picker-filter-btn c-blue" data-color="青">青</button>
    <button class="picker-filter-btn c-green" data-color="緑">緑</button>
    <span class="page-info" id="pageInfo">-</span>
  </div>
  <div class="picker-scroll">
    <div class="picker-grid" id="pickerGrid"></div>
  </div>

<div class="menu-overlay" id="menuOverlay"></div>
<div class="menu-panel" id="menuPanel">
  <button class="menu-close" id="menuClose">&times;</button>
  <span class="menu-title">MENU</span>
  <label class="menu-label">デッキ名</label>
  <input type="text" class="deck-name-input" id="deckNameInput" placeholder="My Deck">
  <div class="menu-divider"></div>
  <button class="menu-btn" id="btnShare">デッキコードをコピー</button>
  <button class="menu-btn" id="btnLoad">デッキコードから読込</button>
  <div class="menu-divider"></div>
  <button class="menu-btn" id="btnSave">ローカルに保存</button>
  <button class="menu-btn" id="btnLoadLocal">保存デッキを読込</button>
  <div class="menu-divider"></div>
  <button class="menu-btn danger" id="btnClear">デッキをクリア</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="cardDetailModal" onclick="closeCardModal(event)">
  <div class="modal-content" id="cardDetailContent" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeCardModal()">&times;</button>
    <div id="cardDetailBody"></div>
  </div>
</div>

<script>
'use strict';

const COLOR_MAP = {
  '赤': { cls: 'red', css: 'var(--red)' },
  '青': { cls: 'blue', css: 'var(--blue)' },
  '緑': { cls: 'green', css: 'var(--green)' },
};

const AppState = {
  cardIndex: [],
  deck: Array(10).fill(null),
  deckName: '',
  cmdCard: null,
  selectedUnit: 0,
  pickerSlot: -1,
  pickerType: 'MS',
  pickerColorFilter: null,
  pickerSearch: '',
};

async function init() {
  await loadCardIndex();
  loadDeckFromHash();
  buildOverview();
  bindEvents();
  render();
}

async function loadCardIndex() {
  try {
    const res = await fetch('./data/card_index.json', { cache: 'no-store' });
    AppState.cardIndex = await res.json();
  } catch (e) { AppState.cardIndex = []; }
}

function findCard(num) {
  if (!num) return null;
  return AppState.cardIndex.find(c => c.number === num) || null;
}

function getCmdColors() {
  const cmd = findCard(AppState.cmdCard);
  return cmd ? (cmd.color || []) : [];
}

// ================================================================
// Build Overview (AB-style)
// ================================================================
function buildOverview() {
  const catRow = document.getElementById('catRow');
  const msRow = document.getElementById('msRow');
  const plRow = document.getElementById('plRow');
  const statsRow = document.getElementById('statsRow');
  const unitTabs = document.getElementById('unitTabs');
  for (let i = 0; i < 5; i++) {
    catRow.innerHTML += `<div class="ov-cat" id="ovCat${i}"><span class="ov-cat-cost" id="ovCatCost${i}">0</span><span class="ov-cat-label" id="ovCatLabel${i}">-</span></div>`;
    msRow.innerHTML += `<div class="ov-thumb-col"><div class="ov-card-name" id="ovMsName${i}">&nbsp;</div><div class="overview-thumb empty" id="ovMs${i}" data-slot="${i}"><div class="ov-color-bar"></div><div class="ov-buff-star">&#9733;</div></div></div>`;
    plRow.innerHTML += `<div class="ov-thumb-col"><div class="overview-thumb empty" id="ovPl${i}" data-slot="${i + 5}"><div class="ov-color-bar"></div><div class="ov-buff-star">&#9733;</div></div><div class="ov-card-name" id="ovPlName${i}">&nbsp;</div></div>`;
    statsRow.innerHTML += `<div class="ov-stats empty" id="ovStat${i}"><span class="ov-stat-val atk" id="ovAtk${i}">0</span> / <span class="ov-stat-val hp" id="ovHp${i}">0</span></div>`;
    unitTabs.innerHTML += `<div class="unit-tab${i === 0 ? ' active' : ''}" id="unitTab${i}" data-unit="${i}">U${i + 1}</div>`;
  }
}

// ================================================================
// Events
// ================================================================
function bindEvents() {
  document.getElementById('cmdSlot').addEventListener('click', () => openCmdPicker());
  document.getElementById('cmdClear').addEventListener('click', e => { e.stopPropagation(); AppState.cmdCard = null; saveDeckToHash(); render(); });

  for (let i = 0; i < 5; i++) {
    document.getElementById(`ovMs${i}`).addEventListener('click', () => { selectUnit(i); openPicker(i); });
    document.getElementById(`ovPl${i}`).addEventListener('click', () => { selectUnit(i); openPicker(i + 5); });
    document.getElementById(`unitTab${i}`).addEventListener('click', () => selectUnit(i));
  }

  document.getElementById('pickerClose').addEventListener('click', closePicker);
  document.querySelectorAll('.picker-tab').forEach(t => t.addEventListener('click', () => {
    AppState.pickerType = t.dataset.type;
    updatePickerTabs();
    renderPickerGrid();
  }));
  document.getElementById('pickerSearch').addEventListener('input', e => { AppState.pickerSearch = e.target.value.toLowerCase(); renderPickerGrid(); });
  document.querySelectorAll('.picker-filter-btn[data-color]').forEach(btn => {
    btn.addEventListener('click', () => {
      AppState.pickerColorFilter = AppState.pickerColorFilter === btn.dataset.color ? null : btn.dataset.color;
      updateColorFilterBtns();
      renderPickerGrid();
    });
  });

  document.getElementById('hamburgerBtn').addEventListener('click', openMenu);
  document.getElementById('menuClose').addEventListener('click', closeMenu);
  document.getElementById('menuOverlay').addEventListener('click', closeMenu);
  document.getElementById('btnShare').addEventListener('click', shareDeck);
  document.getElementById('btnLoad').addEventListener('click', loadDeckPrompt);
  document.getElementById('btnClear').addEventListener('click', clearDeck);
  document.getElementById('btnSave').addEventListener('click', saveDeckLocal);
  document.getElementById('btnLoadLocal').addEventListener('click', loadDeckLocal);
  document.getElementById('deckNameInput').addEventListener('input', e => { AppState.deckName = e.target.value; });
  window.addEventListener('hashchange', () => { loadDeckFromHash(); render(); });
}

function selectUnit(idx) {
  AppState.selectedUnit = idx;
  document.querySelectorAll('.unit-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.overview-thumb').forEach(t => t.classList.remove('selected'));
  document.getElementById(`ovMs${idx}`).classList.add('selected');
  document.getElementById(`ovPl${idx}`).classList.add('selected');
  renderDetail();
}

// ================================================================
// Card Picker
// ================================================================
function openCmdPicker() {
  AppState.pickerSlot = -1;
  AppState.pickerType = 'CMD';
  AppState.pickerSearch = '';
  AppState.pickerColorFilter = null;
  document.getElementById('pickerSearch').value = '';
  document.getElementById('pickerTitle').textContent = 'コマンダー選択';
  document.getElementById('pickerTabs').style.display = 'none';
  updateColorFilterBtns();
  renderPickerGrid();
  document.getElementById('pickerOverlay').classList.add('open');
}

function openPicker(slot) {
  AppState.pickerSlot = slot;
  AppState.pickerType = slot < 5 ? 'MS' : 'PL';
  AppState.pickerSearch = '';
  AppState.pickerColorFilter = null;
  document.getElementById('pickerSearch').value = '';
  document.getElementById('pickerTitle').textContent = `${AppState.pickerType}選択 (U${(slot % 5) + 1})`;
  document.getElementById('pickerTabs').style.display = 'flex';
  updatePickerTabs();
  updateColorFilterBtns();
  renderPickerGrid();
  document.getElementById('pickerOverlay').classList.add('open');
}

function closePicker() { document.getElementById('pickerOverlay').classList.remove('open'); }
function updatePickerTabs() { document.querySelectorAll('.picker-tab').forEach(t => t.classList.toggle('active', t.dataset.type === AppState.pickerType)); }
function updateColorFilterBtns() { document.querySelectorAll('.picker-filter-btn[data-color]').forEach(b => b.classList.toggle('active', AppState.pickerColorFilter === b.dataset.color)); }

function renderPickerGrid() {
  const grid = document.getElementById('pickerGrid');
  grid.innerHTML = '';
  const inDeck = new Set(AppState.deck.filter(Boolean));
  if (AppState.cmdCard) inDeck.add(AppState.cmdCard);

  let cards = AppState.cardIndex.filter(c => c.type === AppState.pickerType);
  if (AppState.pickerColorFilter) cards = cards.filter(c => c.color && c.color.includes(AppState.pickerColorFilter));
  if (AppState.pickerSearch) {
    const q = AppState.pickerSearch;
    cards = cards.filter(c => (c.search_text || '').includes(q) || (c.name || '').toLowerCase().includes(q) || (c.number || '').toLowerCase().includes(q));
  }
  document.getElementById('pageInfo').textContent = cards.length + '件';
  if (!cards.length) { grid.innerHTML = '<div class="picker-empty">該当カードなし</div>'; return; }

  const frag = document.createDocumentFragment();
  cards.forEach(card => {
    const el = document.createElement('div');
    el.className = 'thumb-card' + (inDeck.has(card.number) ? ' in-deck' : '');
    let colorDots = '';
    if (card.color) colorDots = card.color.map(c => COLOR_MAP[c] ? `<div class="tc-color-dot" style="background:${COLOR_MAP[c].css}"></div>` : '').join('');
    el.innerHTML = `<div class="thumb-card-img-wrap" onclick="showCardModal('${card.number}')" style="cursor:pointer"><img src="${card.front_url}" alt="${card.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="tc-fallback" style="display:none">${card.name}</div></div><div class="thumb-card-badges"><span class="tc-info-btn" onclick="event.stopPropagation();showCardModal('${card.number}')" title="詳細">&#9432;</span>${colorDots}</div><div class="thumb-card-info"><span class="tc-name">${card.name}</span>${card.cost ? `<span class="tc-cost">${card.cost}</span>` : ''}</div><button class="tc-add-btn" onclick="event.stopPropagation();pickCardByNumber('${card.number}')">追加</button>`;
    el.addEventListener('click', () => pickCard(card));
    frag.appendChild(el);
  });
  grid.appendChild(frag);
}

function pickCard(card) {
  if (AppState.pickerSlot === -1) {
    AppState.cmdCard = card.number;
  } else {
    AppState.deck[AppState.pickerSlot] = card.number;
  }
  closePicker();
  saveDeckToHash();
  render();
}

function pickCardByNumber(number) {
  const card = findCard(number);
  if (!card) return;
  pickCard(card);
}

// ================================================================
// Render
// ================================================================
function render() {
  renderCmd();
  renderOverview();
  renderStats();
  renderColorBuff();
  renderDetail();
  renderHeader();
}

function renderCmd() {
  const card = findCard(AppState.cmdCard);
  const slot = document.getElementById('cmdSlot');
  const colorsEl = document.getElementById('cmdColors');
  const nameEl = document.getElementById('cmdName');
  const clearEl = document.getElementById('cmdClear');
  slot.innerHTML = '';
  colorsEl.innerHTML = '';
  if (card) {
    slot.classList.remove('empty');
    const img = document.createElement('img');
    img.src = card.front_url;
    img.onerror = function() { this.style.display = 'none'; const fb = document.createElement('div'); fb.className = 'cmd-fallback'; fb.textContent = card.name; slot.appendChild(fb); };
    slot.appendChild(img);
    (card.color || []).forEach(c => {
      const dot = document.createElement('div');
      dot.className = 'cmd-color-dot ' + (COLOR_MAP[c] ? COLOR_MAP[c].cls : '');
      colorsEl.appendChild(dot);
    });
    nameEl.textContent = card.name;
    clearEl.style.display = '';
  } else {
    slot.classList.add('empty');
    nameEl.textContent = '未選択';
    clearEl.style.display = 'none';
  }
}

function renderOverview() {
  const cmdColors = getCmdColors();
  for (let i = 0; i < 5; i++) {
    const msCard = findCard(AppState.deck[i]);
    const plCard = findCard(AppState.deck[i + 5]);
    renderThumb(`ovMs${i}`, msCard, cmdColors);
    renderThumb(`ovPl${i}`, plCard, cmdColors);
    document.getElementById(`ovMsName${i}`).textContent = msCard ? msCard.name : '';
    document.getElementById(`ovPlName${i}`).textContent = plCard ? plCard.name : '';

    const cat = plCard ? plCard.category : (msCard ? msCard.category : null);
    const catEl = document.getElementById(`ovCat${i}`);
    const catLabel = document.getElementById(`ovCatLabel${i}`);
    const catCost = document.getElementById(`ovCatCost${i}`);
    catEl.className = 'ov-cat';
    if (cat === '殲滅') catEl.classList.add('cat-s');
    else if (cat === '制圧') catEl.classList.add('cat-c');
    else if (cat === '防衛') catEl.classList.add('cat-b');
    catLabel.textContent = cat || '-';
    catCost.textContent = (msCard ? msCard.cost || 0 : 0) + (plCard ? plCard.cost || 0 : 0);
  }
}

function renderThumb(id, card, cmdColors) {
  const el = document.getElementById(id);
  const colorBar = el.querySelector('.ov-color-bar');
  const buffStar = el.querySelector('.ov-buff-star');
  const oldImg = el.querySelector('img');
  if (oldImg) oldImg.remove();
  const oldFb = el.querySelector('.ov-fallback');
  if (oldFb) oldFb.remove();
  colorBar.innerHTML = '';

  if (card) {
    el.classList.remove('empty');
    const img = document.createElement('img');
    img.src = card.front_url;
    img.loading = 'lazy';
    img.onerror = function() { this.style.display = 'none'; const fb = document.createElement('div'); fb.className = 'ov-fallback'; fb.textContent = card.name; el.appendChild(fb); };
    el.insertBefore(img, colorBar);
    (card.color || []).forEach(c => {
      const seg = document.createElement('div');
      seg.className = 'ov-color-seg ' + (COLOR_MAP[c] ? COLOR_MAP[c].cls : '');
      colorBar.appendChild(seg);
    });
    const hasMatch = card.color && cmdColors.length > 0 && card.color.some(c => cmdColors.includes(c));
    buffStar.classList.toggle('active', !!hasMatch);
  } else {
    el.classList.add('empty');
    buffStar.classList.remove('active');
  }
}

function renderStats() {
  const cmdColors = getCmdColors();
  let totalCost = 0;
  for (let i = 0; i < 5; i++) {
    const ms = findCard(AppState.deck[i]);
    const pl = findCard(AppState.deck[i + 5]);
    const atk = (ms ? ms.atk || 0 : 0) + (pl ? pl.atk || 0 : 0);
    const hp = (ms ? ms.hp || 0 : 0) + (pl ? pl.hp || 0 : 0);
    if (ms) totalCost += ms.cost || 0;
    if (pl) totalCost += pl.cost || 0;

    const msMatch = ms && ms.color && ms.color.some(c => cmdColors.includes(c));
    const plMatch = pl && pl.color && pl.color.some(c => cmdColors.includes(c));
    const hasBuff = msMatch || plMatch;

    const statEl = document.getElementById(`ovStat${i}`);
    statEl.classList.toggle('empty', !ms && !pl);
    document.getElementById(`ovAtk${i}`).textContent = atk;
    document.getElementById(`ovAtk${i}`).classList.toggle('buffed', !!hasBuff);
    document.getElementById(`ovHp${i}`).textContent = hp;
    document.getElementById(`ovHp${i}`).classList.toggle('buffed', !!hasBuff);
  }
  document.getElementById('totalCost').textContent = totalCost;
}

function renderHeader() {
  let s = 0, c = 0, b = 0;
  for (let i = 0; i < 10; i++) {
    const card = findCard(AppState.deck[i]);
    if (!card) continue;
    const cat = card.category;
    if (cat === '殲滅') s++;
    else if (cat === '制圧') c++;
    else if (cat === '防衛') b++;
  }
  document.getElementById('badgeSenmetsu').textContent = '殲' + s;
  document.getElementById('badgeSeiatsu').textContent = '制' + c;
  document.getElementById('badgeBouei').textContent = '防' + b;
}

function renderColorBuff() {
  const bar = document.getElementById('colorBuffBar');
  bar.innerHTML = '';
  const cmdColors = getCmdColors();
  if (!cmdColors.length) return;
  const allUnits = AppState.deck.map(n => findCard(n)).filter(Boolean);
  cmdColors.forEach(color => {
    const cm = COLOR_MAP[color];
    if (!cm) return;
    const matchCount = allUnits.filter(c => c.color && c.color.includes(color)).length;
    const chip = document.createElement('div');
    chip.className = `color-buff-chip c-${cm.cls}` + (matchCount > 0 ? ' active' : '');
    chip.innerHTML = `<span>${color} BUFF</span><span class="buff-count">${matchCount}/${allUnits.length}</span>`;
    bar.appendChild(chip);
  });
}

function renderDetail() {
  const area = document.getElementById('detailArea');
  const i = AppState.selectedUnit;
  const ms = findCard(AppState.deck[i]);
  const pl = findCard(AppState.deck[i + 5]);
  if (!ms && !pl) { area.innerHTML = '<div class="detail-empty">ユニットを選択してください</div>'; return; }

  const cmdColors = getCmdColors();
  const atk = (ms ? ms.atk || 0 : 0) + (pl ? pl.atk || 0 : 0);
  const hp = (ms ? ms.hp || 0 : 0) + (pl ? pl.hp || 0 : 0);
  const cat = pl ? pl.category : (ms ? ms.category : '-');
  const catCls = cat === '殲滅' ? 'cat-s' : cat === '制圧' ? 'cat-c' : cat === '防衛' ? 'cat-b' : '';

  let colorInfo = '';
  [ms, pl].forEach(card => {
    if (!card || !card.color) return;
    card.color.forEach(c => {
      const cm = COLOR_MAP[c];
      if (!cm) return;
      const match = cmdColors.includes(c);
      colorInfo += `<div class="detail-color-info"><div class="detail-color-dot ${cm.cls}"></div><span class="detail-color-label">${c}</span><span class="detail-buff-status ${match ? 'on' : 'off'}">${match ? 'BUFF ON' : 'BUFF OFF'}</span></div>`;
    });
  });

  area.innerHTML = `
    <div class="detail-header">
      <span class="detail-unit-name">UNIT ${i + 1}</span>
      <span class="detail-unit-cat ${catCls}">${cat || '-'}</span>
    </div>
    <div class="detail-cards">
      <div class="detail-card-wrap">
        <div class="dc-label">MS</div>
        <div class="dc-img" id="dcMs" onclick="${ms ? `showCardModal('${ms.number}')` : ''}" style="${ms ? 'cursor:pointer' : ''}">${ms ? `<img src="${ms.front_url}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="dc-fallback" style="display:none">${ms.name}</div>` : ''}</div>
      </div>
      <div class="detail-card-wrap">
        <div class="dc-label">PL</div>
        <div class="dc-img" id="dcPl" onclick="${pl ? `showCardModal('${pl.number}')` : ''}" style="${pl ? 'cursor:pointer' : ''}">${pl ? `<img src="${pl.front_url}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="dc-fallback" style="display:none">${pl.name}</div>` : ''}</div>
      </div>
    </div>
    <div class="detail-stat-grid">
      <div class="dsg-header dsg-label"></div><div class="dsg-header dsg-ms">MS</div><div class="dsg-header dsg-pl">PL</div><div class="dsg-header dsg-total">合計</div>
      <div class="dsg-cell dsg-label">ATK</div><div class="dsg-cell dsg-ms">${ms ? ms.atk || 0 : '-'}</div><div class="dsg-cell dsg-pl">${pl ? pl.atk || 0 : '-'}</div><div class="dsg-cell dsg-total">${atk}</div>
      <div class="dsg-cell dsg-label">HP</div><div class="dsg-cell dsg-ms">${ms ? ms.hp || 0 : '-'}</div><div class="dsg-cell dsg-pl">${pl ? pl.hp || 0 : '-'}</div><div class="dsg-cell dsg-total">${hp}</div>
    </div>
    ${colorInfo}
  `;
}

// ================================================================
// Deck Code (URL hash) - AB compatible format
// ================================================================
function encodeDeck() {
  const parts = AppState.deck.map(n => n || '').join(',');
  let code = parts;
  if (AppState.cmdCard) code += '|cmd=' + AppState.cmdCard;
  if (AppState.deckName) code += '|name=' + encodeURIComponent(AppState.deckName);
  return code;
}

function decodeDeck(code) {
  const deck = Array(10).fill(null);
  let cmd = null, name = '';
  const sections = code.split('|');
  const cardPart = sections[0];
  cardPart.split(',').forEach((n, i) => { if (i < 10 && n) deck[i] = n; });
  sections.slice(1).forEach(s => {
    if (s.startsWith('cmd=')) cmd = s.slice(4);
    else if (s.startsWith('name=')) name = decodeURIComponent(s.slice(5));
  });
  return { deck, cmd, name };
}

function saveDeckToHash() {
  const hasContent = AppState.deck.some(Boolean) || AppState.cmdCard;
  if (hasContent) history.replaceState(null, '', '#' + encodeDeck());
  else history.replaceState(null, '', location.pathname);
}

function loadDeckFromHash() {
  const hash = location.hash.slice(1);
  if (!hash) return;
  const { deck, cmd, name } = decodeDeck(hash);
  AppState.deck = deck;
  AppState.cmdCard = cmd;
  AppState.deckName = name || '';
  document.getElementById('deckNameInput').value = AppState.deckName;
}

// ================================================================
// Card Detail Modal (AB-style)
// ================================================================
function escapeHtml(text) {
  if (text == null) return '';
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function closeCardModal(e) {
  if (e && e.target !== document.getElementById('cardDetailModal') && e.target !== document.querySelector('.modal-close')) return;
  document.getElementById('cardDetailModal').classList.remove('open');
}

function showCardModal(number) {
  const card = findCard(number);
  if (!card) return;
  const body = document.getElementById('cardDetailBody');
  const rarityHtml = card.rarity ? ` <span class="rarity-tag rarity-${escapeHtml(card.rarity)}">${escapeHtml(card.rarity)}</span>` : '';
  const colorHtml = (card.color || []).map(c => {
    const cm = COLOR_MAP[c];
    return `<span style="display:inline-flex;align-items:center;gap:2px;margin-right:6px"><span style="width:8px;height:8px;border-radius:50%;background:${cm ? cm.css : '#666'};border:1px solid rgba(255,255,255,0.3)"></span>${c}</span>`;
  }).join('') || '<span style="color:#666">無色</span>';

  let html = `<div class="modal-card-header">
    <img class="modal-card-image" src="${card.front_url}" alt="${escapeHtml(card.name)}" onerror="this.style.display='none'">
    <div class="modal-card-info">
      <div class="modal-card-number">${escapeHtml(card.number)}${rarityHtml}</div>
      <div class="modal-card-name">${escapeHtml(card.name)}</div>
      <div class="modal-card-meta">${escapeHtml(card.type || '')} ${card.category ? '| ' + escapeHtml(card.category) : ''} | コスト: ${card.cost != null ? card.cost : '-'}</div>
      <div class="modal-card-meta" style="margin-top:4px">${colorHtml}</div>
    </div>
  </div>`;

  if (card.type !== 'CMD' && (card.atk != null || card.hp != null)) {
    html += `<div class="modal-param-group"><div class="modal-param-title">ステータス</div>
      <div class="modal-param-row">
        ${card.atk != null ? `<div class="modal-param-item"><span class="modal-param-label">ATK:</span>${card.atk}</div>` : ''}
        ${card.hp != null ? `<div class="modal-param-item"><span class="modal-param-label">HP:</span>${card.hp}</div>` : ''}
      </div>
    </div>`;
  }

  if (card.skill) {
    html += `<div class="modal-param-group"><div class="modal-param-title">スキル</div>
      <div style="font-size:0.85rem;color:#ccc">${escapeHtml(card.skill)}</div>
    </div>`;
  }
  if (card.link_ability) {
    html += `<div class="modal-param-group"><div class="modal-param-title">リンクアビリティ</div>
      <div style="font-size:0.85rem;color:#ccc">${escapeHtml(card.link_ability)}</div>
    </div>`;
  }
  if (card.terrain_compatibility) {
    html += `<div class="modal-param-group"><div class="modal-param-title">地形適性</div>
      <div class="modal-param-row">${Object.entries(card.terrain_compatibility).map(([k, v]) => `<div class="modal-param-item"><span class="modal-param-label">${k}:</span>${v || '-'}</div>`).join('')}</div>
    </div>`;
  }

  body.innerHTML = html;
  document.getElementById('cardDetailModal').classList.add('open');
}

// ================================================================
// Menu
// ================================================================
function openMenu() { document.getElementById('menuOverlay').classList.add('open'); document.getElementById('menuPanel').classList.add('open'); }
function closeMenu() { document.getElementById('menuOverlay').classList.remove('open'); document.getElementById('menuPanel').classList.remove('open'); }

function shareDeck() {
  const url = location.href;
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => showToast('URLをコピーしました'));
  else prompt('URL:', url);
  closeMenu();
}
function loadDeckPrompt() {
  const input = prompt('デッキコード (URLまたはハッシュ):');
  if (!input) return;
  let code = input.includes('#') ? input.split('#')[1] : input;
  if (code) location.hash = code;
  closeMenu();
}
function clearDeck() {
  if (!confirm('デッキをクリアしますか?')) return;
  AppState.deck = Array(10).fill(null);
  AppState.cmdCard = null;
  AppState.deckName = '';
  document.getElementById('deckNameInput').value = '';
  saveDeckToHash();
  render();
  closeMenu();
  showToast('クリアしました');
}
function saveDeckLocal() {
  const name = AppState.deckName || prompt('デッキ名:');
  if (!name) return;
  AppState.deckName = name;
  document.getElementById('deckNameInput').value = name;
  const decks = JSON.parse(localStorage.getItem('acd_decks') || '{}');
  decks[name] = { deck: [...AppState.deck], cmd: AppState.cmdCard, ts: new Date().toISOString() };
  localStorage.setItem('acd_decks', JSON.stringify(decks));
  closeMenu();
  showToast('保存しました');
}
function loadDeckLocal() {
  const decks = JSON.parse(localStorage.getItem('acd_decks') || '{}');
  const names = Object.keys(decks);
  if (!names.length) { showToast('保存デッキがありません'); closeMenu(); return; }
  const name = prompt('読込するデッキ名:\n' + names.join('\n'));
  if (!name || !decks[name]) return;
  AppState.deck = decks[name].deck;
  AppState.cmdCard = decks[name].cmd || null;
  AppState.deckName = name;
  document.getElementById('deckNameInput').value = name;
  saveDeckToHash();
  render();
  closeMenu();
  showToast(name + ' を読込みました');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
