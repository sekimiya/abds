<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script>if(!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&!location.search.includes('force')){location.replace('./decks.html');}</script>
<title>デッキ一覧 - ABDS Mobile</title>
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;height:100%;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:#0f0f0f;color:#e0e0e0;font-family:'Segoe UI','Hiragino Sans',sans-serif;min-height:100vh;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
a{color:#68efbd;text-decoration:none}
button{cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
select,input{font-family:inherit}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:#1a1a1a}
::-webkit-scrollbar-thumb{background:#444;border-radius:2px}

:root{
  --bg:#0f0f0f;--bg2:#151515;--bg-card:#1a1a1a;
  --accent:#68efbd;--gold:#ffe082;
}

/* ===== HEADER (36px) ===== */
.app-header{
  display:flex;align-items:center;
  background:linear-gradient(135deg,#1e2924,#1e2924);
  border-bottom:2px solid var(--accent);
  padding:0 8px;height:36px;flex-shrink:0;gap:6px;
  position:sticky;top:0;z-index:100;
}
.hamburger-btn{
  background:#222;border:1px solid #555;border-radius:4px;color:#ccc;
  padding:2px 8px;font-size:1.1rem;line-height:1;min-height:28px;flex-shrink:0;
}
.hamburger-btn:hover{color:var(--accent)}
.hdr-logo{color:var(--accent);font-weight:bold;font-size:0.75rem;font-style:italic;letter-spacing:1px;white-space:nowrap}
.hdr-title{color:#fff;font-size:0.85rem;font-weight:bold;white-space:nowrap}
.hdr-spacer{flex:1}
.hdr-back{
  background:#222;border:1px solid #555;border-radius:4px;
  color:#ccc;padding:2px 8px;font-size:0.7rem;min-height:28px;
  display:flex;align-items:center;gap:3px;white-space:nowrap;text-decoration:none;
}
.hdr-back:hover{border-color:var(--accent);color:var(--accent)}

/* ===== RIGHT SLIDE MENU (280px) ===== */
.menu-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300;display:none;
}
.menu-overlay.open{display:block}
.menu-panel{
  position:fixed;top:0;right:-280px;width:280px;height:100%;
  background:var(--bg2);border-left:2px solid var(--accent);
  z-index:301;transition:right 0.3s ease;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:12px;padding-top:calc(12px + env(safe-area-inset-top));
  display:flex;flex-direction:column;gap:8px;
}
.menu-panel.open{right:0}
.menu-close{position:absolute;top:12px;right:12px;background:none;border:none;color:#888;font-size:1.3rem}
.menu-title{color:var(--accent);font-weight:bold;font-size:0.9rem;margin-bottom:4px}
.menu-section-label{color:#888;font-size:0.7rem;padding:0.4rem 0 0.2rem;text-transform:uppercase;letter-spacing:1px}
.menu-item{
  display:flex;align-items:center;gap:0.5rem;
  background:transparent;border:1px solid transparent;border-radius:6px;
  color:#ccc;padding:0.5rem 0.6rem;font-size:0.8rem;
  cursor:pointer;transition:all 0.15s;width:100%;text-align:left;
  min-height:44px;
}
.menu-item:hover{background:#222;border-color:#333;color:var(--accent)}
.menu-item.active{background:#1e2924;border-color:#3a5a4a;color:var(--accent)}
.menu-item .menu-icon{font-size:0.85rem;width:20px;text-align:center;flex-shrink:0}
.menu-badge{
  margin-left:auto;background:#333;color:#888;
  font-size:0.65rem;padding:0.1rem 0.4rem;border-radius:10px;
}
.menu-item.active .menu-badge{background:#3a5a4a;color:var(--accent)}
.menu-nav{
  display:block;padding:0.5rem 0.6rem;border:1px solid #555;border-radius:6px;
  color:#ccc;font-size:0.8rem;text-decoration:none;text-align:center;min-height:44px;
  line-height:2.2;transition:all 0.15s;
}
.menu-nav:hover{border-color:var(--accent);color:var(--accent);background:#1e2924}

/* ===== CONTENT ===== */
.content{padding:0.5rem}

/* ===== DECK CARD ===== */
.deck-entry{
  background:var(--bg-card);border:1px solid #333;border-radius:8px;
  padding:0.6rem;margin-bottom:0.6rem;
}
.deck-entry.deck-entry-eb{
  background:linear-gradient(135deg,#1a1610,#1f1a12);
  border-color:#5a3a10;
}
.deck-entry.deck-entry-sq{
  background:linear-gradient(135deg,#1a1018,#1f1219);
  border-color:#5a1040;
}

.deck-header{display:flex;align-items:flex-start;justify-content:space-between;gap:0.4rem;margin-bottom:0.3rem}
.deck-title{
  color:var(--accent);font-size:0.95rem;font-weight:bold;cursor:pointer;
  transition:color 0.15s;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;
}
.deck-title:hover{color:#a0ffd8}
.deck-meta{color:#888;font-size:0.7rem;margin-bottom:0.3rem}
.deck-comment{color:#aaa;font-size:0.75rem;margin-bottom:0.5rem;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ===== DECK PREVIEW (5-column mobile) ===== */
.deck-preview{
  display:flex;gap:0;
  background:#111;border:1px solid #2a2a2a;border-radius:6px;
  overflow:hidden;padding:0;
}
.dp-unit{
  flex:1;min-width:60px;
  border-right:1px solid #1a1a1a;
  display:flex;flex-direction:column;
  padding:0.15rem;
}
.dp-unit:last-child{border-right:none}

.dp-names{
  text-align:left;font-size:0.5rem;margin-bottom:0.1rem;
  flex-shrink:0;line-height:1.2;
}
.dp-names .dp-ms-name,.dp-names .dp-pl-name{
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.dp-names .dp-ms-name{color:var(--accent)}
.dp-names .dp-pl-name{color:var(--accent)}
.dp-names.names-eb .dp-ms-name,.dp-names.names-eb .dp-pl-name{color:#ffb74d}
.dp-names.names-sq .dp-ms-name,.dp-names.names-sq .dp-pl-name{color:#ff8cc8}

.dp-rarity{
  display:inline-flex;align-items:center;justify-content:center;
  padding:0 0.15rem;border-radius:2px;
  font-size:0.4rem;font-weight:bold;
  min-width:0.8rem;text-align:center;vertical-align:middle;
}
.dp-rarity.rarity-M{background:#5e3a1a;color:#ffcc80}
.dp-rarity.rarity-C{background:#1a3a1a;color:#a5d6a7}
.dp-rarity.rarity-R{background:#1a1a5e;color:#90caf9}
.dp-rarity.rarity-SR{background:#5e1a5e;color:#ce93d8}
.dp-rarity.rarity-U{background:#5e5e1a;color:#fff59d}
.dp-rarity.rarity-P{background:#1a5e5e;color:#80deea}
.dp-rarity.rarity-PR{background:#4a1a4a;color:#f48fb1}
.dp-rarity.rarity-LR{background:#5e4a1a;color:#ffe082}
.dp-rarity.rarity-LE{background:#4a1a1a;color:#ff8a80}
.dp-rarity.rarity-CP{background:#3a3a3a;color:#bdbdbd}

.dp-cost-row{
  display:flex;align-items:center;justify-content:center;gap:1px;
  padding:0.05rem 0.1rem;margin-bottom:0.1rem;
  background:linear-gradient(135deg,#1a1a1a,#1e1e1e);border-radius:3px;
  border:1px solid #2a2a2a;
  font-weight:bold;font-size:0.45rem;
  flex-shrink:0;flex-wrap:nowrap;
}
.dp-cost-val{
  display:inline-flex;align-items:center;gap:1px;
  background:linear-gradient(135deg,#2a1f0a,#3a2a0a);
  border:1px solid #5a4a1a;border-radius:2px;
  padding:0 0.15rem;color:#ffe082;
}
.dp-cost-val .cost-label{color:#aa8a42;font-size:0.35rem}
.dp-cost-val .cost-num{font-size:0.45rem;line-height:1}

.dp-card-img-wrap{
  position:relative;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:3px;
  aspect-ratio:63/88;overflow:hidden;margin-bottom:0.1rem;flex-shrink:0;
}
.dp-card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.dp-card-img-wrap .dp-no-img{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  color:#444;font-size:0.4rem;
}
.dp-card-img-wrap.dp-sqsp{border-color:#ff69b4;border-width:2px;box-shadow:0 0 4px rgba(255,105,180,0.4)}
.dp-card-img-wrap.dp-sq{border-color:#ff69b4;border-width:2px;box-shadow:0 0 4px rgba(255,105,180,0.4)}
.dp-card-img-wrap.dp-eb{border-color:#ff9800;border-width:2px;box-shadow:0 0 4px rgba(255,152,0,0.4)}
.dp-badge{
  position:absolute;top:1px;left:1px;z-index:2;
  font-size:0.35rem;font-weight:bold;padding:0.05rem 0.2rem;border-radius:2px;
  color:#fff;letter-spacing:0.3px;box-shadow:0 1px 2px rgba(0,0,0,0.5);
}
.dp-badge-sqsp,.dp-badge-sq{background:linear-gradient(135deg,#ff69b4,#e91e8c)}
.dp-badge-eb{background:linear-gradient(135deg,#ff9800,#e65100)}

.dp-stats{margin-bottom:0.05rem}
.dp-stat{display:flex;align-items:center;gap:1px;margin-bottom:1px}
.dp-stat-label{color:#888;font-size:0.35rem;width:12px;text-align:right;flex-shrink:0}
.dp-stat-track{flex:0 0 40%;height:6px;background:#1a1a1a;border-radius:1px;overflow:hidden;position:relative;display:flex}
.dp-stat-bar{height:100%;background:#2196f3;transition:width 0.3s}
.dp-stat-value{color:#aaa;font-size:0.35rem;flex:1;min-width:0;text-align:left;padding-left:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== TACTICS & LINKS ===== */
.deck-tactics{margin-top:0.4rem;display:flex;gap:0.3rem;align-items:center;flex-wrap:wrap}
.deck-tactics-label{color:#888;font-size:0.7rem}
.deck-tactics-card{
  background:#1e2924;border:1px solid #3a5a4a;border-radius:4px;
  color:var(--accent);font-size:0.65rem;padding:0.1rem 0.4rem;
  display:inline-flex;align-items:center;gap:3px;
}
.tactics-thumb{width:16px;height:16px;border-radius:2px;object-fit:cover}

.deck-links{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:0.3rem}
.link-chip{
  display:inline-flex;align-items:center;gap:3px;
  background:#222;border:1px solid #555;border-radius:4px;
  padding:0.15rem 0.5rem;font-size:0.7rem;color:#aaa;
}
.link-chip .link-badge{
  font-size:0.5rem;font-weight:bold;padding:0.05rem 0.2rem;
  border-radius:2px;color:#fff;letter-spacing:0.3px;
}
.link-chip .link-name{color:#aaa}
.link-chip.link-sq{border-color:#ff69b4;background:#2a1a24}
.link-chip.link-sq .link-name{color:#ff8cc8}
.link-chip.link-sq .link-badge{background:linear-gradient(135deg,#ff69b4,#e91e8c)}
.link-chip.link-eb{border-color:#ff9800;background:#2a2218}
.link-chip.link-eb .link-name{color:#ffb74d}
.link-chip.link-eb .link-badge{background:linear-gradient(135deg,#ff9800,#e65100)}
.link-chip.link-ab{border-color:#b388ff;background:#1e1a2e}
.link-chip.link-ab .link-name{color:#ce93d8}
.link-chip.link-ab .link-badge{background:linear-gradient(135deg,#b388ff,#7c4dff)}
.link-chip.link-normal{border-color:#555;background:#222}
.link-chip.link-normal .link-name{color:#aaa}

/* ===== ACTION BUTTONS (1行配置, 44px+タッチ) ===== */
.deck-action-row{
  display:flex;gap:4px;margin-top:0.4rem;align-items:center;flex-wrap:wrap;
}
.btn-action{
  background:transparent;border:1px solid #555;border-radius:4px;
  color:#888;padding:0.3rem 0.5rem;font-size:0.7rem;
  transition:all 0.15s;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;
}
.btn-action:hover{border-color:var(--accent);color:var(--accent);background:rgba(104,239,189,0.1)}
.btn-action.btn-copy-deck{border-color:#ffe082;color:#ffe082}
.btn-action.btn-copy-deck:hover{background:rgba(255,224,130,0.15)}
.btn-action.btn-share{border-color:var(--accent);color:var(--accent)}
.btn-action.btn-share:hover{background:rgba(104,239,189,0.15)}
.btn-action.btn-open-sim{background:var(--accent);border-color:var(--accent);color:#1a1a2e;font-weight:700}
.btn-action.btn-open-sim:hover{background:#5dd4a8;border-color:#5dd4a8}
.btn-action.btn-tweet{border-color:#1DA1F2;color:#1DA1F2}
.btn-action.btn-tweet:hover{background:rgba(29,161,242,0.15)}
.btn-action.copied{border-color:var(--accent);color:var(--accent)}
.btn-like{
  background:transparent;border:1px solid #555;border-radius:4px;
  color:#888;padding:0.3rem 0.5rem;font-size:0.7rem;min-height:44px;
  transition:all 0.15s;display:inline-flex;align-items:center;gap:3px;
}
.btn-like:hover{border-color:#ff6b9d;color:#ff6b9d;background:rgba(255,107,157,0.1)}
.btn-like.liked{border-color:#ff6b9d;color:#ff6b9d}
.btn-like .like-heart{font-size:0.85rem}
.btn-like .like-count{font-size:0.7rem;min-width:8px}
.btn-bookmark{
  background:transparent;border:1px solid #555;border-radius:4px;
  color:#888;padding:0.3rem 0.5rem;font-size:0.7rem;min-height:44px;
  transition:all 0.15s;display:inline-flex;align-items:center;gap:3px;
}
.btn-bookmark:hover{border-color:#ffe082;color:#ffe082;background:rgba(255,224,130,0.1)}
.btn-bookmark.bookmarked{border-color:#ffe082;color:#ffe082}
.btn-bookmark .bm-icon{font-size:0.85rem}
.btn-action.btn-delete{border-color:#ff5252;color:#ff5252;min-height:44px}

/* ===== COMMENTS ===== */
.deck-comments{margin-top:0.5rem;border-top:1px solid #2a2a2a;padding-top:0.4rem}
.comments-toggle{
  background:none;border:none;color:#888;font-size:0.7rem;
  padding:0;cursor:pointer;transition:color 0.15s;min-height:44px;
}
.comments-toggle:hover{color:var(--accent)}
.comments-list{margin-top:0.4rem;display:flex;flex-direction:column;gap:0.3rem}
.comment-item{
  background:#111;border:1px solid #2a2a2a;border-radius:4px;
  padding:0.3rem 0.5rem;font-size:0.75rem;
}
.comment-item.is-reply{
  margin-left:1rem;border-left:2px solid #3a5a4a;
  background:#0d1510;
}
.comment-header{display:flex;align-items:center;gap:0.4rem;margin-bottom:0.15rem}
.comment-name{color:var(--accent);font-weight:bold;font-size:0.7rem}
.comment-time{color:#555;font-size:0.6rem}
.comment-text{color:#ccc;line-height:1.4;word-break:break-word;font-size:0.75rem}
.comment-form{display:flex;flex-direction:column;gap:6px;margin-top:0.4rem}
.comment-form-row{display:flex;gap:6px;align-items:center}
.comment-name-input{
  background:#111;border:1px solid #333;border-radius:4px;color:#ccc;
  padding:0.4rem 0.5rem;font-size:0.8rem;flex:1;min-height:44px;
}
.comment-text-input{
  background:#111;border:1px solid #333;border-radius:4px;color:#ccc;
  padding:0.4rem 0.5rem;font-size:0.8rem;width:100%;min-height:60px;
  resize:vertical;font-family:inherit;
}
.comment-name-input:focus,.comment-text-input:focus{border-color:var(--accent);outline:none}
.comment-submit{
  background:#1e2924;border:1px solid #3a5a4a;border-radius:4px;
  color:var(--accent);padding:0.4rem 0.8rem;font-size:0.8rem;
  white-space:nowrap;transition:all 0.15s;flex-shrink:0;min-height:44px;
}
.comment-submit:hover{background:#2a4a35;border-color:var(--accent)}
.comment-submit:disabled{opacity:0.4;cursor:default}
.comment-reply-btn{
  background:none;border:none;color:#555;font-size:0.6rem;
  cursor:pointer;padding:0;margin-left:auto;transition:color 0.15s;min-height:44px;
}
.comment-reply-btn:hover{color:var(--accent)}
.comment-reply-tag{
  display:inline-block;background:#1e2924;border:1px solid #3a5a4a;
  border-radius:3px;color:var(--accent);font-size:0.6rem;
  padding:0 0.3rem;margin-right:0.3rem;vertical-align:middle;
}
.comment-reply-indicator{
  display:inline-flex;align-items:center;gap:4px;
  background:#1e2924;border:1px solid #3a5a4a;border-radius:4px;
  color:var(--accent);font-size:0.65rem;padding:0.15rem 0.4rem;margin-bottom:0.3rem;
}
.comment-reply-indicator .reply-cancel{
  background:none;border:none;color:#888;font-size:0.8rem;
  cursor:pointer;padding:0 0 0 4px;line-height:1;
}
.comment-reply-indicator .reply-cancel:hover{color:#ff5252}

/* ===== TOAST ===== */
.toast-container{position:fixed;top:40px;right:8px;z-index:10000;display:flex;flex-direction:column;gap:6px}
.toast{
  background:var(--bg-card);border:1px solid var(--accent);border-radius:6px;
  color:#e0e0e0;padding:0.4rem 0.8rem;font-size:0.75rem;max-width:280px;
  animation:toastIn 0.3s ease;
}
.toast.fadeout{opacity:0;transition:opacity 0.3s}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* ===== STATES ===== */
.empty-state,.error-state,.loading-state{text-align:center;padding:3rem 1rem}
.empty-state{color:#666}
.empty-state .icon{font-size:2.5rem;margin-bottom:0.6rem;opacity:0.3}
.empty-state p{font-size:0.85rem}
.empty-state .sub{color:#555;font-size:0.7rem;margin-top:0.3rem}
.error-state{color:#ff5252}
.error-state .icon{font-size:2.5rem;margin-bottom:0.6rem}
.error-state p{font-size:0.85rem}
.loading-state{color:#888}
.loading-state .spinner{
  display:inline-block;width:20px;height:20px;
  border:2px solid #333;border-top-color:var(--accent);border-radius:50%;
  animation:spin 0.8s linear infinite;margin-bottom:0.6rem;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== CONFIRM DIALOG ===== */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);
  z-index:200;align-items:center;justify-content:center;
}
.overlay.active{display:flex}
.dialog{
  background:var(--bg-card);border:1px solid #444;border-radius:8px;
  padding:1.2rem;max-width:320px;width:90%;text-align:center;
}
.dialog p{margin-bottom:0.8rem;font-size:0.85rem}
.dialog-btns{display:flex;gap:0.5rem;justify-content:center}
.dialog-btn{
  padding:0.4rem 1rem;border-radius:6px;font-size:0.8rem;
  border:1px solid #555;background:#222;color:#ccc;
  transition:all 0.15s;min-height:44px;
}
.dialog-btn:hover{background:#333;border-color:var(--accent);color:var(--accent)}
.dialog-btn.danger{border-color:#ff5252;color:#ff5252}
.dialog-btn.danger:hover{background:rgba(255,82,82,0.15)}

/* ===== COMPACT MODE (default on) ===== */
body.compact-mode .dp-stats{display:none}
body.compact-mode .dp-unit{min-width:50px}
body.compact-mode .deck-preview{gap:0}
</style>
</head>
<body class="compact-mode">

<div class="app-header">
  <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMenu()">&#9776;</button>
  <span class="hdr-logo">ABDS</span>
  <span class="hdr-title">デッキ一覧</span>
  <span class="hdr-spacer"></span>
  <a class="hdr-back" href="./mobile.html">&#8592; 戻る</a>
</div>

<!-- Right slide menu -->
<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
<div class="menu-panel" id="menuPanel">
  <button class="menu-close" onclick="toggleMenu()">&times;</button>
  <div class="menu-title">メニュー</div>

  <div class="menu-section-label">フィルター</div>
  <button class="menu-item active" id="filterAll" onclick="setFilter('all')">
    <span class="menu-icon">&#9744;</span>すべてのデッキ<span class="menu-badge" id="badgeAll">0</span>
  </button>
  <button class="menu-item" id="filterBookmark" onclick="setFilter('bookmark')">
    <span class="menu-icon">&#9733;</span>ブックマーク<span class="menu-badge" id="badgeBookmark">0</span>
  </button>

  <div class="menu-section-label">ソート</div>
  <button class="menu-item active" id="sortNewest" onclick="setSort('newest')">
    <span class="menu-icon">&#8595;</span>新着順
  </button>
  <button class="menu-item" id="sortLikes" onclick="setSort('likes')">
    <span class="menu-icon">&#9829;</span>イイネ順
  </button>
  <button class="menu-item" id="sortBookmarks" onclick="setSort('bookmarks')">

async function sha256(text) {
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// ================================================================
// ShortUrl - Supabase短縮URL管理
// ================================================================
const ShortUrl = {
  async create(deckCode) {
    try {
      const codeHash = await sha256(deckCode);
      const check = await fetch(SUPABASE_URL + '/rest/v1/short_links?code_hash=eq.' + codeHash + '&select=id', {
        headers: SB_HEADERS
      });
      if (check.ok) {
        const rows = await check.json();
        if (rows.length > 0) return rows[0].id;
      }
      const id = codeHash.substring(0, 8);
      const res = await fetch(SUPABASE_URL + '/rest/v1/short_links', {
        method: 'POST',
        headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
        body: JSON.stringify({ id, deck_code: deckCode, code_hash: codeHash })
      });
      if (res.ok) return id;
      if (res.status === 409) {
        const id2 = codeHash.substring(4, 12);
        const res2 = await fetch(SUPABASE_URL + '/rest/v1/short_links', {
          method: 'POST',
          headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
          body: JSON.stringify({ id: id2, deck_code: deckCode, code_hash: codeHash })
        });
        if (res2.ok) return id2;
      }
      return null;
    } catch { return null; }
  }
};

      fetch(SUPABASE_URL + '/rest/v1/comments?order=created_at.asc', { headers: SB_HEADERS })

function filterByPeriod(decks) {
  if (_currentPeriod === 'all') return decks;
  const now = Date.now();
  const ms = _currentPeriod === 'week' ? 7 * 24 * 3600 * 1000 : 30 * 24 * 3600 * 1000;
  const cutoff = now - ms;
  return decks.filter(d => {
    const ts = d.timestamp || d.created_at;
    if (!ts) return true;
    return new Date(ts).getTime() >= cutoff;
  });
}
function filterByBookmark(decks) {
  if (_currentFilter !== 'bookmark') return decks;
  const bmSet = getBookmarkSet();

function sortDecks(decks) {
  const sorted = decks.slice();

    sorted.sort((a, b) => (b.likes || 0) - (a.likes || 0));
  } else if (_currentSort === 'bookmarks') {
    const bmSet = getBookmarkSet();
    sorted.sort((a, b) => {
      const aBm = bmSet.has(a.id) ? 1 : 0;
      const bBm = bmSet.has(b.id) ? 1 : 0;
      return bBm - aBm || (b.likes || 0) - (a.likes || 0);
    });
  }
  return sorted;
}

}

// ================================================================
// Active links computation
// ================================================================
function computeActiveLinks(deck, cardData) {
  const cards = (deck.cards || []).map(c => typeof c === 'string' ? c : (c.number || ''));
  while (cards.length < 10) cards.push('');

  const linkMap = {};
  for (let i = 0; i < 10; i++) {
    const num = cards[i];
    const detail = cardData[num] || null;
    const ocr = detail?.ocr_data || null;
    if (!ocr) continue;
    const links = ocr.link_abilities || ocr.link_ability || [];
    if (!Array.isArray(links)) continue;

    const isSq = ocr.special_attack?.sp_type === 'SQUAD SP' || !!(ocr.pilot_skill?.has_sq_skill || ocr.pl_skill?.has_sq_skill);
    const isEb = !!(ocr.echoes_beat?.has_eb) || !!(ocr.pilot_skill?.is_eb_skill || ocr.pl_skill?.is_eb_skill);

    links.forEach(link => {
      if (!link.name) return;
      if (!linkMap[link.name]) {
        linkMap[link.name] = { link, count: 0, sqCount: 0, ebCount: 0, abCount: 0 };
      }
      linkMap[link.name].count++;
      if (isSq) linkMap[link.name].sqCount++;
      if (isEb || link.is_eb_link) linkMap[link.name].ebCount++;
      if (link.is_ab_link) linkMap[link.name].abCount++;
    });
  }

  const active = [];
  Object.values(linkMap).forEach(entry => {
    const condMatch = (entry.link.condition || '').match(/(\d+)枚以上/);
    const required = condMatch ? parseInt(condMatch[1]) : 2;
    if (entry.count >= required) {
      const type = entry.abCount > 0 ? 'ab' : (entry.sqCount > 0 ? 'sq' : (entry.ebCount > 0 ? 'eb' : 'normal'));
      active.push({ name: entry.link.name, effect: entry.link.effect || '', type, count: entry.count, required });
    }
  });
  return active;
}

// ================================================================

// ================================================================
function renderDeckPreview(deck, cardData) {
  const cards = (deck.cards || []).map(c => typeof c === 'string' ? c : (c.number || ''));
  while (cards.length < 10) cards.push('');

  let html = '<div class="deck-preview">';
  for (let u = 0; u < 5; u++) {
    const msNum = cards[u];
    const plNum = cards[u + 5];
    const msDetail = cardData[msNum] || null;
    const plDetail = cardData[plNum] || null;
    const msOcr = msDetail?.ocr_data || null;
    const plOcr = plDetail?.ocr_data || null;

    const hasSqSp = msOcr?.special_attack?.sp_type === 'SQUAD SP';
    const hasEb = !!(msOcr?.echoes_beat?.has_eb);
    const plSkill = plOcr?.pilot_skill || plOcr?.pl_skill;
    const hasSqSkill = !!(plSkill?.has_sq_skill);
    const hasEbSkill = !!(plSkill?.is_eb_skill);
    const namesCls = (hasSqSp || hasSqSkill) ? ' names-sq' : (hasEb || hasEbSkill) ? ' names-eb' : '';

    html += '<div class="dp-unit">';

    const msName = msDetail?.name || (msNum || '');
    const plName = plDetail?.name || (plNum || '');
    const msRarity = msOcr?.rarity || '';
    const plRarity = plOcr?.rarity || '';
    const msRarityHtml = msRarity ? `<span class="dp-rarity rarity-${escapeHtml(msRarity)}">${escapeHtml(msRarity)}</span> ` : '';
    const plRarityHtml = plRarity ? `<span class="dp-rarity rarity-${escapeHtml(plRarity)}">${escapeHtml(plRarity)}</span> ` : '';
    if (msName || plName) {
      html += `<div class="dp-names${namesCls}">`;
      html += `<span class="dp-ms-name">${msRarityHtml}${escapeHtml(msName)}</span>`;
      html += `<span class="dp-pl-name">${plRarityHtml}${escapeHtml(plName)}</span>`;
      html += '</div>';
    } else {
      html += '<div class="dp-names">&nbsp;</div>';
    }

    const msCost = safeInt(msOcr?.cost);
    const plCost = safeInt(plOcr?.cost);
    const unitCost = msCost + plCost;
    html += '<div class="dp-cost-row">';
    html += `<span class="dp-cost-val"><span class="cost-label">C</span><span class="cost-num">${unitCost || '-'}</span></span>`;
    html += '</div>';

    // MS card image
    const msHighlight = hasSqSp ? ' dp-sqsp' : (hasEb ? ' dp-eb' : '');
    const msImgUrl = getImageUrl(msDetail);
    const msBadge = hasSqSp ? '<span class="dp-badge dp-badge-sqsp">SQSP</span>'
                 : hasEb ? '<span class="dp-badge dp-badge-eb">EB</span>' : '';
    html += `<div class="dp-card-img-wrap${msHighlight}">`;
    if (msImgUrl) {
      html += `${msBadge}<img src="${msImgUrl}" alt="${escapeHtml(msNum)}" loading="lazy" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'dp-no-img\\'>No Image</div>'">`;
    } else {
      html += `<div class="dp-no-img">${msNum ? escapeHtml(msNum) : 'MS'}</div>`;
    }
    html += '</div>';

    // PL card image
    const plHighlight = hasSqSkill ? ' dp-sq' : (hasEbSkill ? ' dp-eb' : '');
    const plImgUrl = getImageUrl(plDetail);
    const plBadge = hasSqSkill ? '<span class="dp-badge dp-badge-sq">SQ</span>'
                 : hasEbSkill ? '<span class="dp-badge dp-badge-eb">EB</span>' : '';
    html += `<div class="dp-card-img-wrap${plHighlight}">`;
    if (plImgUrl) {
      html += `${plBadge}<img src="${plImgUrl}" alt="${escapeHtml(plNum)}" loading="lazy" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'dp-no-img\\'>No Image</div>'">`;
    } else {
      html += `<div class="dp-no-img">${plNum ? escapeHtml(plNum) : 'PL'}</div>`;
    }
    html += '</div>';

    // Stat bars
    const maxVal = 660;
    const msStats = {
      mobility: safeInt(msOcr?.stats?.mobility),
      ranged: safeInt(msOcr?.stats?.ranged_attack),
      melee: safeInt(msOcr?.stats?.melee_attack),
      hp: safeInt(msOcr?.stats?.hp)
    };
    const plStats = {
      mobility: safeInt(plOcr?.stats?.mobility),
      ranged: safeInt(plOcr?.stats?.ranged_attack),
      melee: safeInt(plOcr?.stats?.melee_attack),
      hp: safeInt(plOcr?.stats?.hp)
    };
    const statDefs = [
      {key:'mobility', label:'機動'},
      {key:'ranged', label:'遠距'},
      {key:'melee', label:'近距'},
      {key:'hp', label:'HP'}
    ];
    html += '<div class="dp-stats">';
    statDefs.forEach(s => {
      const base = msStats[s.key] + plStats[s.key];
      const pct = Math.min((base / maxVal) * 100, 100);
      html += '<div class="dp-stat">';
      html += `<span class="dp-stat-label">${s.label}</span>`;
      html += `<div class="dp-stat-track"><div class="dp-stat-bar" style="width:${pct}%"></div></div>`;
      html += `<span class="dp-stat-value">${base || '-'}</span>`;
      html += '</div>';
    });
    html += '</div>';

    html += '</div>'; // .dp-unit
  }
  html += '</div>'; // .deck-preview
  return html;
}

// ================================================================
// Render deck list (mobile layout)
// ================================================================
async function renderDecks() {
  const decks = await fetchDecks();
  if (decks === null) return;

  if (decks.length === 0) {
    document.getElementById('deckList').innerHTML =
      '<div class="empty-state"><div class="icon">&#x1F0CF;</div><p>まだ投稿されたデッキはありません</p><div class="sub">デッキエディターでデッキを作成・投稿できます</div></div>';
    return;
  }

  const allNumbers = new Set();
  decks.forEach(d => {
    (d.cards || []).forEach(c => {
      const num = typeof c === 'string' ? c : (c.number || '');
      if (num) allNumbers.add(num);
    });
  });

  const [cardData, tacticsMap] = await Promise.all([
    fetchCardImages([...allNumbers]),
    fetchTacticsMap()
  ]);

  _cachedDecks = decks;
  _cachedCardData = cardData;
  _cachedTacticsMap = tacticsMap;

  renderDeckList(decks, cardData, tacticsMap);
}

function renderDeckList(decks, cardData, tacticsMap) {
  let filtered = filterByPeriod(decks);
  filtered = filterByBookmark(filtered);
  const sorted = sortDecks(filtered);

  if (sorted.length === 0) {
    document.getElementById('deckList').innerHTML =
      '<div class="empty-state"><p>条件に一致するデッキがありません</p></div>';
    updateBadgeCounts(decks.length);
    return;
  }

  let html = '';
  sorted.forEach((deck, idx) => {
    const name = escapeHtml(deck.deck_name || '無名デッキ');
    const ts = deck.timestamp ? new Date(deck.timestamp).toLocaleString('ja-JP') : '';
    const comment = deck.comment ? escapeHtml(deck.comment).replace(/\n/g, '<br>') : '';
    const deckId = deck.id || '';

    const activeLinks = computeActiveLinks(deck, cardData);
    const hasSqLink = activeLinks.some(l => l.type === 'sq');
    const hasEbLink = activeLinks.some(l => l.type === 'eb');
    const hasAbLink = activeLinks.some(l => l.type === 'ab');
    const deckBgCls = hasSqLink ? ' deck-entry-sq' : (hasEbLink ? ' deck-entry-eb' : '');

    html += `<div class="deck-entry${deckBgCls}" data-id="${deckId}">`;

    // SQ/EB/AB Links at top (with icons)
    const specialLinks = activeLinks.filter(l => l.type === 'sq' || l.type === 'eb' || l.type === 'ab');
    const normalLinks = activeLinks.filter(l => l.type === 'normal');
    if (specialLinks.length > 0) {
      html += '<div class="deck-links">';
      specialLinks.forEach(lk => {
        const typeCls = `link-${lk.type}`;
        const badgeLabel = lk.type === 'sq' ? 'SQ' : lk.type === 'eb' ? 'EB' : 'AB';
        html += `<span class="link-chip ${typeCls}"><span class="link-badge">${badgeLabel}</span><span class="link-name">${escapeHtml(lk.name)}</span></span>`;
      });
      html += '</div>';
    }

    // Header: deck name (tap to open in simulator)
    html += `<div class="deck-header">`;
    html += `<a class="deck-title" href="${escapeHtml(getDeckV2Url(deck))}">${name}</a>`;
    html += `</div>`;

    // Meta
    const author = deck.author ? escapeHtml(deck.author) : '';
    if (ts || author) {
      html += '<div class="deck-meta">';
      if (author) html += `<span style="color:var(--accent)">${author}</span>`;
      if (author && ts) html += ' ・ ';
      if (ts) html += ts;
      html += '</div>';
    }
    if (comment) html += `<div class="deck-comment">${comment}</div>`;

    // Tactics
    if (deck.tactics_main || deck.tactics_sub) {
      html += '<div class="deck-tactics">';
      html += '<span class="deck-tactics-label">作戦:</span>';
      if (deck.tactics_main) {
        const t = tacticsMap[deck.tactics_main];
        const tName = t ? t.name : deck.tactics_main;
        html += `<span class="deck-tactics-card">${escapeHtml(tName)}</span>`;
      }
      if (deck.tactics_sub) {
        const t = tacticsMap[deck.tactics_sub];
        const tName = t ? t.name : deck.tactics_sub;
        html += `<span class="deck-tactics-card">${escapeHtml(tName)}</span>`;
      }
      html += '</div>';
    }
    if (activeLinks.length > 0) {
      html += '<div class="deck-links">';
      html += '<span style="color:#888;font-size:0.7rem">LINK:</span>';
      activeLinks.forEach(lk => {
        if (lk.type !== 'normal') {
          const typeCls = `link-${lk.type}`;
          const badgeLabel = lk.type === 'sq' ? 'SQ' : lk.type === 'eb' ? 'EB' : 'AB';
          html += `<span class="link-chip ${typeCls}"><span class="link-badge">${badgeLabel}</span><span class="link-name">${escapeHtml(lk.name)}</span></span>`;
        } else {
          html += `<span class="link-chip link-normal"><span class="link-name">${escapeHtml(lk.name)}</span></span>`;
        }
      });
      html += '</div>';
    }

    // Preview
    html += renderDeckPreview(deck, cardData);

    // Action buttons
    html += '<div class="deck-action-row">';
    html += `<button class="btn-action btn-open-sim" data-idx="${idx}">デッキシミュで表示</button>`;
    html += `<button class="btn-action btn-copy-deck" data-idx="${idx}">デッキを保存</button>`;
    html += `<button class="btn-action btn-share" data-idx="${idx}">共有URL</button>`;
    html += `<button class="btn-action btn-tweet" data-idx="${idx}">Twitterに投稿</button>`;
    if (deckId) {
      const likes = deck.likes || 0;
      const liked = isLiked(deckId);
      html += `<button class="btn-like${liked ? ' liked' : ''}" data-id="${deckId}"><span class="like-heart">${liked ? '&#9829;' : '&#9825;'}</span><span class="like-count">${likes || ''}</span></button>`;
      const bm = isBookmarked(deckId);
      html += `<button class="btn-bookmark${bm ? ' bookmarked' : ''}" data-id="${deckId}"><span class="bm-icon">${bm ? '&#9733;' : '&#9734;'}</span></button>`;
      if (deck.has_delete_password) {
        html += `<button class="btn-action btn-delete" data-id="${deckId}">削除</button>`;
      }
    }
    html += '</div>';

    // Comments (collapsible)
    if (deckId) {
      const comments = deck.comments || [];
      html += `<div class="deck-comments" data-deck-id="${deckId}">`;
      html += `<button class="comments-toggle" data-deck-id="${deckId}">コメント (${comments.length}) ▼</button>`;
      html += `<div class="comments-body" id="comments-${deckId}" style="display:none">`;
      html += `<div class="comments-list" id="clist-${deckId}">`;
      comments.forEach(c => {
        const cTime = c.created_at ? new Date(c.created_at).toLocaleString('ja-JP') : '';
        const cName = escapeHtml(c.name || 'アースノイド');
        html += `<div class="comment-item" data-comment-id="${c.id}" data-comment-name="${cName}"><div class="comment-header"><span class="comment-name">${cName}</span><span class="comment-time">${cTime}</span><button class="comment-reply-btn" data-deck-id="${deckId}" data-reply-name="${cName}">返信</button></div><div class="comment-text">${escapeHtml(c.text).replace(/\n/g, '<br>')}</div></div>`;
      });
      html += '</div>';
      html += `<div id="reply-indicator-${deckId}" style="display:none"></div>`;
      html += '<div class="comment-form">';
      html += `<textarea class="comment-text-input" id="ctext-${deckId}" placeholder="コメント..." maxlength="500" rows="2"></textarea>`;
      html += '<div class="comment-form-row">';
      html += `<input class="comment-name-input" id="cname-${deckId}" placeholder="${getDefaultName()}" maxlength="20">`;
      html += `<button class="comment-submit" data-deck-id="${deckId}">送信</button>`;
      html += '</div></div></div></div>';
    }

    html += '</div>'; // .deck-entry
  });

  document.getElementById('deckList').innerHTML = html;

  // --- Event listeners ---

  // Share URL
  document.querySelectorAll('.btn-share').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const deck = sorted[parseInt(el.dataset.idx)];
      copyShareUrl(deck, el);
    });
  });

  // Open in simulator
  document.querySelectorAll('.btn-open-sim').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const deck = sorted[parseInt(el.dataset.idx)];
      const code = generateDeckCode(deck);
      window.location.href = 'mobile.html?d=' + encodeURIComponent(code);
    });
  });

  // Copy deck
  document.querySelectorAll('.btn-copy-deck').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const deck = sorted[parseInt(el.dataset.idx)];
      copyDeckToLocal(deck, el);
    });
  });

  // Tweet buttons
  document.querySelectorAll('.btn-tweet').forEach(el => {
    el.addEventListener('click', async e => {
      e.stopPropagation();
      const deck = sorted[parseInt(el.dataset.idx)];
      const name = deck.deck_name || 'デッキ';
      const code = generateDeckCode(deck);
      const fallbackUrl = getDeckV2Url(deck);
      // 先にウィンドウを開いてポップアップブロック回避
      const w = window.open('about:blank', '_blank');
      const base = location.origin + location.pathname.replace(/[^/]*$/, '') + 'mobile.html';
      const sc = await ShortUrl.create(code);
      const url = sc ? base + '#s:' + sc : fallbackUrl;
      const text = `${name} のデッキレシピ #アーセナルベース #ABDS`;
      const tweetUrl = 'https://x.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(url);
      if (w) {
        w.location.href = tweetUrl;
      } else {
        location.href = tweetUrl;
      }
    });
  });

  // Like
  document.querySelectorAll('.btn-like').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      likeDeck(el.dataset.id, el);
    });
  });

  // Bookmark
  document.querySelectorAll('.btn-bookmark').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      toggleBookmark(el.dataset.id, el);
    });
  });

  // Delete
  document.querySelectorAll('.btn-delete').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      openDeleteDialog(el.dataset.id);
    });
  });

  // Comment toggles
  document.querySelectorAll('.comments-toggle').forEach(el => {
    el.addEventListener('click', () => {
      const body = document.getElementById('comments-' + el.dataset.deckId);
      if (body.style.display === 'none') {
        body.style.display = '';
        el.textContent = el.textContent.replace('▼', '▲');
      } else {
        body.style.display = 'none';
        el.textContent = el.textContent.replace('▲', '▼');
      }
    });
  });

  // Reply buttons
  document.querySelectorAll('.comment-reply-btn').forEach(el => {
    el.addEventListener('click', () => {
      setReplyTo(el.dataset.deckId, el.dataset.replyName);
    });
  });

  // Comment submit
  document.querySelectorAll('.comment-submit').forEach(el => {
    el.addEventListener('click', async () => {
      const deckId = el.dataset.deckId;
      const nameInput = document.getElementById('cname-' + deckId);
      const textInput = document.getElementById('ctext-' + deckId);
      const text = textInput.value.trim();
      if (!text) { showToast('コメントを入力してください'); return; }
      const replyTo = _replyState[deckId] || null;
      const commentName = nameInput.value.trim() || getDefaultName();
      el.disabled = true;
      try {
        const commentId = crypto.randomUUID ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10);
        const now = new Date().toISOString();
        const payload = {
          id: commentId,
          deck_id: deckId,
          name: commentName,
          text: replyTo ? `@${replyTo} ${text}` : text,
          created_at: now
        };
        const res = await fetch(SUPABASE_URL + '/rest/v1/comments', {
          method: 'POST',
          headers: { ...SB_HEADERS, 'Prefer': 'return=representation' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          const arr = await res.json();
          const c = arr[0] || payload;
          const cTime = c.created_at ? new Date(c.created_at).toLocaleString('ja-JP') : '';
          const cName = escapeHtml(c.name || 'アースノイド');
          const replyCls = replyTo ? ' is-reply' : '';
          const list = document.getElementById('clist-' + deckId);
          list.insertAdjacentHTML('beforeend',
            `<div class="comment-item${replyCls}" data-comment-name="${cName}"><div class="comment-header"><span class="comment-name">${cName}</span><span class="comment-time">${cTime}</span><button class="comment-reply-btn" data-deck-id="${deckId}" data-reply-name="${cName}">返信</button></div><div class="comment-text">${escapeHtml(c.text).replace(/\n/g, '<br>')}</div></div>`
          );
          list.querySelector('.comment-item:last-child .comment-reply-btn')?.addEventListener('click', function() {
            setReplyTo(this.dataset.deckId, this.dataset.replyName);
          });
          textInput.value = '';
          clearReplyTo(deckId);
          const toggle = document.querySelector(`.comments-toggle[data-deck-id="${deckId}"]`);
          const count = list.querySelectorAll('.comment-item').length;
          toggle.textContent = `コメント (${count}) ▲`;
          showToast('コメントを投稿しました');
        } else {
          const err = await res.text();
          console.error('Comment insert error:', err);
          showToast('コメントの投稿に失敗しました');
        }
      } catch { showToast('通信エラー'); }
      el.disabled = false;
    });
  });

  updateBadgeCounts(decks.length);
}

renderDecks();
</script>
