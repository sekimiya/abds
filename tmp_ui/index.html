<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABD Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <!-- Header content... -->
        </header>

        <div class="main-content-wrapper">
            <table class="grid-table">
                <tbody>
                    <!-- Row 1: Cards -->
                    <tr>
                        <td class="label-cell"></td>
                        <td class="unit-cell">
                            <div class="unit-header"><span class="unit-cost">4</span><div class="terrain-info"><span>地上<b>A</b></span><span>宇宙<b>S</b></span><span>水中<b>C</b></span><span>砂漠<b>C</b></span></div></div>
                            <div class="card-pair"><img src="https://www.gundam-ab.com/images/cardlist/card/FQ01-001.jpg?v9"><img src="https://www.gundam-ab.com/images/cardlist/card/FQ01-036_b.jpg?v9"></div>
                        </td>
                        <td class="unit-cell">
                            <div class="unit-header"><span class="unit-cost">5</span><div class="terrain-info"><span>地上<b>A</b></span><span>宇宙<b>S</b></span><span>水中<b>B</b></span><span>砂漠<b>C</b></span></div></div>
                            <div class="card-pair"><img src="https://www.gundam-ab.com/images/cardlist/card/FQ01-005.jpg?v9"><img src="https://www.gundam-ab.com/images/cardlist/card/FQ01-045_b.jpg?v9"></div>
                        </td>
                        <td class="unit-cell">
                            <div class="unit-header"><span class="unit-cost">9</span><div class="terrain-info"><span>地上<b>A</b></span><span>宇宙<b>S</b></span><span>水中<b>C</b></span><span>砂漠<b>C</b></span></div></div>
                            <div class="card-pair"><img src="https://www.gundam-ab.com/images/cardlist/card/FQ01-003.jpg?v9"><img src="https://www.gundam-ab.com/images/cardlist/card/FQ01-038_b.jpg?v9"></div>
                        </td>
                        <td class="unit-cell">
                            <div class="unit-header"><span class="unit-cost">5</span><div class="terrain-info"><span>地上<b>A</b></span><span>宇宙<b>S</b></span><span>水中<b>B</b></span><span>砂漠<b>C</b></span></div></div>
                            <div class="card-pair"><img src="https://www.gundam-ab.com/images/cardlist/card/FQ01-021.jpg?v9"><img src="https://www.gundam-ab.com/images/cardlist/card/FQ02-044_b.jpg?v9"></div>
                        </td>
                        <td class="unit-cell">
                            <div class="unit-header"><span class="unit-cost">9</span><div class="terrain-info"><span>地上<b>A</b></span><span>宇宙<b>S</b></span><span>水中<b>C</b></span><span>砂漠<b>C</b></span></div></div>
                            <div class="card-pair"><img src="https://www.gundam-ab.com/images/cardlist/card/FQ01-004.jpg?v9"><img src="https://www.gundam-ab.com/images/cardlist/card/FQ01-039_b.jpg?v9"></div>
                        </td>
                    </tr>
                    <!-- Row 2: Type -->
                    <tr>
                        <td class="label-cell">Type</td>
                        <td class="unit-cell"><div class="type-cell"><span class="card-type type-blue">近距離</span><span class="card-type type-red">制圧</span></div></td>
                        <td class="unit-cell"><div class="type-cell"><span class="card-type type-blue">遠距離</span><span class="card-type type-red">殲滅</span></div></td>
                        <td class="unit-cell"><div class="type-cell"><span class="card-type type-blue">遠距離</span></div></td>
                        <td class="unit-cell"><div class="type-cell"><span class="card-type type-green">機動</span><span class="card-type type-yellow">防衛</span></div></td>
                        <td class="unit-cell"><div class="type-cell"><span class="card-type type-blue">近距離</span><span class="card-type type-red">殲滅</span></div></td>
                    </tr>
                    <!-- Row 3: Level -->
                    <tr>
                        <td class="label-cell">Level</td>
                        <td class="unit-cell"><div class="level-cell"><div class="level-bar-container"><div class="level-bar" style="width: 80%;"></div></div><div class="level-details"><span>Zガンダム</span><span>13</span></div><div class="level-details"><span>カミーユ・ビダン</span><span>21</span></div></div></td>
                        <td class="unit-cell"><div class="level-cell"><div class="level-bar-container"><div class="level-bar" style="width: 30%;"></div></div><div class="level-details"><span>Zガンダム(バイオセンサー)</span><span>06</span></div><div class="level-details"><span>ハマーン・カーン</span><span>21</span></div></div></td>
                        <td class="unit-cell"><div class="level-cell"><div class="level-bar-container"><div class="level-bar" style="width: 60%;"></div></div><div class="level-details"><span>ガンダムアストレイゴールド...</span><span>12</span></div><div class="level-details"><span>叢雲劾</span><span>03</span></div></div></td>
                        <td class="unit-cell"><div class="level-cell"><div class="level-bar-container"><div class="level-bar" style="width: 90%;"></div></div><div class="level-details"><span>ゲルググメナース(ルナマ...)</span><span>22</span></div><div class="level-details"><span>ドモン・カッシュ</span><span>28</span></div></div></td>
                        <td class="unit-cell"><div class="level-cell"><div class="level-bar-container"><div class="level-bar" style="width: 50%;"></div></div><div class="level-details"><span>ガンダムアストレイレッドフ...</span><span>12</span></div><div class="level-details"><span>ロウ・ギュール</span><span>12</span></div></div></td>
                    </tr>
                    <!-- Other rows... -->
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
